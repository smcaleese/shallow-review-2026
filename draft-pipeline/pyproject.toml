[project]
name = "shallow-review"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "beautifulsoup4>=4.14.2",
    "jinja2>=3.1.6",
    "diskcache>=5.6.3",
    "numpy>=2.3.4",
    "playwright>=1.55.0",
    "polars>=1.34.0,<2",
    "pydantic>=2.12.3",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "rich>=14.2.0",
    "ruamel-yaml>=0.19.1",
    "scipy>=1.16.2",
    "selenium>=4.37.0",
    "tenacity>=9.1.2",
    "tiktoken>=0.8.0",
    "typer>=0.19.2",
    "zstandard>=0.25.0",
    "pypdf>=7.0.0",
    "arxiv>=4.0.2",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
]

# Installs the shallow_review package (editable) so the scripts in src/ can import it
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shallow_review"]
