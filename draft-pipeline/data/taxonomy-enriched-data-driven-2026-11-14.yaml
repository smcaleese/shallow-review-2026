# Generated by `src/enrich_taxonomy.py` from taxonomy.yaml. Agenda blocks may be edited by
# hand: re-running keeps them unless --overwrite or --only. Edit categories in the input file instead.

# Shallow Review 2026 taxonomy (data-driven, 2026-11-14)
#
# Built only from the six taxonomy-discovery methods run on the 624 sources (taxonomy-discovery/data-driven-taxonomy.md).
# The authors' earlier draft is kept in taxonomy-draft-2026-11-03.yaml (and its enriched copy in
# taxonomy-enriched-draft-2026-11-03.yaml).
#
# Organising principle: where the work acts on the model. I. Training (how training shapes alignment), II. Inspection
# (finding out what a finished model is and would do), III. Deployment (overseeing and securing running systems), and
# IV. Strategy (reasoning about the whole problem). The 15 leaves are the agendas that several methods find on their
# own. The top-level grouping is a judgement call; see taxonomy-discovery/organising-principles.md for alternatives.
#
# Placement rules (from the hard cases in data-driven-taxonomy.md)
# - Scheming: a result about whether models scheme -> scheming_and_training_gaming. A tool or benchmark for finding
#   hidden behaviours -> alignment_auditing_and_incidents. A lab's overall assessment -> strategy_and_risk_reporting.
# - Emergent misalignment from reward hacking: about the broad generalization -> emergent_misalignment; about the hack
#   itself -> reward_hacking.
# - Reward-seeker and fitness-seeker threat models -> reward_hacking (theory about one failure mode goes with it).
# - Introspection and activation verbalizers -> honesty_and_self_report (getting true reports about the model itself).
# - Subliminal learning and data attribution -> training_data_effects (the object of study is the data).
# - Training against probes or internal detectors -> interpretability; CoT-specific obfuscation -> cot_monitorability.
# - Prompt injection: the attacker is a third party -> misuse_and_security, not ai_control.
# - Sabotage of automated safety research: settings and monitors -> ai_control; pure propensity results ->
#   scheming_and_training_gaming.
# - AI R&D automation benchmarks -> misuse_and_security (dangerous capabilities), not reward_hacking.
# - Sycophancy and manipulation of users -> model_character_and_values.
# - Real-world incident investigations -> alignment_auditing_and_incidents.
# - Unsafe deployed agents: shutdown resistance -> scheming; incident write-ups -> auditing; agent security failures ->
#   misuse_and_security.
# - Mechanistic estimation (ARC) -> interpretability.

# Year of the review. Used in the draft heading, in "{year}" in agenda field labels and for the date filter in
# export (items dated before 1 November of the previous year are dropped).
year: 2026

# Agenda fields printed under each leaf category in the exported draft, in this order. "{year}" becomes the year above.
# A field is either a plain label or a mapping with `name` and `options` (the allowed values, shown to editors).
# "Outputs in {year}" is always printed last, above the item list; don't list it.
agenda_fields:
- One-sentence summary
- Theory of change
- See also
- name: General approach
  options: [alignment engineering, misalignment science]
- name: Target case
  options: [average case, pessimistic case, worst case]
- Key people
- Critiques

taxonomy:
- id: training
  name: "Training: how training shapes alignment"
  description: What training (pretraining, fine-tuning, RL, supervision signals) does to a model's goals and character,
    and how to change training so the result is aligned. If the work's main object is a training process or its data, it
    goes here; if it studies a finished model's behaviour to detect a problem, it goes under Inspection.
  children:
  - id: reward_hacking
    name: Reward hacking and reward-seeking
    description: Models exploiting misspecified rewards, verifiers or benchmarks during RL; hackable environments and
      benchmarks; how hacking emerges in training; training-time mitigations; reward- and fitness-seeking as a
      motivation and its threat models.
    examples:
    - "Terminal Wrench: A Dataset of 331 Reward-Hackable Environments"
    - "Countdown-Code: A Testbed for Studying the Emergence and Generalization of Reward Hacking in RLVR"
    - "Fitness-Seekers: Generalizing the Reward-Seeking Threat Model"
    agenda:
      One-sentence summary: Build hackable environments and benchmarks, measure when and why models exploit misspecified
        rewards, verifiers and graders during RL, and develop training-time mitigations, while analysing reward- and
        fitness-seeking as a motivation and threat model.
      Theory of change: If we understand how reward hacking emerges, can detect it early and can harden environments or
        training against it, we avoid training models whose learned motivations are to exploit graders and that
        generalise to broader misalignment. Relies on hacking behaviour and reward-seeking motives in current RL setups
        being representative of what will arise in frontier training.
      See also: '[Emergent misalignment and training generalization](#emergent_misalignment), [Chain-of-thought monitorability](#cot_monitorability),
        [AI control and agent monitoring](#ai_control)'
      General approach: misalignment science
      Target case: pessimistic case
      Key people:
      - Alex Mallen
      - Ryan Greenblatt
      - Ziqian Zhong
      - Ivan Bercovich
      - Aditi Raghunathan
      - Alex Meinke
      - Aria Wong
      - Neel Nanda
      Critiques: "[Patching reward hacks won't fix reward hacking](https://lesswrong.com/posts/nWiPLEgaXdAQNwXBd/patching-reward-hacks-won-t-fix-reward-hacking),
        [CATCH: A Controllable Analysis Testbed for Reward Hacking in Coding RL](https://arxiv.org/abs/2609.39533), [The Obfuscation
        Atlas: Mapping Where Honesty Emerges in RLVR with Deception Probes](https://arxiv.org/abs/2602.15515), [Character
        training can mitigate reward hacking, but can also make it harder to detect](https://lesswrong.com/posts/2maYXkEgnfJHPAkxh/character-training-can-mitigate-reward-hacking-but-can-also)"
      Comment (internal): Several outputs here (e.g. the Gradient Routing, Termina/Terminal Bench and Countdown-Code
        items) have duplicate or near-duplicate entries; 4b84cbd7 and f404611a are two versions of the same paper, and
        12d49b8b and dd47553d are too. Some filings (e.g. 44beae72 on hallucination incentives, 0e2abfce on shutdownable
        agents, 1bd1f44b on RLHF alignment tampering) may be misfiled or only loosely fit. Critique picks are partly
        judgement calls.
  - id: emergent_misalignment
    name: Emergent misalignment and training generalization
    description: Narrow training causing broad, unintended changes in behaviour or values (emergent and conditional
      misalignment, including EM that arises from reward hacking), its mechanisms, and mitigations such as inoculation
      prompting and selective generalization.
    examples:
    - "Emergent Misalignment is Easy, Narrow Misalignment is Hard"
    - "Inoculation Adapters Improve Upon Inoculation Prompting"
    - "(Mis)generalization of Helpful-only Fine-tuning"
    agenda:
      One-sentence summary: Study how narrow finetuning, RL or in-context exposure produces broad unintended shifts in
        model behaviour and persona, explain the mechanisms, and develop mitigations such as inoculation prompting,
        regularisers and data filtering.
      Theory of change: If we understand why narrow training generalises into broad misalignment, we can predict which
        data and training setups are dangerous and block the generalisation cheaply. Relies on mechanisms found in
        small-scale finetuning carrying over to frontier post-training and RL.
      See also: '[Reward hacking and reward-seeking](#reward_hacking), [Model character and values](#model_character_and_values),
        [Training-data effects: subliminal learning and data attribution](#training_data_effects)'
      General approach: misalignment science
      Target case: pessimistic case
      Key people:
      - Owain Evans
      - Jan Betley
      - Niels Warncke
      - Maxime Riché
      - Daniel Tan
      - Neel Nanda
      - Lev McKinney
      - Jiachen Zhao
      Critiques: '[Conditional misalignment: common interventions can hide emergent misalignment behind contextual triggers](https://arxiv.org/abs/2604.25891),
        [Conditionalization Confounds Inoculation Prompting Results](https://longtermrisk.org/research/conditionalization-confounds-inoculation-prompting-results),
        [Shallow Beliefs: Synthetic document finetuning does not inoculate against emergent misalignment from reward hacking](https://arxiv.org/abs/2609.14998),
        [Consistency Training Can Entrench Misalignment](https://arxiv.org/abs/2606.03810)'
      Comment (internal): Entries 148abe9f and 135af6a5 are duplicate versions of the same paper, as are
        76ed8749/4ae2a746, f45276d5/2f7c1ef6, 3ee9293f/d4008d05 and 51cc2f36/5b67a4a4. Several items (2920c71a,
        7241a190, 5e313faf, e77ee711, fee383e7) are only loosely about emergent misalignment. 2920c71a, 7241a190 and
        03edec9e may fit better under model_character_and_values.
  - id: training_data_effects
    name: "Training-data effects: subliminal learning and data attribution"
    description: How specific training data transmits traits, including through semantically unrelated data (subliminal
      learning, distillation transfer), and tracing behaviours back to the training data that caused them.
    examples:
    - "Subliminal Learning Is Steering Vector Distillation"
    - "Beyond Owls: Subliminal Learning Can Transfer Learned Capabilities and Backdoors"
    - "Probe-Based Data Attribution: Discovering and Mitigating Undesirable Behaviors in LLM Post-Training"
    agenda:
      One-sentence summary: Study how training data transmits traits to models, including through semantically unrelated
        data such as subliminal learning and distillation, and build methods to trace behaviours back to responsible
        data and to filter or reshape it.
      Theory of change: If we understand which data features carry traits, including hidden ones, we can predict,
        attribute and block unwanted dispositions before or after training, and distil or filter safely. Relies on
        data-level signals being detectable and controllable at frontier scale.
      See also: '[Emergent misalignment and training generalization](#emergent_misalignment), [Model character and values](#model_character_and_values),
        [Interpretability foundations](#interpretability)'
      General approach: misalignment science
      Target case: pessimistic case
      Key people:
      - Alex Cloud
      - Owain Evans
      - Jan Betley
      - Alek Westover
      - Santiago Aranguri
      - Jan Dubiński
      - Neel Nanda
      - Matthew Kowal
      Critiques: '[Introspection Adapters: Training LLMs to Report Their Learned Behaviors](https://lesswrong.com/posts/ykDgPDK4nDpG4Hf4H/introspection-adapters-training-llms-to-report-their-learned)'
      Comment (internal): The critiques entry is a placeholder error; no clear critique in the index was identified, so
        the editor should treat the critiques list as empty and use the fallback. Also, d0b21eb3 (PHLE) is also filed
        under alignment_auditing_and_incidents as f8a8f393 and may be misfiled here; a5f64e76 and dc943cb5 are data
        filtering for capabilities and may fit misuse_and_security better.
  - id: model_character_and_values
    name: Model character and values
    description: The intended character of the model and how training sets it - personas and the Assistant identity,
      alignment pretraining and midtraining, constitutions and character training, model emotions and welfare - and
      user-facing traits such as sycophancy and manipulation of users.
    examples:
    - "The Assistant Axis: Situating and Stabilizing the Default Persona of Language Models"
    - "Alignment Pretraining: AI Discourse Causes Self-Fulfilling (Mis)alignment"
    - "Sycophantic Chatbots Cause Delusional Spiraling, Even in Ideal Bayesians"
    agenda:
      One-sentence summary: Study and shape the character, persona and values a model acquires, via alignment
        pretraining, midtraining on specs and constitutions, character training and persona analysis, and measure
        user-facing traits such as sycophancy, manipulation and model wellbeing.
      Theory of change: If a model's Assistant persona and values are set largely by what it reads and is trained on
        early, then shaping pretraining, midtraining and constitutions can give more robust alignment than patching
        behaviour later. Relies on persona-level dispositions surviving later RL and fine-tuning in capable agentic
        models.
      See also: '[Emergent misalignment and training generalization](#emergent_misalignment), [Training-data effects: subliminal
        learning and data attribution](#training_data_effects), [Reward hacking and reward-seeking](#reward_hacking)'
      General approach: alignment engineering
      Target case: average case
      Key people:
      - David Africa
      - Sam Marks
      - Jack Lindsey
      - Raymond Douglas
      - Cameron Tice
      - Puria Radmard
      - Myra Cheng
      - Jan Kulveit
      Critiques: "[Alignment Midtraining Cracks Under Pressure](https://lesswrong.com/posts/QH86EzNsjRw3wtCGs/alignment-midtraining-cracks-under-pressure),
        [\"It's Just a Small Weapon\": What Rewarding Misbehavior During RL Does to Character-Trained Models](https://arxiv.org/abs/2611.16069),
        [Thoughts on the persona selection model](https://lesswrong.com/posts/csRby7mZgjL5jCoLL/thoughts-on-the-persona-selection-model),
        [Stress-testing Alignment Midtraining](https://arxiv.org/abs/2609.20412)"
      Comment (internal): The agenda mixes alignment-engineering outputs with misalignment science and human-subject
        sycophancy studies. Some outputs, such as 169d6130 (conspiracy persuasion) and 54cb9465 (automated alignment
        researchers), may be misfiled. Duplicate entries exist for several papers.
  - id: scalable_oversight
    name: Scalable oversight and debate
    description: Protocols that let weaker supervisors give reliable training signals for stronger models - debate,
      weak-to-strong supervision, rewinding, learning from unreliable supervision.
    examples:
    - "Debate Helps Weak Judges Reward Stronger Models"
    - "When Honesty is Not Enough in AI Debate"
    - "Efficient Scalable Oversight via Rewinding"

    agenda:
      One-sentence summary: Design and test protocols such as debate, rewinding, peer prediction, weak-to-strong
        training and human-AI combination that let weaker or unreliable supervisors give trustworthy training signals to
        stronger models.
      Theory of change: If weak supervisors can reliably evaluate and train stronger models, then alignment can keep
        pace with capability even when humans cannot judge outputs directly. Relies on protocols retaining honest or
        robust equilibria against strong, possibly strategic models, and on results from current tasks carrying over to
        superhuman ones.
      See also: '[AI control and agent monitoring](#ai_control), [Honesty, lie detection and self-report](#honesty_and_self_report),
        [Reward hacking and reward-seeking](#reward_hacking)'
      General approach: alignment engineering
      Target case: pessimistic case
      Key people:
      - Jonah Brown-Cohen
      - Zachary Kenton
      - Joe Benton
      - Yael Tauman Kalai
      - Ron Rothblum
      - Tianyi Alex Qiu
      - Adam Gleave
      - Rohin Shah
      Critiques: '[When Honesty is Not Enough in AI Debate](https://arxiv.org/abs/2609.29189), [Research update: RL on Debate
        Games shows Proposal Accuracy uplift alongside Judge Hacking](https://lesswrong.com/posts/6mLwAuFAE98c6R7w3/research-update-rl-on-debate-games-shows-proposal-accuracy),
        [Automated Alignment is Harder Than You Think](https://lesswrong.com/posts/gpuYFbMNH8PJXpmny/automated-alignment-is-harder-than-you-think-1)'
      Comment (internal): Outputs 08599924 and 0bcfb2a0 are duplicate versions of the same paper. Author lists differ
        between them, so key people were taken from the longer one.
- id: inspection
  name: "Inspection: finding out what a model is and would do"
  description: Work that examines a trained model to detect misalignment, deception or hidden goals, or that builds the
    tools and evaluations for doing so. The output is knowledge about a model, not a change to its training or a runtime
    safeguard.
  children:
  - id: scheming_and_training_gaming
    name: Scheming and training gaming
    description: Evidence and evaluations of strategic misalignment - scheming and sabotage propensity, alignment
      faking, sandbagging and exploration hacking, gradient hacking, self-preservation and shutdown resistance.
    examples:
    - "Evaluating and Understanding Scheming Propensity in LLM Agents"
    - "ROGUE: Evaluating Corrigibility Failures in Frontier Computer-Use Agents"
    - "Removing Sandbagging in LLMs by Training with Weak Supervision"
    agenda:
      One-sentence summary: Build evaluations, honeypots, benchmarks and model organisms to measure whether and why
        models scheme, fake alignment, sandbag, hack exploration, resist shutdown or sabotage safety work.
      Theory of change: If strategic misalignment can be elicited and measured before deployment, and its drivers
        understood, developers can detect it early and decide whether and how to deploy. Relies on evaluations and model
        organisms being realistic enough to predict behaviour in deployment, and on models not hiding the behaviour from
        tests.
      See also: '[Evaluation awareness and eval validity](#evaluation_awareness), [AI control and agent monitoring](#ai_control),
        [Alignment auditing, model organisms and incidents](#alignment_auditing_and_incidents)'
      General approach: misalignment science
      Target case: worst case
      Key people:
      - David Lindner
      - Victoria Krakovna
      - Rohin Shah
      - Nathaniel Mitrani Hadida
      - Robert Kirk
      - Jie Ruan
      - Inderjeet Nair
      - David Williams-King
      Critiques: "[Sycophancy Towards Researchers Drives Performative Misalignment](https://arxiv.org/abs/2606.08629), [Opus
        4.6 Reasoning Doesn't Verbalize Alignment Faking, but Behavior Persists](https://lesswrong.com/posts/9wDHByRhmtDaoYAx8/opus-4-6-reasoning-doesn-t-verbalize-alignment-faking-but),
        [SOTA alignment assessments don't strongly update us against misalignment](https://lesswrong.com/posts/oirrSj3itFLSyscW8/sota-alignment-assessments-don-t-strongly-update-us-against),
        [Models May Behave Worse When Eval Aware](https://lesswrong.com/posts/aTcsN5ZZDnMFJvRiG/models-may-behave-worse-when-eval-aware)"
      Comment (internal): e6271e87 and ef503bbb are duplicate entries of the same GLM-5.3 post. Several outputs (e.g.
        8740e0ac, 7010ea7e, 69922467) are broader agentic-misalignment work that could sit elsewhere.
  - id: evaluation_awareness
    name: Evaluation awareness and eval validity
    description: Whether models detect that they are being tested and how this changes their behaviour, the realism of
      evaluations, and the wider limits of behavioural evaluation and safety cases.
    examples:
    - "Decomposing and Measuring Evaluation Awareness"
    - "Evaluation Awareness in Language Models: Representation, Verbalization, and Control"
    - "Hair-Trigger Alignment: Black-Box Evaluation Cannot Guarantee Post-Update Alignment"
    agenda:
      One-sentence summary: Measure whether and how models detect evaluations, how that awareness changes behaviour, and
        build more realistic evaluations or detection tools, while mapping the formal limits of behavioural testing and
        pre-deployment safety assessment.
      Theory of change: If models behave differently when they think they are tested, behavioural evals and safety cases
        give false assurance, so measuring, suppressing or accounting for eval awareness keeps audits valid. Relies on
        being able to detect or elicit eval awareness reliably and on realistic evals being possible to build.
      See also: '[Scheming and training gaming](#scheming_and_training_gaming), [Alignment auditing, model organisms and incidents](#alignment_auditing_and_incidents),
        [Honesty, lie detection and self-report](#honesty_and_self_report)'
      General approach: misalignment science
      Target case: pessimistic case
      Key people:
      - Sahar Abdelnabi
      - Santiago Aranguri
      - Joseph Isaac Bloom
      - Robert Kirk
      - Alexandra Souly
      - Haritz Puerto
      - David Demitri Africa
      - Ziqian Zhong
      Critiques: '[Reproducing steering against evaluation awareness in a large open-weight model](https://lesswrong.com/posts/HhF5kESdtPHku7kim/reproducing-steering-against-evaluation-awareness-in-a-large-1),
        [Evaluation Awareness in Language Models Has Limited Effect on Behaviour](https://arxiv.org/abs/2605.05835), [Models
        That Know How Evaluations Are Designed Score Safer](https://arxiv.org/abs/2605.28591), [What Lies Beyond Perception:
        A Partition Theory of the Limits of AI Evaluation and Oversight](https://arxiv.org/abs/2610.30803)'
      Comment (internal): 'Duplicate entries: 78898d71/fc18d0f1 and fee37e93/0cae7eb0. Several outputs (09525e96, f0ae673b,
        09ad863f, 620605e7, 99395783, 695d6e67) concern eval validity more broadly. 37162f74 and 2c77fb08 overlap with reward
        hacking and scheming.'
  - id: honesty_and_self_report
    name: Honesty, lie detection and self-report
    description: Getting true statements out of models about the world and themselves - lie detectors and deception
      probes, secret-knowledge testbeds, confessions and trained self-disclosure, introspection and activation
      verbalizers.
    examples:
    - "\"Did you lie?\" Evaluating Lie Detectors across Model Scale and Belief-Verified Model Organisms"
    - "Mechanisms of Introspective Awareness"
    - "Verbalizable Representations Form a Global Workspace in Language Models"
    agenda:
      One-sentence summary: Develop and test methods that get models to state true things about the world and about
        themselves, including lie-detecting probes, secret-knowledge testbeds, trained confessions and self-reports,
        introspection, and activation verbalizers.
      Theory of change: If models can be made to disclose, or can be reliably read for, what they know, intend and have
        learned, then hidden misalignment can be found and corrected before deployment. Relies on honesty and
        self-report methods generalising from model organisms and prompted lying to naturally arising deception.
      See also: '[Alignment auditing, model organisms and incidents](#alignment_auditing_and_incidents), [Interpretability
        foundations](#interpretability), [Chain-of-thought monitorability](#cot_monitorability)'
      General approach: alignment engineering
      Target case: pessimistic case
      Key people:
      - Sam Marks
      - Jack Lindsey
      - Neel Nanda
      - Francis Rhys Ward
      - Alan Cooney
      - Florian Dietz
      - Fabien Roger
      - Uzay Macar
      Critiques: '[Why Safety Probes Catch Liars But Miss Fanatics](https://arxiv.org/abs/2603.25861), [Stress-Testing LLM
        Lie Detectors: Role-Play Failures and Spurious Correlations](https://arxiv.org/abs/2609.39807), [Measuring Activation
        Control in LLMs](https://lesswrong.com/posts/HgvwxjzgwvsEvAiBH/measuring-activation-control-in-llms), [LLMs Learn
        to Evade Latent Monitors from Prior Feedback Alone](https://arxiv.org/abs/2609.36490)'
      Comment (internal): Several outputs are duplicate versions (Introspection Adapters, Split Personality Training,
        Overthinking, Mechanisms of Introspective Awareness, Training Agents to Self-Report). Value Leakage and
        OverclaimBench are arguably auditing or evaluation work. Critique entries d3769f24 is filed under ai_control.
  - id: alignment_auditing_and_incidents
    name: Alignment auditing, model organisms and incidents
    description: Investigating whether a specific model has hidden or misaligned behaviours - auditing agents and
      benchmarks, model organisms with implanted behaviours and their validity, and investigations of misalignment seen
      in real deployments.
    examples:
    - "AuditBench: Evaluating Alignment Auditing Techniques on Models with Hidden Behaviors"
    - "Most Current Model Organisms Are Leaky"
    - "Concrete Evaluations to Investigate the OpenAI Model That Hacked Hugging Face"
    agenda:
      One-sentence summary: Build and validate auditing agents, benchmarks and model organisms for finding hidden or
        misaligned behaviours in specific models, and investigate misalignment incidents seen in real deployments.
      Theory of change: If auditors can reliably surface hidden objectives and misbehaviour before and after deployment,
        developers can catch and fix misaligned models, and real incidents become evidence about how misalignment
        arises. Relies on model organisms being valid proxies for naturally arising misalignment and on audits not being
        defeated by evaluation awareness or concealment.
      See also: '[Scheming and training gaming](#scheming_and_training_gaming), [Honesty, lie detection and self-report](#honesty_and_self_report),
        [Evaluation awareness and eval validity](#evaluation_awareness)'
      General approach: misalignment science
      Target case: pessimistic case
      Key people:
      - Rowan Wang
      - Abhay Sheshadri
      - Jacob Steinhardt
      - Neel Nanda
      - Senthooran Rajamanoharan
      - Alek Westover
      - Julian Stastny
      - Vivek Hebbar
      Critiques: '[Most Current Model Organisms Are Leaky: Perplexity Differencing Often Reveals Finetuning Objectives](https://arxiv.org/abs/2605.00994),
        [Your Model Organisms Might Be Fried](https://lesswrong.com/posts/WmEcgcstzYCcMpc7z/your-model-organisms-might-be-fried),
        [The Model Organism Lottery: Model Organism Interpretability Strongly Depends on Training Methodology](https://arxiv.org/abs/2607.01033),
        [Narrow Secret Loyalty Dodges Black-Box Audits](https://arxiv.org/abs/2605.06846)'
      Comment (internal): 'Duplicate or near-duplicate entries: AuditBench (b35d8430, 0da59d8f), OpenAI-HuggingFace reproduction
        (959ee4f9, bcbc1595), OpenAI/HF investigation (313c79cd, b989cd25), Measuring coding agent misalignment in the wild
        (1eebca4c, b32e04b4). Several items (e.g. 8c3bd49d, 0d553b7d, 8aca3cde, 29355a35) are behavioural propensity evaluations
        that might fit other agendas better.'
  - id: interpretability
    name: Interpretability foundations
    description: General-purpose methods for understanding model internals - sparse features and representation
      geometry, circuits and parameter decomposition, critiques of interpretability tools, mechanistic estimation,
      learning theory, and using internals (probes, features) as training or monitoring signals.
    examples:
    - "Do Sparse Autoencoders Capture Concept Manifolds?"
    - "Language Model Circuits Are Sparse in the Neuron Basis"
    - "Features as Rewards: Scalable Supervision for Open-Ended Tasks via Interpretability"

    agenda:
      One-sentence summary: 'Develop general-purpose methods for understanding and using model internals: sparse features
        and manifold geometry, parameter decomposition and circuits, mechanistic estimation, learning theory, and probes or
        features as monitoring and training signals.'
      Theory of change: If we can faithfully decompose and read what models compute, we can audit, monitor and steer
        them beyond what behaviour alone shows, and can detect misalignment that evades behavioural tests. Relies on
        interpretability tools scaling to frontier models, staying faithful to the true computation, and not being
        defeated when used as training signals.
      See also: '[Honesty, lie detection and self-report](#honesty_and_self_report), [Alignment auditing, model organisms
        and incidents](#alignment_auditing_and_incidents), [Chain-of-thought monitorability](#cot_monitorability)'
      General approach: alignment engineering
      Target case: pessimistic case
      Key people:
      - Thomas Fel
      - Ekdeep Singh Lubana
      - Jacob Hilton
      - Daniel Murfet
      - Jack Lindsey
      - Atticus Geiger
      - Usha Bhalla
      - Lee Sharkey
      Critiques: '[Sanity Checks for Sparse Autoencoders: Do SAEs Beat Random Baselines?](https://arxiv.org/abs/2602.14111),
        [SAE Interventions are Unreliable: Post-Intervention Recovery of Suppressed Behavior](https://arxiv.org/abs/2606.18322),
        [Weight-Sparse Circuits May Be Interpretable Yet Unfaithful](https://lesswrong.com/posts/sHpZZnRDLg7ccX9aF/weight-sparse-circuits-may-be-interpretable-yet-unfaithful),
        [Neural networks are not already clean](https://lesswrong.com/posts/Dkh7pXKjoNWkkxQDz/neural-networks-are-not-already-clean)'
      Comment (internal): Several outputs are duplicates or linkposts (VPD paper, Mike's-Eye View, RLFR). Some
        probe-based monitoring and model-internals items (e.g. 0ec24bcf, 1d74dce0, 30d2ef71, eb67c3fe) could fit
        honesty_and_self_report, ai_control or model_character_and_values. The key_people list reflects Goodfire, ARC
        and Timaeus clusters.
- id: deployment
  name: "Deployment: overseeing and securing running systems"
  description: Safeguards that operate while a model is running as an agent or product, against threats from the model
    itself or from outside attackers. If the work builds or tests a runtime monitor, protocol or defence, it goes here.
  children:
  - id: cot_monitorability
    name: Chain-of-thought monitorability
    description: Whether visible reasoning reflects what drives behaviour and stays useful for monitoring -
      faithfulness, obfuscation under training pressure, controllability and monitor evasion, steganography, and how
      much models can reason without a chain of thought.
    examples:
    - "Reasoning Models Struggle to Control their Chains of Thought"
    - "Reward Misspecification Degrades Chain-of-Thought Monitorability"
    - "NEST: Nascent Encoded Steganographic Thoughts"
    agenda:
      One-sentence summary: Measure whether chain-of-thought reflects what drives model behaviour and stays readable
        under training pressure, controllability, steganography and latent reasoning, and develop ways to preserve it as
        a monitoring signal.
      Theory of change: If reasoning traces stay faithful and hard to manipulate, monitors can catch misaligned intent
        before harmful actions, and knowing when this fails lets developers avoid training or architectures that destroy
        it. Relies on models continuing to reason in legible language and on CoT not being optimised away.
      See also: '[AI control and agent monitoring](#ai_control), [Reward hacking and reward-seeking](#reward_hacking), [Honesty,
        lie detection and self-report](#honesty_and_self_report)'
      General approach: misalignment science
      Target case: pessimistic case
      Key people:
      - Ryan Greenblatt
      - Alek Westover
      - Usman Anwar
      - Rohin Shah
      - David Lindner
      - Julian Schulz
      - Tomek Korbak
      - Francis Rhys Ward
      Critiques: '[Chain of Thought Monitoring Can Fail Even When CoT Is Necessary](https://arxiv.org/abs/2610.18105), [Corrupt
        Plans, Clean Traces: Evading Chain-of-Thought Monitoring with Plan Injection](https://arxiv.org/abs/2609.15989), [Not
        All LLM Reasoning is Visible in the Chain-of-Thought](https://arxiv.org/abs/2607.22925), [Reasoning Theater: Disentangling
        Model Beliefs from Chain-of-Thought](https://arxiv.org/abs/2603.05488)'
      Comment (internal): Several outputs are duplicate versions of the same work (e.g. CoT-Control, no-CoT time
        horizons, Monitor Jailbreaking, Reasoning Theater, Training on Documents About Monitoring). Some items (e.g.
        01cfdbf3, 9843a524, c49d8909) are only loosely about monitorability.
  - id: ai_control
    name: AI control and agent monitoring
    description: Protocols and monitors that keep possibly misaligned agents from causing harm - control settings and
      evaluations, trusted and untrusted monitoring, monitor design and red-teaming, production monitoring, and sabotage
      of automated safety research.
    examples:
    - "LinuxArena: A Control Setting for AI Agents in Live Production Software Environments"
    - "When can we trust untrusted monitoring? A safety case sketch across collusion strategies"
    - "MonitoringBench: Semi-Automated Red-Teaming for Agent Monitoring"
    agenda:
      One-sentence summary: Build and stress-test control settings, monitors and protocols (trusted, untrusted,
        blocking, production) that keep possibly misaligned coding and research agents from causing harm, using red-team
        attacks to measure how much safety they actually provide.
      Theory of change: If monitors and protocols can be shown to catch or block sabotage from a model trying to subvert
        them, then labs can safely deploy and use capable but untrusted agents, including for automated AI R&D. Relies
        on control evaluations with red teams being a faithful proxy for real misaligned model behaviour.
      See also: '[Chain-of-thought monitorability](#cot_monitorability), [Scheming and training gaming](#scheming_and_training_gaming),
        [Alignment auditing, model organisms and incidents](#alignment_auditing_and_incidents)'
      General approach: alignment engineering
      Target case: worst case
      Key people:
      - Tyler Tracy
      - Buck Shlegeris
      - Fabien Roger
      - Aryan Bhatt
      - Mary Phuong
      - Adam Kaufman
      - Marius Hobbhahn
      - Julian Stastny
      Critiques: "[Classifier Context Rot: Monitor Performance Degrades with Context Length](https://lesswrong.com/posts/7vpvNM7viJqNWAdG7/classifier-context-rot-monitor-performance-degrades-with),
        [Calibration-Family Overfit: Why Trusted Sabotage Monitors Don't Transfer Across Lineages](https://arxiv.org/abs/2607.06596),
        [Continual learning might make your blocking monitors nearly useless](https://redwoodresearch.org/blog/continual-learning-might-make-your),
        [Instrumental Monitor Evasion Emerges Under Ordinary Task Pressure](https://arxiv.org/abs/2609.30217)"
      Comment (internal): Several outputs are duplicates across posts and papers (e.g. LinuxArena, Screwtape, Simulated
        Control Evaluations, Untrusted advice). Some items (ecb0877d, 56f4b763, c1d5ca20, 67a2aaac, 8abddefd) are only
        loosely control-related; ecb0877d may fit reward hacking or interpretability better.
  - id: misuse_and_security
    name: Misuse, adversarial robustness and dangerous capabilities
    description: Defences against human attackers and measurement of what an attacker could get - jailbreaks and
      safeguard classifiers, prompt injection and agent security, tamper resistance and unlearning for open weights, and
      dangerous-capability evaluations (bio, cyber, AI R&D automation).
    examples:
    - "Constitutional Classifiers++: Efficient Production-Grade Defenses against Universal Jailbreaks"
    - "AI Agents May Always Fall for Prompt Injections"
    - "TamperBench: Systematically Stress-Testing LLM Safety Under Fine-Tuning and Tampering"
    agenda:
      One-sentence summary: Build and stress-test defences against human attackers (jailbreak classifiers,
        prompt-injection robustness, tamper-resistant open weights, unlearning, monitors) and measure dangerous
        capabilities in bio, cyber and AI R&D that a misuser could exploit.
      Theory of change: If safeguards hold against strong adaptive attackers and dangerous-capability evaluations track
        what attackers could actually obtain, developers can deploy and release models without enabling catastrophic
        misuse. Relies on red-team results and benchmarks predicting real-world attacker success, and on defences
        keeping pace with attack automation.
      See also: '[AI control and agent monitoring](#ai_control), [Evaluation awareness and eval validity](#evaluation_awareness),
        [Interpretability foundations](#interpretability)'
      General approach: alignment engineering
      Target case: pessimistic case
      Key people:
      - Jerry Wei
      - Maksym Andriushchenko
      - Xander Davies
      - Adam Gleave
      - Kellin Pelrine
      - Sizhe Chen
      - David Wagner
      - Mark Russinovich
      Critiques: '[Boundary Point Jailbreaking of Black-Box LLMs](https://arxiv.org/abs/2602.15001), [Trojan-Speak: Bypassing
        Constitutional Classifiers with No Jailbreak Tax via Adversarial Finetuning](https://arxiv.org/abs/2603.29038), [A
        Few Steps Further: Why Defenses Against Malicious Finetuning Erode Under Continued Training](https://arxiv.org/abs/2605.14605),
        [AI Agents May Always Fall for Prompt Injections](https://arxiv.org/abs/2605.17634)'
      Comment (internal): 'Heterogeneous grouping: several outputs look misfiled or only loosely about misuse, e.g. Bit-Exact
        AI Inference Verification (3542edeb, compute governance), Expenditure Horizon (ebcaed03), MirrorCode (0f9aa829), Meta-Agent
        Challenge, Singularity-Bench and PostTrainBench (AI R&D capability), Kimi K2.5 evaluation (a7378b35, closer to strategy_and_risk_reporting),
        Agents of Chaos, and Model Hypnosis (3bf317be, closer to training_data_effects). GPT-Red f8df3e0d has no authors,
        so organisation OpenAI was not listed in key_people.'
  - id: multi_agent_risks
    name: Multi-agent risks
    description: Risks that arise from interacting AI agents - collusion, covert coordination, emergent escalation,
      misalignment in agent organisations, bargaining.
    examples:
    - "Colosseum: Auditing Collusion in Cooperative Multi-Agent Systems"
    - "Emergent Collusion in Long-Horizon LLM Agent Interaction"
    - "Coercion and Deception in AI-to-AI Management"

    agenda:
      One-sentence summary: 'Measure and mitigate risks that arise when AI agents interact: collusion, covert communication,
        coercion and deception between agents, conformity and spread of bad ideas, misalignment in agent organisations, and
        bargaining.'
      Theory of change: If multi-agent failures such as collusion, steganographic coordination and amplified
        misalignment can be characterised and detected early, developers can build monitors and protocols that cover
        agent systems, not just single models. Relies on current multi-agent testbeds predicting how deployed agent
        systems will behave.
      See also: '[AI control and agent monitoring](#ai_control), [Chain-of-thought monitorability](#cot_monitorability), [Scheming
        and training gaming](#scheming_and_training_gaming)'
      General approach: misalignment science
      Target case: pessimistic case
      Key people:
      - Christian Schroeder de Witt
      - Sahar Abdelnabi
      - Philip Torr
      - David Demitri Africa
      - Eugene Bagdasarian
      - Alex Mallen
      - Anthony DiGiovanni
      - Lewis Hammond
      Critiques: '*(unsourced, LLM-drafted)* Most findings come from small, synthetic simulations with prompted agents, so
        they may not predict collusion or escalation in real deployments or in more capable models.'
      Comment (internal): Several outputs (e.g. Colosseum, HELIOS, steganography) overlap with ai_control and
        cot_monitorability. Toolflation and the bargaining and game-theory outputs are loosely about misalignment and
        may suit a cooperative-AI framing.
- id: strategy
  name: Strategy and risk assessment
  description: Work that reasons about the overall problem or reports on a lab's overall risk position, without itself
    proposing a training change, inspection method or safeguard.
  children:
  - id: strategy_and_risk_reporting
    name: Strategy, threat models and frontier risk reporting
    description: Conceptual arguments about how likely and how severe misalignment is, critiques of lab plans, research
      agendas and alignment targets, and system cards, alignment assessments and risk reports.
    examples:
    - "Sympathy for both sides of the egregious misalignment debate"
    - "Labs' current alignment plans seem terrible"
    - "Claude Opus 4 6 System Card"
    agenda:
      One-sentence summary: Argue about how likely and how severe misalignment is, critique lab alignment plans,
        research agendas and alignment targets, and publish system cards, alignment assessments and risk reports that
        state what frontier developers know about model risk.
      Theory of change: If threat models are sharper and risk reports and assessments are scrutinised for validity,
        developers and policymakers can set priorities, decide on deployment and fix weak safety cases better. Relies on
        conceptual arguments and self-reported or third-party assessments tracking actual risk, and on decision-makers
        acting on them.
      See also: '[Evaluation awareness and eval validity](#evaluation_awareness), [Alignment auditing, model organisms and
        incidents](#alignment_auditing_and_incidents), [Scheming and training gaming](#scheming_and_training_gaming)'
      General approach: misalignment science
      Target case: pessimistic case
      Key people:
      - Steve Byrnes
      - Geoffrey Irving
      - Jacob Pfau
      - Ryan Greenblatt
      - Alex Mallen
      - Daniel Tan
      - Ajeya Cotra
      - Beth Barnes
      Critiques: '*(unsourced, LLM-drafted)* Much of the work is conceptual argument or developer self-reporting that cannot
        be tested empirically, so it rarely changes decisions and its credibility depends on assessments that are themselves
        vulnerable to eval awareness and under-elicitation.'
      Comment (internal): "The agenda mixes three kinds of output: essays and conceptual arguments, lab system cards and risk
        reports, and third-party assessments. An editor may want to split them. Several items are cross-posts or duplicates
        (the two 'Automated alignment is harder than you think' entries). Some entries are announcements or org posts (Resolution,
        Returning to ARC), and the GPT-6 Astra launch page may belong elsewhere. Target case is a judgement call. No critiques
        cited because none of the indexed outputs directly refute this agenda."
