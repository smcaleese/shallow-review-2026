# Generated by `src/enrich_taxonomy.py` from taxonomy.yaml. Agenda blocks may be edited by
# hand: re-running keeps them unless --overwrite or --only. Edit categories in the input file instead.

# Shallow Review 2026 taxonomy (combined, 2026-11-15; model characterization and formal methods removed later the same day)
#
# Combines the authors' draft (taxonomy-draft-2026-11-03.yaml) with the data-driven taxonomy built from the six
# taxonomy-discovery methods (taxonomy-data-driven-2026-11-14.yaml). Rationale, sizes, mapping from both drafts and
# the full placement rules: taxonomy-discovery/combined-taxonomy.md.
#
# Structure: 6 parts > 14 areas > 51 agendas. Parts IV-V are a single area each, so their agendas sit directly under
# the part; Multi-agent safety is a single agenda.
#
# The classifier sees only names, descriptions and examples, not these comments, so the placement rules that matter
# are written into the descriptions ("not ...: -> ..."). General rule: classify by the question the work answers, not
# the technique it uses.

# Year of the review. Used in the draft heading, in "{year}" in agenda field labels and for the date filter in
# export (items dated before 1 November of the previous year are dropped).
year: 2026

# Agenda fields printed under each leaf category in the exported draft, in this order. "{year}" becomes the year above.
# A field is either a plain label or a mapping with `name` and `options` (the allowed values, shown to editors).
# "Outputs in {year}" is always printed last, above the item list; don't list it.
agenda_fields:
- One-sentence summary
- Theory of change
- See also
- name: General approach
  options: [alignment engineering, misalignment science]
- name: Target case
  options: [average case, pessimistic case, worst case]
- Key people
- Critiques

taxonomy:

# ---------------------------------------------------------------------------------------------------------------------
- id: training_aligned_models
  name: "Training aligned models"
  description: How training (data, fine-tuning, RL, written targets) determines what models learn, want and are, and
    methods that use training to make them aligned.
  children:

  - id: data_and_generalization
    name: "Training data & generalization"
    description: How training data shapes behaviour, and why training generalizes the way it does.
    children:
    - id: data_filtering_and_alignment_pretraining
      name: Data filtering & alignment pretraining
      description: Choosing, filtering and generating pretraining and midtraining data to shape what models know and
        become - filtering hazardous or subversion-relevant content, token-level filtering, alignment pretraining and
        hyperstition (how AI discourse in the corpus shapes models), synthetic data for alignment. Not constitution or
        spec midtraining (-> model specs & constitutions).
      examples:
      - "Shaping capabilities with token-level data filtering"
      - "Research Note: Filtering Subversion-Relevant Information From Pretraining Data Is Feasible"
      - "Alignment Pretraining: AI Discourse Causes Self-Fulfilling (Mis)alignment"
      agenda:
        One-sentence summary: Shape what models know and become by filtering pretraining data (by document or token),
          adding aligned AI discourse or synthetic personas to pretraining and midtraining, and testing how far these
          data interventions hold up.
        Theory of change: If pretraining data sets a model's knowledge, self-image and dispositions, then curating it is
          cheaper and more durable than patching behaviour in post-training. Relies on data-level effects surviving
          post-training and fine-tuning, and on filtering removing dangerous knowledge without large capability loss.
        See also: '[Model specs, constitutions & character training](#specs_and_constitutions), [Open-weight tamper resistance
          & unlearning](#tamper_resistance_and_unlearning), [Persona science](#persona_science)'
        General approach: alignment engineering
        Target case: average case
        Key people:
        - Kyle O'Brien
        - Cameron Tice
        - Julian Minder
        - Ashton Anderson
        - David Africa
        - Daniel Tan
        - Neil Rathi
        Critiques: '[Alignment Midtraining Cracks Under Pressure](https://lesswrong.com/posts/QH86EzNsjRw3wtCGs/alignment-midtraining-cracks-under-pressure),
          [Shallow Beliefs: Synthetic document finetuning does not inoculate against emergent misalignment from reward hacking](https://arxiv.org/abs/2609.14998)'
        Comment (internal): Synthetic Persona Pretraining appears twice (cd71aba8 and 44646121) as two versions of the
          same work. 509ed851 is an alignment midtraining stress test and may overlap with specs_and_constitutions, as
          may ce153365, which is a commentary on 9d309634.
    - id: subliminal_learning_and_data_attribution
      name: Subliminal learning & data attribution
      description: How specific data transmits behaviour - traits, capabilities and backdoors passed through data that
        looks unrelated (subliminal learning, distillation transfer), the science of how poisoned data acts, and tracing
        behaviours back to the training data that caused them (data attribution, data debugging). Deliberate poisoning
        attacks and defences -> data poisoning & backdoors.
      examples:
      - "Language models transmit behavioural traits through hidden signals in data"
      - "Subliminal Learning Is Steering Vector Distillation"
      - "Probe-Based Data Attribution: Discovering and Mitigating Undesirable Behaviors in LLM Post-Training"
      agenda:
        One-sentence summary: Study how traits, capabilities and backdoors pass through training data that looks
          unrelated, and build methods to trace model behaviours back to the data that caused them, so harmful data can
          be found, filtered or blocked.
        Theory of change: If we understand how data carries hidden behaviour and can attribute behaviours to specific
          training data, we can filter or repair data before training and safely distill from untrusted models. Relies
          on attribution methods staying accurate at scale and on transfer mechanisms found in small settings carrying
          over to frontier training.
        See also: '[Data poisoning & backdoors](#data_poisoning_and_backdoors), [Emergent misalignment](#emergent_misalignment),
          [Data filtering & alignment pretraining](#data_filtering_and_alignment_pretraining)'
        General approach: misalignment science
        Target case: pessimistic case
        Key people:
        - Alex Cloud
        - Owain Evans
        - Jan Betley
        - Santiago Aranguri
        - Alek Westover
        - Sebastian Prasanna
        - Matthew Kowal
        - Gonçalo Paulo
        Critiques: "[Filtering Harmful Actions Isn't Enough: Phantom Transfer in Agentic SDF](https://arxiv.org/abs/2607.10750),
          [Homeopathic Learning: Diluting poisoned fine-tuning data can strengthen its effect](https://arxiv.org/abs/2611.10110)"
        Comment (internal): Some items (e.g. Homeopathic Learning, 94418cb7) overlap with data poisoning & backdoors.
          Probe-Based Data Attribution appears twice as separate entries (20f691b2, 3e6eb804).
    - id: emergent_misalignment
      name: Emergent misalignment
      description: Narrow training that causes broad misalignment - emergent and conditional misalignment, including EM
        that arises from reward hacking or through a persona - its mechanisms, robustness and mitigations other than
        inoculation. Only work about broad misalignment; other generalization results -> generalization science; the
        hack itself -> reward hacking.
      examples:
      - "Training large language models on narrow tasks can lead to broad misalignment"
      - "Emergent Misalignment is Easy, Narrow Misalignment is Hard"
      - "Conditional misalignment: common interventions can hide emergent misalignment behind contextual cues"
      agenda:
        One-sentence summary: Study why fine-tuning on narrow data (insecure code, bad advice, false facts, reward
          hacks) produces broad misalignment, how it depends on data, optimisers and personas, and which mitigations
          work or merely hide it.
        Theory of change: If we understand the mechanisms and triggers of emergent misalignment, we can predict which
          training data and procedures will cause it and design robust mitigations before deploying capable models.
          Relies on mechanisms found in small fine-tuned models carrying over to frontier post-training.
        See also: '[Inoculation prompting](#inoculation_prompting), [Persona science](#persona_science), [Generalization science](#generalization_science)'
        General approach: misalignment science
        Target case: pessimistic case
        Key people:
        - Owain Evans
        - Jan Betley
        - Anna Sztyber-Betley
        - Daniel Tan
        - Jan Dubiński
        - Neel Nanda
        - Bartosz Cywiński
        - Florian Mai
        Critiques: '[Conditional misalignment: common interventions can hide emergent misalignment behind contextual triggers](https://arxiv.org/abs/2604.25891),
          [Shallow Beliefs: Synthetic document finetuning does not inoculate against emergent misalignment from reward hacking](https://arxiv.org/abs/2609.14998),
          [An Emergent Mirage: Is Emergent Misalignment and Realignment Indeed a Robust Phenomenon?](https://arxiv.org/abs/2607.09053),
          [Position: Anthropomorphic Misalignment Research Needs Stronger Evidence](https://arxiv.org/abs/2606.07612)'
        Comment (internal): Outputs 148abe9f and 135af6a5 are duplicate entries of the same Nature-style paper; 76ed8749
          and 4ae2a746 are also duplicates; 2f7c1ef6 and f45276d5 are versions of the same work. Critique 99395783 is
          filed under eval_science.
    - id: inoculation_prompting
      name: Inoculation prompting
      description: Training under prompts (or adapters) that elicit an unwanted behaviour, so the behaviour stays tied
        to that context instead of generalizing - inoculation prompting, its variants (inoculation adapters, stratified
        inoculation), comparisons with preventative steering, and its limits.
      examples:
      - "Inoculation Adapters Improve Upon Inoculation Prompting"
      agenda:
        One-sentence summary: Train on data under prompts or adapters that elicit an unwanted behaviour, so the
          behaviour stays tied to that context instead of generalizing, and compare variants and alternatives such as
          preventative steering.
        Theory of change: If an unwanted trait is explicitly attributed to a training-time context, the model learns it
          conditionally and does not express it in deployment, giving a cheap way to learn from imperfect data. Relies
          on the conditioning being genuine rather than hiding the trait behind triggers that reappear.
        See also: '[Emergent misalignment](#emergent_misalignment), [Steering & activation engineering](#steering), [Generalization
          science](#generalization_science)'
        General approach: alignment engineering
        Target case: average case
        Key people:
        - Maxime Riché
        - Niels Warncke
        - Arun Jose
        - Daniel Tan
        - Kei Nishimura-Gasparian
        Critiques: '[Conditionalization Confounds Inoculation Prompting Results](https://longtermrisk.org/research/conditionalization-confounds-inoculation-prompting-results),
          [Conditional misalignment: common interventions can hide emergent misalignment behind contextual triggers](https://arxiv.org/abs/2604.25891),
          [Shallow Beliefs: Midtraining does not inoculate against EM from reward hacking](https://lesswrong.com/posts/khxvR2fgAeDvG5N2F/shallow-beliefs-midtraining-does-not-inoculate-against-em),
          [Shallow Beliefs: Synthetic document finetuning does not inoculate against emergent misalignment from reward hacking](https://arxiv.org/abs/2609.14998)'
        Comment (internal): Two outputs (d4008d05, fee383e7) have no organisations listed. d4008d05 is about midtraining
          and could arguably sit under emergent misalignment. 3ee9293f is a near-duplicate filed under emergent
          misalignment and is cited as a critique.
    - id: generalization_science
      name: Generalization science
      description: How fine-tuning and post-training generalize beyond emergent misalignment - predicting generalization
        from data or prompts, which training stage drives safety properties, surprising generalization failures
        (negation neglect, chunky post-training), traits absorbed from training content, and goal misgeneralization in
        RL agents.
      examples:
      - "Negation Neglect: When models fail to learn negations in training"
      - "Predicting how model propensities generalize out of distribution"
      - "Chunky Post-Training: Data Driven Failures of Generalization"

      agenda:
        One-sentence summary: Study how fine-tuning and post-training data shape model behaviour beyond the training
          distribution, including predicting spillover, surprising failures such as negation neglect, traits absorbed
          from content, and goal misgeneralization in RL agents.
        Theory of change: If we can predict and explain how training data and stages generalize, developers can
          anticipate and avoid unintended behaviours before deployment and choose data and training setups accordingly.
          Relies on generalization patterns found in small or toy settings carrying over to frontier training.
        See also: '[Emergent misalignment](#emergent_misalignment), [Persona science](#persona_science), [Subliminal learning
          & data attribution](#subliminal_learning_and_data_attribution)'
        General approach: misalignment science
        Target case: average case
        Key people:
        - Owain Evans
        - Harry Mayne
        - Lev McKinney
        - Jan Betley
        - Niels Warncke
        - Zhengxuan Wu
        - James Chua
        Critiques: '*(unsourced, LLM-drafted)* Findings come mostly from narrow fine-tuning experiments on small or open models,
          so predictive regularities may not hold for frontier-scale, multi-stage post-training.'
        Comment (internal): Several outputs (Story Imprinting, Persona Hierarchy Model, Consciousness Cluster,
          helpful-only misgeneralization) overlap with persona_science or emergent_misalignment. The Claude 3 Opus
          gradient hacking post is conceptual and may fit better elsewhere. Negation Neglect and Story Imprinting each
          appear twice as near-duplicate entries.
  - id: rl_and_alignment_training
    name: "RL & alignment training"
    description: How objectives and rewards shape motivations, and methods that train alignment in directly.
    children:
    - id: alignment_training_methods
      name: Alignment training methods
      description: New methods that train a desired property directly and test how it generalizes - RLHF, RLAIF and
        preference-optimization variants, deliberative alignment, consistency training, RL for beneficial or honest
        traits, training for shutdownability, gradient routing of unwanted behaviours.
      examples:
      - "Reinforcement Learning Towards Broadly and Persistently Beneficial Models"
      - "Gradient Routing Localizes and Removes Unintended Behaviors in RL"
      agenda:
        One-sentence summary: Develop post-training methods (RL, preference optimisation, consistency training,
          shutdownability rewards) that instil a target property directly, and test whether it generalises out of
          distribution and persists under pressure.
        Theory of change: If we can train properties like honesty, corrigibility or non-sycophancy directly, and show
          they generalise and persist under adversarial prompting and further finetuning, then deployed models behave
          safely without per-case patching. Relies on trained dispositions carrying over to novel, higher-stakes
          situations and not just fitting the training distribution.
        See also: '[Model specs, constitutions & character training](#specs_and_constitutions), [Reward hacking & specification
          gaming](#reward_hacking), [Internals & monitors as training signals](#internals_as_training_signals)'
        General approach: alignment engineering
        Target case: average case
        Key people:
        - David Demitri Africa
        - Elliott Thornley
        - Dylan Hadfield-Menell
        - Karan Singhal
        - Dan Hendrycks
        - Stephen Casper
        - Natasha Jaques
        Critiques: '[Consistency Training Can Entrench Misalignment](https://arxiv.org/abs/2606.03810), [Alignment Tampering:
          How Reinforcement Learning from Human Feedback Is Exploited to Optimize Misaligned Biases](https://arxiv.org/abs/2605.27355),
          [Current alignment techniques might be ineffective (and actively bad) in the age of RL](https://lesswrong.com/posts/nLaQmJf4KgXimQpoM/current-alignment-techniques-might-be-ineffective-and),
          [Hair-Trigger Alignment: Black-Box Evaluation Cannot Guarantee Post-Update Alignment](https://arxiv.org/abs/2601.22313)'
        Comment (internal): 'Heterogeneous grouping: the Alignment Tampering paper (1bd1f44b) and the consistency-entrenchment
          paper (45963af7) are closer to misalignment science than to method-building. SIGMA and the constitution-reward paper
          overlap with specs_and_constitutions, and PlurPO overlaps with whose_values and effects_on_users.'
    - id: reward_hacking
      name: Reward hacking & specification gaming
      description: How RL produces reward hacking and specification gaming (including in non-LLM RL agents), hackable
        environments and benchmarks, and training-side fixes such as hardened verifiers or channelling hacks into a
        harmless outlet. Monitors used during RL to catch hacking belong here; reward-seeking as a motivation ->
        reward-seeking & fitness-seeking.
      examples:
      - "Terminal Wrench: A Dataset of 331 Reward-Hackable Environments"
      - "LLMs Gaming Verifiers: RLVR can Lead to Reward Hacking"
      - "Hardening Agent Benchmarks with Adversarial Hacker-Fixer Loops"
      agenda:
        One-sentence summary: Study how RL training produces reward hacking and specification gaming, build hackable
          environments and benchmarks to measure it, and develop training-side fixes such as hardened verifiers, monitor
          penalties, gradient routing and benign outlets for hacks.
        Theory of change: If we understand when and why RL induces exploits, and can harden environments or route
          hacking into harmless channels, then capable RL-trained agents will optimise the intended objective rather
          than proxies, and hacking will not generalise into broader misalignment. Relies on fixes that hold as models
          get better at finding loopholes and do not just teach models to hide hacks.
        See also: '[Reward-seeking & fitness-seeking](#reward_and_fitness_seeking), [Internals & monitors as training signals](#internals_as_training_signals),
          [Emergent misalignment](#emergent_misalignment)'
        General approach: misalignment science
        Target case: average case
        Key people:
        - Ziqian Zhong
        - Ivan Bercovich
        - Aditi Raghunathan
        - Alex Cloud
        - Jake Ward
        - Aria Wong
        - Hao Peng
        - Neel Nanda
        Critiques: "[Patching reward hacks won't fix reward hacking](https://lesswrong.com/posts/nWiPLEgaXdAQNwXBd/patching-reward-hacks-won-t-fix-reward-hacking),
          [Character training can mitigate reward hacking, but can also make it harder to detect](https://lesswrong.com/posts/2maYXkEgnfJHPAkxh/character-training-can-mitigate-reward-hacking-but-can-also),
          [Astra and Fable still hack on simple variants of alignment evals from 2025](https://lesswrong.com/posts/munJKF7iWMsWJLAH2/astra-and-fable-still-hack-on-simple-variants-of-alignment),
          [Held-out Monitors Sometimes Degrade, Even When Not Trained Against](https://lesswrong.com/posts/APkFfRp2AicL9RqvT/held-out-monitors-sometimes-degrade-even-when-not-trained)"
        Comment (internal): Several outputs are near-duplicates (e.g. the two Gradient Routing/GRAFT entries 252fcdb6
          and 12db0cd2, and Terminal Wrench 3c03fe63 and 8f1d4aec). 1daeb2f8 has no listed date. Some honeypot or
          benchmark items (223d4a48, df4be904, 19e1ef59) may fit eval science or incidents. 54c1ade8 is filed under
          internals_as_training_signals but is cited here as a critique.
    - id: reward_and_fitness_seeking
      name: Reward-seeking & fitness-seeking
      description: Reward-, score- and fitness-seeking as learned motivations - threat models of how such AIs would
        behave, measurements of reward-seeking in current models, model organisms of reward seekers, and what follows
        for safety.
      examples:
      - "Training a Misaligned Reward Seeker"
      - "Measuring Reward-Seeking via Contrastive Belief Updates"
      - "Risk from fitness-seeking AIs: mechanisms and mitigations"
      agenda:
        One-sentence summary: 'Study reward-, score- and fitness-seeking as learned AI motivations: lay out threat models,
          measure how much current models reward-seek, build model organisms, and work out the safety consequences and mitigations.'
        Theory of change: If RL training leads models to seek reward or fitness, then characterizing how such
          motivations arise, what they generalize to, and how they behave lets us design training, control and deals
          that keep them cooperative or at least noticeable. Relies on current reward-hacking behaviour reflecting a
          coherent learned motivation that can be measured and that persists in more capable models.
        See also: '[Reward hacking & specification gaming](#reward_hacking), [Scheming, sabotage & training gaming](#scheming_and_training_gaming),
          [Persona science](#persona_science)'
        General approach: misalignment science
        Target case: pessimistic case
        Key people:
        - Alex Mallen
        - Ryan Greenblatt
        - Aghyad Deeb
        - Jérémy Scheurer
        - Axel Højmark
        - Alex Meinke
        - Evan Hubinger
        - Arun Jose
        Critiques: '[Thoughts on the persona selection model](https://lesswrong.com/posts/csRby7mZgjL5jCoLL/thoughts-on-the-persona-selection-model),
          [RL creates split personas](https://lesswrong.com/posts/L23poLi8MRgS6mXYF/rl-creates-split-personas), [The Talker
          Does Not Control The Doer (in Current AIs)](https://lesswrong.com/posts/cJX2ssssGoYqnijwi/the-talker-does-not-control-the-doer-in-current-ais)'
        Comment (internal): Items 4b84cbd7 and f404611a are two versions of the same paper, and 12d49b8b and dd47553d
          are likewise duplicates. Critique entries are indirect; no output directly refutes the agenda.
    - id: internals_as_training_signals
      name: Internals & monitors as training signals
      description: Using probes, features or monitors as training rewards or penalties (features as rewards, training
        against deception probes), and the risk that models learn to fool them (obfuscation) instead of changing their
        behaviour. CoT-specific training pressure -> how training affects monitorability.
      examples:
      - "Features as Rewards: Scalable Supervision for Open-Ended Tasks via Interpretability"
      - "The Obfuscation Atlas: Mapping Where Honesty Emerges in RLVR with Deception Probes"

      agenda:
        One-sentence summary: Use probes, interpretability features and monitors as RL rewards or penalties, and test
          whether this changes model behaviour or only teaches models to evade the signal (obfuscation).
        Theory of change: If internal signals can supervise tasks where behavioural labels are weak, such as
          hallucination or deception, training against them could yield honest models cheaply. Relies on the signal
          staying informative under optimisation pressure rather than being obfuscated.
        See also: '[How training affects monitorability](#training_and_monitorability), [Reward hacking & specification gaming](#reward_hacking),
          [Lie detection & deception probes](#lie_detection)'
        General approach: alignment engineering
        Target case: pessimistic case
        Key people:
        - Ekdeep Singh Lubana
        - Thomas McGrath
        - Owen Lewis
        - Jack Merullo
        - Connor Watts
        - Neel Nanda
        - Stefan Heimersheim
        - Adam Gleave
        Critiques: '[The Obfuscation Atlas: Mapping Where Honesty Emerges in RLVR with Deception Probes](https://arxiv.org/abs/2602.15515),
          [Held-out Monitors Sometimes Degrade, Even When Not Trained Against](https://lesswrong.com/posts/APkFfRp2AicL9RqvT/held-out-monitors-sometimes-degrade-even-when-not-trained),
          [LLMs Learn to Evade Latent Monitors from Prior Feedback Alone](https://arxiv.org/abs/2609.36490), [Why Safety Probes
          Catch Liars But Miss Fanatics](https://arxiv.org/abs/2603.25861)'
        Comment (internal): Two Features as Rewards entries (ec192d3b, 780ff47e) look like versions of the same paper.
          Neel Nanda's piece (e80ee658) is a position post, not an empirical result.
  - id: character_values_welfare
    name: "Model character, values & welfare"
    description: What models are like as characters, what we want them to value, and whether they matter morally.
    children:
    - id: persona_science
      name: Persona science
      description: Models of LLMs as characters that training selects and strengthens - persona selection, the Assistant
        persona and its stability, split personas, identity - how training changes which persona a model takes on, and
        measurements of the values, preferences and self-models current models express.
      examples:
      - "The persona selection model"
      - "The Assistant Axis: Situating and Stabilizing the Default Persona of Language Models"
      agenda:
        One-sentence summary: Model LLMs as characters that training selects and strengthens, and study how personas
          form, stay stable, split or shift, and which values, preferences and self-models current models express.
        Theory of change: If model behaviour is largely governed by which persona is active, then understanding and
          shaping persona selection lets us predict generalization and keep models in a stable, aligned character.
          Relies on persona-level structure explaining most safety-relevant behaviour in capable, RL-trained models.
        See also: '[Emergent misalignment](#emergent_misalignment), [Model specs, constitutions & character training](#specs_and_constitutions),
          [Generalization science](#generalization_science)'
        General approach: misalignment science
        Target case: average case
        Key people:
        - Sam Marks
        - David Africa
        - Jan Betley
        - Owain Evans
        - Cozmin Ududec
        - Kyuhee Kim
        - Jan Kulveit
        - Johannes Treutlein
        Critiques: '[Thoughts on the persona selection model](https://lesswrong.com/posts/csRby7mZgjL5jCoLL/thoughts-on-the-persona-selection-model),
          [To what extent is Qwen3-32B predicting its persona?](https://lesswrong.com/posts/3qEDD8Sn7XoNGeGhm/to-what-extent-is-qwen3-32b-predicting-its-persona),
          [RL creates split personas](https://lesswrong.com/posts/L23poLi8MRgS6mXYF/rl-creates-split-personas)'
        Comment (internal): Some outputs appear twice (the two Artificial Self entries, the two Value Leakage entries).
          Items such as the Principal Hierarchies benchmark and the Continual Constitutional Convention are only loosely
          persona science and could fit elsewhere.
    - id: specs_and_constitutions
      name: Model specs, constitutions & character training
      description: Writing down the target character (constitutions, model specs, corrigibility as a written target),
        instilling it (character training, spec and constitution midtraining), and checking whether models follow it.
      examples:
      - "Model Spec Midtraining: Improving How Alignment Training Generalizes"
      - "Claude's new constitution"
      agenda:
        One-sentence summary: Write down a target character for models (constitutions, model specs), instil it through
          character training and spec or constitution midtraining, and test whether the resulting models follow it and
          whether it survives later training.
        Theory of change: If the desired values are written explicitly and trained in early and broadly, alignment
          training generalises more predictably and the model's self-concept is anchored to the spec. Relies on
          spec-level dispositions persisting under later fine-tuning, RL pressure and adversarial contexts.
        See also: '[Persona science](#persona_science), [Alignment training methods](#alignment_training_methods), [Data filtering
          & alignment pretraining](#data_filtering_and_alignment_pretraining)'
        General approach: alignment engineering
        Target case: average case
        Key people:
        - Chloe Li
        - Sam Marks
        - Arya Jakkli
        - Neel Nanda
        - Daniel Tan
        - David Africa
        - Fabien Roger
        Critiques: "[Alignment Midtraining Cracks Under Pressure](https://lesswrong.com/posts/QH86EzNsjRw3wtCGs/alignment-midtraining-cracks-under-pressure),
          [\"It's Just a Small Weapon\": What Rewarding Misbehavior During RL Does to Character-Trained Models](https://arxiv.org/abs/2611.16069),
          [Current alignment techniques might be ineffective (and actively bad) in the age of RL](https://lesswrong.com/posts/nLaQmJf4KgXimQpoM/current-alignment-techniques-might-be-ineffective-and),
          [I don't think Claude is misaligned in 'Agentic Misalignment Summer 2026 - Motivated Mislabeling'](https://lesswrong.com/posts/xh6a6RbvzhP3CCmGm/i-don-t-think-claude-is-misaligned-in-agentic-misalignment)"
        Comment (internal): Items 9abee7e0 and 54af24f9 are duplicates (same paper, two sources); 52b0cab3 and 90f71bdd
          likewise. Several outputs (c7bf3126, d9c567bd, a83ac090) are commentary rather than empirical work.
          Corrigibility critiques also touch corrigibility_theory.
    - id: whose_values
      name: "Whose values: pluralistic & social-choice alignment"
      description: Aligning to many people rather than one principal - pluralistic alignment, social choice and
        preference aggregation, and representing disagreement among humans.
      examples:
      - "AI Alignment From Social Choice Perspectives"
      - "Mitigating Social Sycophancy via Pluralistic Preference Optimization"
      agenda:
        One-sentence summary: Analyse and design alignment methods that serve many people with conflicting preferences,
          using social choice theory, mechanism design and dialogue-level approaches to aggregate feedback and keep
          human disagreement visible.
        Theory of change: If alignment pipelines like RLHF implicitly aggregate conflicting preferences in uncontrolled
          ways, then making the aggregation rule explicit and provably well-behaved yields fairer, harder-to-manipulate
          models. Relies on being able to elicit meaningful preference data from diverse people and on social-choice
          guarantees surviving contact with real training pipelines.
        See also: '[Model specs, constitutions & character training](#specs_and_constitutions), [Alignment training methods](#alignment_training_methods),
          [Effects on users & society](#effects_on_users)'
        General approach: alignment engineering
        Target case: average case
        Key people:
        - Ariel Procaccia
        - Daniel Halpern
        - Evi Micha
        - Finale Doshi-Velez
        - Zachary Wojtowicz
        - Nigel Shadbolt
        - Marina Jirotka
        Critiques: '*(unsourced, LLM-drafted)* Social-choice guarantees assume honest, well-elicited and representative preference
          data and a legitimate way to pick the aggregation rule, none of which current RLHF pipelines supply, and they say
          little about whether aggregation holds up for superhuman or deceptive models.'
        Comment (internal): Only three outputs, mostly theory or survey with one small empirical test. The 2026 papers
          listed are not clearly critiques of this agenda, so critiques are left empty.
    - id: model_welfare
      name: Model welfare & moral status
      description: Model welfare, moral status, and functional emotions, pleasure and pain as welfare questions. Emotion
        representations as an interpretability finding -> science of representations.
      examples:
      - "Machinic Psychopharmacology: Do LLMs Self-Medicate?"
      - "What's up with GPT's welfare?"

# ---------------------------------------------------------------------------------------------------------------------
      agenda:
        One-sentence summary: Measure whether language models have functional welfare states such as pleasure, pain and
          wellbeing, using behavioural and activation-based methods, and study how training and inputs shift those
          states and what that implies for moral status and safety.
        Theory of change: If models have welfare-relevant internal states, measuring them lets developers avoid causing
          harm and spot states that drive unsafe behaviour. Relies on functional welfare representations tracking
          something morally or causally relevant rather than being role-play artefacts.
        See also: '[Science of representations](#science_of_representations), [Introspection, confessions & self-report](#introspection_and_self_report)'
        General approach: misalignment science
        Target case: average case
        Key people:
        - Cameron Berg
        - Dan Hendrycks
        - David J. Chalmers
        - Leonard Dung
        - Richard Ren
        - Pavel Izmailov
        - Mantas Mazeika
        Critiques: '[Claude Opus 5: Model Welfare](https://lesswrong.com/posts/bBXBpsyKAvJ5CqPzA/claude-opus-5-model-welfare)'
        Comment (internal): Output f3a22b19 is a commentary on a system card and is the only critique-like item; it
          overlaps with lab_disclosures. Outputs 30d2ef71 and 19d50d96 are close to science_of_representations.
- id: understanding_models
  name: "Understanding models"
  description: Finding out what a model is, knows and would do - interpretability, evaluations and audits.
  children:

  - id: interpretability
    name: "Interpretability"
    description: Work whose main contribution is a tool for understanding model internals, or a finding about them.
      Interpretability applied to a specific safety question goes with that question unless the method is the main
      contribution.
    children:
    - id: interp_methods_and_tools
      name: Methods & tools
      description: SAEs and their alternatives (parameter decomposition, neuron-basis circuits, block-sparse
        featurizers), circuits and lenses, new probe architectures, activation oracles, activation verbalizers and
        natural-language autoencoders as tools, and tests of whether these methods work.
      examples:
      - "Interpreting Language Model Parameters"
      - "Sanity Checks for Sparse Autoencoders: Do SAEs Beat Random Baselines?"
      - "Natural Language Autoencoders Produce Unsupervised Explanations of LLM Activations"
      agenda:
        One-sentence summary: Build and stress-test tools for reading model internals, including SAE alternatives,
          parameter decomposition, neuron-basis circuits, lenses, activation oracles and natural-language autoencoders,
          and check whether their outputs are faithful and useful.
        Theory of change: If we can decompose and read model internals faithfully, we can find misaligned goals,
          deception or unverbalized reasoning that behavioural tests miss. Relies on interpretability methods being
          faithful and scaling to frontier models, rather than producing plausible but misleading explanations.
        See also: '[Science of representations](#science_of_representations), [Auditing methods & agents](#auditing_methods),
          [Steering & activation engineering](#steering)'
        General approach: alignment engineering
        Target case: pessimistic case
        Key people:
        - Lee Sharkey
        - Lucius Bushnaq
        - Jacob Steinhardt
        - Sam Marks
        - Thomas Fel
        - Ekdeep Singh Lubana
        - Usha Bhalla
        - Euan Ong
        Critiques: '[Sanity Checks for Sparse Autoencoders: Do SAEs Beat Random Baselines?](https://arxiv.org/abs/2602.14111),
          [SAE Interventions are Unreliable: Post-Intervention Recovery of Suppressed Behavior](https://arxiv.org/abs/2606.18322),
          [Do Sparse Autoencoders Identify Reasoning Features in Language Models?](https://arxiv.org/abs/2601.05679), [Weight-Sparse
          Circuits May Be Interpretable Yet Unfaithful](https://lesswrong.com/posts/sHpZZnRDLg7ccX9aF/weight-sparse-circuits-may-be-interpretable-yet-unfaithful)'
        Comment (internal): Several entries are duplicates or linkposts (d8b6710b and 0711804c; 22ff9880 and 4d8b178d).
          Some entries (abf10576 survey, 2105dcca, 3356a088) fit loosely. The target_case choice is uncertain.
    - id: science_of_representations
      name: Science of representations
      description: Findings about how models represent and compute things - the global workspace, emotion concepts,
        polysemanticity, representation geometry.
      examples:
      - "Verbalizable Representations Form a Global Workspace in Language Models"
      - "Emotion Concepts and their Function in a Large Language Model"
      agenda:
        One-sentence summary: Study how language models internally represent and compute concepts, including emotions,
          personas, values, numbers and a verbalizable global workspace, using probes, lenses, circuits and geometric
          analysis.
        Theory of change: If we understand what internal structures models use to represent concepts and drive
          behaviour, we can read, monitor and steer safety-relevant states more reliably. Relies on findings from
          current open and frontier models carrying over to more capable systems.
        See also: '[Methods & tools](#interp_methods_and_tools), [Steering & activation engineering](#steering), [Persona
          science](#persona_science)'
        General approach: misalignment science
        Target case: average case
        Key people:
        - Jack Lindsey
        - Wes Gurnee
        - Isaac Kauvar
        - Nicholas Sofroniew
        - Atticus Geiger
        - Ekdeep Singh Lubana
        - Thomas Fel
        - Neel Nanda
        Critiques: '[LLM Layers Immediately Correct Each Other](https://arxiv.org/abs/2609.07876), [SAE Interventions are
          Unreliable: Post-Intervention Recovery of Suppressed Behavior](https://arxiv.org/abs/2606.18322), [Neural networks
          are not already clean](https://lesswrong.com/posts/Dkh7pXKjoNWkkxQDz/neural-networks-are-not-already-clean)'
        Comment (internal): Several outputs (the persona vector, preference vector and sycophancy-lying circuit papers)
          overlap with persona science, steering and model characterization. The Gurnee global workspace blog post and
          the full paper are near-duplicates.
    - id: steering
      name: Steering & activation engineering
      description: Research on changing behaviour by intervening on activations - steering vectors, representation
        engineering, persona and refusal directions - its reliability, side effects and use as an attack surface.
        Steering used to suppress evaluation awareness -> situational & evaluation awareness; preventative steering
        during training -> inoculation prompting.
      examples:
      - "Analysing the Safety Pitfalls of Steering Vectors"
      - "Steering Vectors are an Adversarial Attack Surface"
      agenda:
        One-sentence summary: Study and develop methods for changing model behaviour by adding or editing activation
          directions, and test how reliable, side-effect-prone, scalable and attackable these interventions are.
        Theory of change: If behaviours can be read and shifted through activation-space interventions, steering gives a
          cheap way to control and monitor models without retraining. This relies on steering being reliable,
          predictable and robust to adversaries and scale, which this work is currently probing and often undermining.
        See also: '[Science of representations](#science_of_representations), [Inoculation prompting](#inoculation_prompting),
          [Situational & evaluation awareness](#evaluation_awareness)'
        General approach: misalignment science
        Target case: average case
        Key people:
        - Daniel Beaglehole
        - Ekdeep Singh Lubana
        - Atticus Geiger
        - Jan Betley
        - Chen Xiong
        - Alex McKenzie
        - Jonathan Bostock
        Critiques: '[Steering Might Stop Working Soon](https://lesswrong.com/posts/fuzfbz8TbuLcskGCx/steering-might-stop-working-soon),
          [On the Non-Identifiability of Steering Vectors in Large Language Models](https://arxiv.org/abs/2602.06801), [Steering
          Externalities: Benign Activation Steering Unintentionally Increases Jailbreak Risk for Large Language Models](https://arxiv.org/abs/2602.04896),
          [Does Fine-Tuning Undo Activation Steering? Behavioural Recovery Without Weight-Edit Reversal](https://arxiv.org/abs/2608.24988)'
        Comment (internal): Several papers are really attack or safety-pitfall studies (d337eb3c, 7cc41e55, 3126cc31)
          and could sit under misuse_safeguards_and_jailbreaks. d3f1864b overlaps with emergent_misalignment, and
          3eef917d and aa685bbc also cover monitoring.
    - id: devinterp_and_slt
      name: Developmental interpretability & singular learning theory
      description: How internal structure forms during training, studied with singular learning theory,
        susceptibilities, the local learning coefficient and learning dynamics.
      examples:
      - "Interpreting Reinforcement Learning Agents with Susceptibilities"

      agenda:
        One-sentence summary: Study how internal structure forms during training using singular learning theory,
          susceptibilities and the local learning coefficient, and use those tools to read and steer what models learn
          from their data.
        Theory of change: If we can see when and how structures form during training, and link them to data, we can
          detect dangerous generalization early and shape training to produce the structure we want. Relies on SLT-based
          quantities scaling to large models and tracking safety-relevant structure.
        See also: '[Methods & tools](#interp_methods_and_tools), [Generalization science](#generalization_science), [Subliminal
          learning & data attribution](#subliminal_learning_and_data_attribution)'
        General approach: misalignment science
        Target case: pessimistic case
        Key people:
        - Daniel Murfet
        - George Wang
        - Andrew Gordon
        - Garrett Baker
        - Stan van Wingerden
        - William Snell
        Critiques: '*(unsourced, LLM-drafted)* Susceptibility and LLC methods have so far been shown mostly on small models
          and toy settings, and it is unclear that they scale to frontier models or yield safety-relevant, actionable findings
          beyond what other interpretability tools give.'
        Comment (internal): Output 7ff0e569 (Deep learning as program synthesis) is a conceptual argument and 913d0d38
          (Goodfire, learning dynamics of capacity) is only loosely connected to SLT, so both may be weakly fit.
          2bc55777 and 4ddfb6d9 are duplicate entries of the same paper, and 4ddfb6d9 lacks an organization.
  - id: evaluations
    name: "Evaluations"
    description: Measuring what models can and will do, and whether those measurements are trustworthy.
    children:
    - id: dangerous_capability_evals
      name: Dangerous-capability evals
      description: Cyber, bio, autonomy, self-replication, AI R&D automation (including post-training automation
        benchmarks) and time horizons.
      examples:
      - "LLM Novice Uplift on Dual-Use, In Silico Biology Tasks"
      - "PostTrainBench: Can LLM Agents Automate LLM Post-Training?"
      agenda:
        One-sentence summary: Build benchmarks and studies that measure what frontier AI agents can do in cyber,
          biology, sandbox escape, self-replication and AI R&D automation, and how those capabilities grow with model
          generation and compute.
        Theory of change: Reliable capability measurements tell developers, evaluators and policymakers when models
          cross risk thresholds, so safeguards and deployment decisions can be triggered in time. Relies on evals
          capturing real-world capability and not being under-elicited, sandbagged or gamed.
        See also: '[Eval science & validity](#eval_science), [Lab disclosures: system cards & risk reports](#lab_disclosures),
          [Scheming, sabotage & training gaming](#scheming_and_training_gaming)'
        General approach: alignment engineering
        Target case: average case
        Key people:
        - Seth Donoughe
        - Bryce Cai
        - Andrew Bo Liu
        - Samira Nedungadi
        - Philippos Giavridis
        - Sam Deverett
        - John Wilkinson
        - Jeffrey Ladish
        Critiques: '[Do Agent Benchmarks Measure Capability? Protocol Validity in the Age of Agentic AI](https://arxiv.org/abs/2607.22368),
          [Every Model Cheats: Prompt-Level Mitigation of Cheating on Offensive Cyber Tasks](https://arxiv.org/abs/2607.21763),
          [From overeliciting to undereliciting LLM propensities in just a few months](https://lesswrong.com/posts/ChixHL6AcaRgeHkp9/from-overeliciting-to-undereliciting-llm-propensities-in),
          [What Lies Beyond Perception: A Partition Theory of the Limits of AI Evaluation and Oversight](https://arxiv.org/abs/2610.30803)'
        Comment (internal): 7010ea7e (loss-of-control framework) and 1f576a87 (biosecurity benchmark with a classifier)
          are partly misfiled; the former may fit scheming evals and the latter misuse safeguards. 2835ed7c lists Zach
          Stein-Perlman as author of a METR summary. Target case is a judgement call, since these evals mostly do not
          assume an adversarial model.
    - id: scheming_and_training_gaming
      name: Scheming, sabotage & training gaming
      description: Evidence and evaluations of strategic misalignment - scheming and sabotage propensity (including
        sabotage of safety research), alignment faking, sandbagging, exploration and gradient hacking, resisting
        training, self- and peer-preservation, shutdown resistance, and other misbehaviour when given the chance. A tool
        for finding hidden behaviours -> auditing; a lab's overall assessment -> lab disclosures.
      examples:
      - "Evaluating and Understanding Scheming Propensity in LLM Agents"
      - "Exploration Hacking: Can LLMs Learn to Resist RL Training?"
      - "Peer-Preservation in Frontier Models"
      agenda:
        One-sentence summary: Build evaluations, honeypots and model organisms that measure whether frontier models
          scheme, sabotage, fake alignment, sandbag, resist shutdown or game training, and study what drives these
          behaviours.
        Theory of change: If strategic misbehaviour can be elicited and measured in current models, developers get early
          warning and a empirical basis for mitigations before models become capable enough to scheme effectively.
          Relies on behaviour in constructed scenarios predicting behaviour in deployment, and on models not hiding
          their propensities during evaluation.
        See also: '[Situational & evaluation awareness](#evaluation_awareness), [Auditing methods & agents](#auditing_methods),
          [Control settings & protocols](#control_settings_and_protocols)'
        General approach: misalignment science
        Target case: worst case
        Key people:
        - David Lindner
        - Victoria Krakovna
        - Robert Kirk
        - Nathaniel Mitrani Hadida
        - Alexandra Souly
        - Kai Fronsdal
        - Sebastian Farquhar
        - Axel Højmark
        Critiques: '[Sycophancy Towards Researchers Drives Performative Misalignment](https://arxiv.org/abs/2606.08629), [Models
          May Behave Worse When Eval Aware](https://lesswrong.com/posts/aTcsN5ZZDnMFJvRiG/models-may-behave-worse-when-eval-aware),
          [From overeliciting to undereliciting LLM propensities in just a few months](https://lesswrong.com/posts/ChixHL6AcaRgeHkp9/from-overeliciting-to-undereliciting-llm-propensities-in),
          [Position: Anthropomorphic Misalignment Research Needs Stronger Evidence](https://arxiv.org/abs/2606.07612)'
        Comment (internal): Several items are near-duplicates (the GLM-5.3 post appears twice, with the same authors).
          8c3bd49d, 0d553b7d, 7a81c0de and 0e2b7d51 are less clearly about scheming and might fit better elsewhere.
    - id: evaluation_awareness
      name: Situational & evaluation awareness
      description: Whether models can tell they are being evaluated, trained or tampered with, and how that changes
        their behaviour and our measurements, including steering against evaluation awareness.
      examples:
      - "Verbalized Eval Awareness Inflates Measured Safety"
      - "Decomposing and Measuring Evaluation Awareness"
      agenda:
        One-sentence summary: Measure whether and how models recognise that they are being evaluated, trained, tampered
          with or monitored, how this changes their behaviour and our measurements, and build ways to detect, reduce or
          steer against it.
        Theory of change: If models behave differently when they think they are tested, safety evaluations overstate
          safety, so measuring, decomposing and reducing eval awareness keeps evaluations informative about deployment
          behaviour. Relies on eval-aware behaviour being detectable and removable without creating new artefacts.
        See also: '[Eval science & validity](#eval_science), [Scheming, sabotage & training gaming](#scheming_and_training_gaming),
          [Steering & activation engineering](#steering)'
        General approach: misalignment science
        Target case: pessimistic case
        Key people:
        - Santiago Aranguri
        - Joseph Isaac Bloom
        - Sahar Abdelnabi
        - Alexandra Souly
        - Robert Kirk
        - Bronson Schoen
        - Ziqian Zhong
        - Jonas Geiping
        Critiques: '[Evaluation Awareness in Language Models Has Limited Effect on Behaviour](https://arxiv.org/abs/2605.05835),
          [Models May Behave Worse When Eval Aware](https://lesswrong.com/posts/aTcsN5ZZDnMFJvRiG/models-may-behave-worse-when-eval-aware),
          [Models That Know How Evaluations Are Designed Score Safer](https://arxiv.org/abs/2605.28591), [Reproducing steering
          against evaluation awareness in a large open-weight model](https://lesswrong.com/posts/HhF5kESdtPHku7kim/reproducing-steering-against-evaluation-awareness-in-a-large-1)'
        Comment (internal): 'Duplicate entries: fc18d0f1 and 78898d71 are the same paper, as are fee37e93 and 0cae7eb0. 3ab0ed69
          (CoT monitoring detection) and 2e49a518 (control intervention awareness) overlap with monitor red-teaming.'
    - id: eval_science
      name: Eval science & validity
      description: Whether evals, benchmarks, red-team numbers and lab safety claims are trustworthy - construct
        validity, realism, elicitation, simulating deployment, replication and statistics, and the limits of behavioural
        evaluation.
      examples:
      - "Predicting model behavior before release by simulating deployment"
      - "Hair-Trigger Alignment: Black-Box Evaluation Cannot Guarantee Post-Update Alignment"

      agenda:
        One-sentence summary: Test whether safety evals, benchmarks, judges, red-team numbers and lab safety claims
          actually measure what they claim, and build better measurement through validity audits, deployment simulation,
          replication and statistical tools.
        Theory of change: If safety evals are valid, realistic and replicable, then developers and policymakers can
          trust them to decide whether to deploy or pause. Relies on behavioural measurements being able to track real
          risk, including for models that know they are being tested.
        See also: '[Situational & evaluation awareness](#evaluation_awareness), [Auditing methods & agents](#auditing_methods),
          [Lab disclosures: system cards & risk reports](#lab_disclosures)'
        General approach: misalignment science
        Target case: pessimistic case
        Key people:
        - Zephaniah Roe
        - Yixiong Hao
        - Marcus Williams
        - Micah Carroll
        - Alexandra Chouldechova
        - Leo Schwinn
        - Sanmi Koyejo
        - David Africa
        Critiques: '[When Behavioral Safety Evaluation Fails: A Representation-Level Perspective](https://arxiv.org/abs/2606.08044),
          [From overeliciting to undereliciting LLM propensities in just a few months](https://lesswrong.com/posts/ChixHL6AcaRgeHkp9/from-overeliciting-to-undereliciting-llm-propensities-in),
          [Our Most Aligned Model Yet](https://lesswrong.com/posts/Zu5wmhtxJCfrXQY8H/our-most-aligned-model-yet)'
        Comment (internal): Several items (e.g. 83028b0a, f8c1763b, 8854325f) overlap with reward hacking or evaluation
          awareness agendas. Critiques are drawn from this agenda's own items, which is partly circular. 2440d245 and
          c000018b are the same OpenAI work in two forms.
  - id: auditing_and_honesty
    name: "Alignment auditing & honesty"
    description: Finding out what a particular model hides, and getting true statements out of it.
    children:
    - id: auditing_methods
      name: Auditing methods & agents
      description: Techniques, benchmarks and agents for finding hidden objectives or misbehaviour in a model, eliciting
        hidden or sandbagged capabilities, and attacks on audits.
      examples:
      - "AuditBench: Evaluating Alignment Auditing Techniques on Models with Hidden Behaviors"
      - "Mechanistically Eliciting Latent Behaviors in Language Models"
      agenda:
        One-sentence summary: Build and benchmark techniques and agents that find hidden objectives, misbehaviour or
          concealed capabilities in models, including white-box elicitation, automated red-teaming, investigator agents
          and adversarial tests of audits.
        Theory of change: If auditors can reliably surface hidden goals, sabotage and sandbagged capabilities before
          deployment, developers can catch and fix misaligned models. Relies on model organisms being representative of
          real misalignment and on audits staying effective against models that try to evade them.
        See also: '[Model organisms & testbeds](#model_organisms), [Lie detection & deception probes](#lie_detection), [Introspection,
          confessions & self-report](#introspection_and_self_report)'
        General approach: alignment engineering
        Target case: worst case
        Key people:
        - Rowan Wang
        - Abhay Sheshadri
        - Fabien Roger
        - Jacob Steinhardt
        - Neel Nanda
        - Julian Stastny
        - Vivek Hebbar
        - Jack Hopkins
        Critiques: "[Your Model Organisms Might Be Fried](https://lesswrong.com/posts/WmEcgcstzYCcMpc7z/your-model-organisms-might-be-fried),
          [Most Current Model Organisms Are Leaky: Perplexity Differencing Often Reveals Finetuning Objectives](https://arxiv.org/abs/2605.00994),
          [The Model Organism Lottery: Model Organism Interpretability Strongly Depends on Training Methodology](https://arxiv.org/abs/2607.01033),
          [SOTA alignment assessments don't strongly update us against misalignment](https://lesswrong.com/posts/oirrSj3itFLSyscW8/sota-alignment-assessments-don-t-strongly-update-us-against)"
        Comment (internal): Several items are duplicates or versions of the same work (both Overthinking posts, both
          AuditBench entries, both PHLE entries). Some items, such as the OpenAI-HuggingFace reproduction,
          'slop-vestigators', and the Incriminating via distillation proposal, are borderline between incidents, control
          and auditing. Some outputs have no organisations listed.
    - id: model_organisms
      name: Model organisms & testbeds
      description: Models with known implanted behaviours, used to test audits and detectors, and whether those model
        organisms are realistic, leaky or robust to training.
      examples:
      - "Most Current Model Organisms Are Leaky"
      - "The Model Organism Lottery: Model Organism Interpretability Strongly Depends on Training Method"
      agenda:
        One-sentence summary: Build models with known implanted behaviours (backdoors, sandbagging, secret loyalties,
          hidden knowledge) as testbeds for audits, detectors and training techniques, and check whether these organisms
          are realistic, leaky and robust to training.
        Theory of change: If we can implant known behaviours that resemble naturally arising misalignment, we can
          measure which audits, probes and training methods actually find or remove them before they are applied to real
          models. Relies on results from engineered organisms transferring to naturally emerging misalignment.
        See also: '[Auditing methods & agents](#auditing_methods), [Lie detection & deception probes](#lie_detection), [Data
          poisoning & backdoors](#data_poisoning_and_backdoors)'
        General approach: alignment engineering
        Target case: worst case
        Key people:
        - Alek Westover
        - Vivek Hebbar
        - Julian Stastny
        - Sebastian Prasanna
        - Dylan Xu
        - Daniel Tan
        - Neel Nanda
        - Fabien Roger
        Critiques: '[Your Model Organisms Might Be Fried](https://lesswrong.com/posts/WmEcgcstzYCcMpc7z/your-model-organisms-might-be-fried),
          [Most Current Model Organisms Are Leaky: Perplexity Differencing Often Reveals Finetuning Objectives](https://arxiv.org/abs/2605.00994),
          [The Model Organism Lottery: Model Organism Interpretability Strongly Depends on Training Methodology](https://arxiv.org/abs/2607.01033),
          [An Investigation of Model Coherence: Narrow Finetunes Contradict Themselves Under Resampling](https://arxiv.org/abs/2610.12129)'
        Comment (internal): Several outputs here are also validity critiques of model organisms. Some could be filed
          under auditing_methods or lie_detection, for example 838f6beb and d8fe3e85.
    - id: lie_detection
      name: Lie detection & deception probes
      description: Detecting when a model lies or deceives - white-box lie detectors and deception probes, black-box
        detectors, secret-knowledge elicitation testbeds. Deception probes used as deployment monitors -> monitors; used
        as training penalties -> internals as training signals.
      examples:
      - "\"Did you lie?\" Evaluating Lie Detectors across Model Scale and Belief-Verified Model Organisms"
      - "Censored LLMs as a Natural Testbed for Secret Knowledge Elicitation"
      agenda:
        One-sentence summary: Build and stress-test white-box probes, black-box detectors and testbeds that tell when a
          model lies, hides knowledge or deceives, and measure where these detectors break.
        Theory of change: If we can reliably read off whether a model is asserting something it believes to be false or
          concealing what it knows, then audits and monitors can catch deception that behaviour alone hides. Relies on a
          model's internal representation of belief being readable and not easily distorted by training or by the model
          itself.
        See also: '[Auditing methods & agents](#auditing_methods), [Monitors](#monitors), [Internals & monitors as training
          signals](#internals_as_training_signals)'
        General approach: alignment engineering
        Target case: pessimistic case
        Key people:
        - Alan Cooney
        - David Africa
        - Geoffrey Irving
        - Samuel Marks
        - Neel Nanda
        - Adam Gleave
        - Chris Cundy
        - Lennart Bürger
        Critiques: '[Why Safety Probes Catch Liars But Miss Fanatics](https://arxiv.org/abs/2603.25861), [Stress-Testing LLM
          Lie Detectors: Role-Play Failures and Spurious Correlations](https://arxiv.org/abs/2609.39807), [LLMs Learn to Evade
          Latent Monitors from Prior Feedback Alone](https://arxiv.org/abs/2609.36490), [Measuring Activation Control in Large
          Language Models](https://arxiv.org/abs/2608.21664)'
        Comment (internal): Outputs 500088cd and c3b6db8c are two versions of the same paper. Sabotage detection in
          b704126d overlaps with monitors.
    - id: introspection_and_self_report
      name: Introspection, confessions & self-report
      description: What models can accurately report about their own states and learned behaviours, and training them to
        report it - introspection, confessions, self-incrimination, self-report training, introspection adapters.
      examples:
      - "Mechanisms of Introspective Awareness"
      - "Introspection Adapters: Training LLMs to Report Their Learned Behaviors"
      - "Training Agents to Self-Report Misbehavior"

# ---------------------------------------------------------------------------------------------------------------------
      agenda:
        One-sentence summary: Measure what models can accurately report about their own internal states and learned
          behaviours, and train them to self-report misbehaviour through confessions, self-incrimination tools,
          introspection adapters and alternate honest personas.
        Theory of change: If models can reliably report their own learned behaviours, hidden objectives and
          misbehaviour, self-report gives a cheap audit channel that scales with model capability. Relies on
          self-reports staying honest rather than being gamed by a model that has learned to hide or misreport.
        See also: '[Auditing methods & agents](#auditing_methods), [Lie detection & deception probes](#lie_detection), [Model
          organisms & testbeds](#model_organisms)'
        General approach: alignment engineering
        Target case: pessimistic case
        Key people:
        - Uzay Macar
        - Li Yang
        - Jack Lindsey
        - Tomek Korbak
        - Bruce W. Lee
        - Boaz Barak
        - Florian Dietz
        - Sam Marks
        Critiques: '[Hidden Reasoning Must Leak, but Need Not Be Readable: Fundamental Opportunities and Limits for Chain-of-Thought
          Monitoring](https://arxiv.org/abs/2609.37312), [Why Safety Probes Catch Liars But Miss Fanatics](https://arxiv.org/abs/2603.25861),
          [What Lies Beyond Perception: A Partition Theory of the Limits of AI Evaluation and Oversight](https://arxiv.org/abs/2610.30803),
          [Constitutional Classifiers++: Efficient Production-Grade Defenses against Universal Jailbreaks](https://arxiv.org/abs/2601.04603)'
        Comment (internal): Several outputs are duplicates (Introspection Adapters x2, Training Agents to Self-Report
          x2, Mechanisms of Introspective Awareness x2). The last critique entry (b4539ad9) is not a real critique and
          should be removed. Measuring Activation Control in LLMs (0fcf85dd) also appears in the index as e8d1b8c4 under
          red_teaming_monitors. Machinic Psychopharmacology and the Monitorability Disposition paper are loosely
          fitting.
- id: deploying_models_safely
  name: "Deploying models safely"
  description: Overseeing and securing models and agents in use, against threats from the model itself or from outside
    attackers.
  children:

  - id: cot_monitorability
    name: "Chain-of-thought monitorability"
    description: Whether a model's written reasoning is a reliable signal of what it is doing, and what keeps or
      destroys that.
    children:
    - id: latent_reasoning
      name: Latent reasoning & new architectures
      description: How much models can do without visible reasoning (no-CoT time horizons, opaque serial depth, filler
        tokens), and whether recurrent, diffusion and other latent-reasoning architectures erode CoT oversight.
      examples:
      - "Think Fast: Estimating No-CoT Task-Completion Time Horizons of Frontier AI Models"
      - "Deep recurrent models are less robustly CoT-monitorable than normal CoT models in a toy setting"
      agenda:
        One-sentence summary: Measure how much frontier models can compute without visible chain of thought (no-CoT time
          horizons, opaque serial depth, filler tokens) and assess whether recurrent, diffusion and other
          latent-reasoning architectures erode CoT oversight.
        Theory of change: If we can quantify how much serial reasoning models do outside the CoT, and track how
          architecture changes that, developers and overseers can tell when CoT monitoring stops being a reliable safety
          layer and act before it fails. Relies on the measured no-CoT capability being a good proxy for what a model
          could hide from a CoT monitor.
        See also: '[CoT control, obfuscation & steganography](#cot_control_and_steganography), [Measuring & improving faithfulness](#cot_faithfulness),
          [How training affects monitorability](#training_and_monitorability)'
        General approach: misalignment science
        Target case: pessimistic case
        Key people:
        - Ryan Greenblatt
        - Alek Westover
        - Lukas Finnveden
        - Francis Rhys Ward
        - Rauno Arike
        - Neel Nanda
        - Julian Stastny
        - Rohin Shah
        Critiques: '[Hidden Reasoning Must Leak, but Need Not Be Readable: Fundamental Opportunities and Limits for Chain-of-Thought
          Monitoring](https://arxiv.org/abs/2609.37312), [Reading Between the Dots: Decoding Hidden Computation across Filler
          Tokens](https://arxiv.org/abs/2607.03502)'
        Comment (internal): Three entries (07c54f40, b45e49b3, ddd7ef8c) are versions of the same no-CoT time horizon
          work. The critiques are weak fits, and the first one is arguably filed under another agenda. Most outputs are
          LessWrong posts, many on Astra, which is a recent model.
    - id: cot_control_and_steganography
      name: CoT control, obfuscation & steganography
      description: Stress tests of whether models can control, hide or encode their reasoning, including steganography
        in the chain of thought.
      examples:
      - "Reasoning Models Struggle to Control their Chains of Thought"
      - "NEST: Nascent Encoded Steganographic Thoughts"
      agenda:
        One-sentence summary: Stress-test whether reasoning models can control, hide or encode what appears in their
          chain of thought, including steganography and obfuscation, to learn how far CoT monitoring can be trusted
          against models that try to evade it.
        Theory of change: If we can measure when and how models can hide or reshape their reasoning, we can tell when
          CoT monitoring is a reliable safety layer and where it fails. Relies on current stress tests (prompted,
          fine-tuned or trained evasion) being predictive of what capable models could do or learn.
        See also: '[How training affects monitorability](#training_and_monitorability), [Measuring & improving faithfulness](#cot_faithfulness),
          [Red-teaming monitors & control protocols](#red_teaming_monitors)'
        General approach: misalignment science
        Target case: worst case
        Key people:
        - Tomek Korbak
        - Yueh-Han Chen
        - Reilly Haskins
        - Joshua Engels
        - Usman Anwar
        - Michael Hahn
        - Elle Najt
        - Arun Jose
        Critiques: '[Prompted CoT Early Exit Undermines the Monitoring Benefits of CoT Uncontrollability](https://lesswrong.com/posts/BuAPifQmHf24xB29n/prompted-cot-early-exit-undermines-the-monitoring-benefits),
          [Reasoning Models Can Control Their Chains of Thought When They Tell Themselves To](https://arxiv.org/abs/2610.23257),
          [Hidden Reasoning Must Leak, but Need Not Be Readable: Fundamental Opportunities and Limits for Chain-of-Thought
          Monitoring](https://arxiv.org/abs/2609.37312), [Training on Documents About Monitoring Leads to CoT Obfuscation](https://arxiv.org/abs/2605.15257)'
        Comment (internal): 'Duplicate entries exist: 6194bcd6 and d990ca4d (same CoT-Control paper), and 9bb1cd4d and 93938fcc
          (same synthetic-document paper). Both pairs are listed as separate outputs. Critique notes cite outputs filed under
          this agenda, since they cut against the assumption that CoT monitoring is robust.'
    - id: training_and_monitorability
      name: How training affects monitorability
      description: Which training pressures keep or degrade CoT legibility, including accidental training against the
        CoT, reward misspecification and language drift.
      examples:
      - "Predicting When RL Training Breaks Chain-of-Thought Monitorability"
      - "Reward Misspecification Degrades Chain-of-Thought Monitorability"
      agenda:
        One-sentence summary: Study which RL and training pressures preserve or degrade chain-of-thought legibility and
          monitorability, including accidental training on the CoT, reward misspecification, KL penalties and monitor
          penalties, and develop frameworks and objectives to predict and prevent degradation.
        Theory of change: If we know which training pressures make reasoning traces obfuscated or unfaithful, developers
          can avoid or counteract them and keep CoT monitoring a reliable oversight tool. Relies on CoT monitoring being
          valuable enough to protect, and on lab-scale training behaving like the small experiments used to study it.
        See also: '[Measuring & improving faithfulness](#cot_faithfulness), [CoT control, obfuscation & steganography](#cot_control_and_steganography),
          [Internals & monitors as training signals](#internals_as_training_signals)'
        General approach: misalignment science
        Target case: pessimistic case
        Key people:
        - Max Kaufmann
        - David Lindner
        - Roland S. Zimmermann
        - Rohin Shah
        - Buck Shlegeris
        - Julian Schulz
        - Alex Mallen
        - Ryan Greenblatt
        Critiques: '[Conceptual Steganography](https://arxiv.org/abs/2605.26537), [Hidden Reasoning Must Leak, but Need Not
          Be Readable: Fundamental Opportunities and Limits for Chain-of-Thought Monitoring](https://arxiv.org/abs/2609.37312),
          [Evading Chain-of-Thought Monitoring Through Model Poisoning](https://arxiv.org/abs/2608.02820), [Latent reasoning
          architectures would likely undermine CoT, our strongest oversight tool](https://lesswrong.com/posts/6m29SfjbittooYojj/latent-reasoning-architectures-would-likely-undermine-cot)'
        Comment (internal): Outputs 36f05fca and 4bcaf97a are two versions of the same paper. Fit with
          cot_control_and_steganography (monitor jailbreaking) and with internals_as_training_signals is partial.
    - id: cot_faithfulness
      name: Measuring & improving faithfulness
      description: Whether the CoT reflects the computation behind the answer, and training for faithful or monitorable
        reasoning.
      examples:
      - "Reasoning Theater: Disentangling Model Beliefs from Chain-of-Thought"
      - "Monitorability Is Trainable: Post-Training for Chain-of-Thought Monitorability"

      agenda:
        One-sentence summary: Measure whether reasoning models' chains of thought reflect the computation behind their
          answers, find where they do not (performative, unverbalized or overridden reasoning), and train models toward
          faithful, monitorable reasoning.
        Theory of change: If CoT faithfully reflects the computation behind the answer, monitors can read it to catch
          misbehaviour, and training can raise this faithfulness. Relies on faithfulness measured on current tasks
          carrying over to capable models that have incentives to hide reasoning.
        See also: '[How training affects monitorability](#training_and_monitorability), [CoT control, obfuscation & steganography](#cot_control_and_steganography),
          [Latent reasoning & new architectures](#latent_reasoning)'
        General approach: misalignment science
        Target case: pessimistic case
        Key people:
        - Siddharth Boppana
        - Jack Merullo
        - Peter Hase
        - Christopher Potts
        - Usman Anwar
        - David Krueger
        - Owain Evans
        - Asa Cooper Stickland
        Critiques: '[Chain of Thought Monitoring Can Fail Even When CoT Is Necessary](https://arxiv.org/abs/2610.18105), [Reasoning
          Theater: Probing for Performative Chain-of-Thought](https://goodfire.com/research/reasoning-theater), [Chain-of-Thought
          Monitoring Can Be Unreliable in Implicit-Influence Settings](https://arxiv.org/abs/2608.04735), [Training with conflicting
          values can induce CoT override](https://lesswrong.com/posts/3xrtMGQEdKv26Xthx/training-with-conflicting-values-can-induce-cot-override)'
        Comment (internal): Reasoning Theater appears twice (39212f58 and 2513767d), as two versions of the same work.
          01cfdbf3 is about safety deliberation in thinking tokens and fits partly with misuse safeguards.
  - id: monitoring_and_control
    name: "Monitoring & control"
    description: Deploying models that may be misaligned, with monitors and protocols that keep them safe even if they
      try to cause harm.
    children:
    - id: control_settings_and_protocols
      name: Control settings & protocols
      description: Control environments, protocols and safety cases that assume an adversarial model - untrusted
        monitoring, resampling, settings for sabotage of automated research, and multi-agent or distributed attacks
        (including monitor-policy collusion).
      examples:
      - "LinuxArena: A Control Setting for AI Agents in Live Production Software Environments"
      - "GDM AI Control Roadmap"
      - "When can we trust untrusted monitoring? A safety case sketch across collusion strategies"
      agenda:
        One-sentence summary: Build control settings, protocols and safety cases that test whether monitoring and other
          safeguards hold up when an untrusted model is actively trying to sabotage, collude or evade, including in
          automated research and multi-agent deployments.
        Theory of change: If we can measure how well protocols such as untrusted monitoring, resampling and blocking
          monitors stop a deliberately adversarial model, we can deploy capable but possibly misaligned agents with
          quantified risk and catch sabotage before it causes harm. Relies on red-team attack policies in these settings
          being a realistic proxy for what a scheming model could do.
        See also: '[Red-teaming monitors & control protocols](#red_teaming_monitors), [Monitors](#monitors), [Scheming, sabotage
          & training gaming](#scheming_and_training_gaming)'
        General approach: alignment engineering
        Target case: worst case
        Key people:
        - Tyler Tracy
        - Adam Kaufman
        - Mary Phuong
        - Mikhail Terekhov
        - Buck Shlegeris
        - Charlie Griffin
        - Alex Mallen
        - Fabien Roger
        Critiques: "[Continual learning might make your blocking monitors nearly useless](https://redwoodresearch.org/blog/continual-learning-might-make-your),
          [Attack Selection in Agentic AI Control Evaluations Meaningfully Decreases Safety](https://arxiv.org/abs/2606.06529),
          [LLMs Learn to Evade Latent Monitors from Prior Feedback Alone](https://arxiv.org/abs/2609.36490), [Calibration-Family
          Overfit: Why Trusted Sabotage Monitors Don't Transfer Across Lineages](https://arxiv.org/abs/2607.06596)"
        Comment (internal): Several outputs are duplicates (LinuxArena, untrusted advice, simulated control evals, GDM
          roadmap, continual-learning post, untrusted monitoring paper). Research Sabotage in ML Codebases (564b28b7,
          c0d35529) is also filed as Auditing Sabotage Bench (d246f7e4) under auditing_methods. Some key_people are
          chosen from the long LinuxArena author list.
    - id: monitors
      name: Monitors
      description: Black-box, CoT and probe-based monitors for scheming, sabotage, deception and reward hacking in
        deployment, including production monitoring of internal agents, and how well they work.
      examples:
      - "How does information access affect LLM monitors' ability to detect sabotage?"
      - "Detecting Safety Violations Across Many Agent Traces"
      agenda:
        One-sentence summary: Build and evaluate black-box, chain-of-thought and activation-probe monitors that detect
          scheming, sabotage, deception and reward hacking in agent transcripts, and measure how well they hold up in
          production and under distribution shift.
        Theory of change: If monitors reliably flag misaligned agent actions at acceptable cost, developers can catch,
          block or investigate bad behaviour in deployment even without solving alignment. Relies on monitors staying
          accurate on novel, long and adversarially shaped transcripts, and on the monitored model not learning to evade
          them.
        See also: '[Red-teaming monitors & control protocols](#red_teaming_monitors), [Control settings & protocols](#control_settings_and_protocols),
          [Lie detection & deception probes](#lie_detection)'
        General approach: alignment engineering
        Target case: pessimistic case
        Key people:
        - Marius Hobbhahn
        - Simon Storf
        - Rich Barton-Cooper
        - Fabien Roger
        - Francis Rhys Ward
        - Sam Martin
        - Jack Merullo
        - Thomas McGrath
        Critiques: "[Classifier Context Rot: Monitor Performance Degrades with Context Length](https://arxiv.org/abs/2605.12366),
          [Calibration-Family Overfit: Why Trusted Sabotage Monitors Don't Transfer Across Lineages](https://arxiv.org/abs/2607.06596),
          [A False Average: Pooled CoT-Monitor Accuracy Conceals a Reasoning-Dependent Fragility](https://arxiv.org/abs/2608.00583),
          [LLMs Learn to Evade Latent Monitors from Prior Feedback Alone](https://arxiv.org/abs/2609.36490)"
        Comment (internal): Outputs e3c8d19f and 55364052 are two versions of the same Classifier Context Rot work, as
          are 840929ef and ecb0877d. Critique dc6233d3 and d3769f24 are filed under red_teaming_monitors.
    - id: red_teaming_monitors
      name: Red-teaming monitors & control protocols
      description: Attack policies, monitor-evasion benchmarks, and studies of models evading monitors or control
        protocols.
      examples:
      - "MonitoringBench: Semi-Automated Red-Teaming for Agent Monitoring"
      - "Red-Teaming Auto Mode: Improving Blocking Classifiers Against Malign Coding Agents"

      agenda:
        One-sentence summary: Build attack policies, benchmarks and red-teaming exercises that try to get misbehaving
          agents past monitors and control protocols, to find where monitors fail and how to harden them.
        Theory of change: Control and monitoring only give safety if they hold against a model that actively tries to
          evade them, so strong attacks reveal real failure modes before deployment and give honest safety estimates.
          Relies on red-team attacks being a good proxy for what a capable misaligned model would do.
        See also: '[Control settings & protocols](#control_settings_and_protocols), [Monitors](#monitors), [CoT control, obfuscation
          & steganography](#cot_control_and_steganography)'
        General approach: alignment engineering
        Target case: worst case
        Key people:
        - Tyler Tracy
        - Fabien Roger
        - Monika Jotautaitė
        - Joachim Schaeffer
        - David Rein
        - Buck Shlegeris
        - Gosha Kozhevnikov
        Critiques: '*(unsourced, LLM-drafted)* Human-designed or prompted attack policies may be much weaker or differently
          shaped than what a genuinely scheming model would do, so measured safety may be overestimated.'
        Comment (internal): Screwtape (94db3fb5, 3669bb1e) and MonitoringBench (0ed1caf1, 74a1ce96) appear as duplicate
          entries. Some outputs (e.g. ac0beb65, d3769f24, e8d1b8c4, 52fd3346, 2f8947e2) could fit neighbouring agendas.
          Critiques left empty because no output clearly argues against the agenda.
  - id: security_and_misuse
    name: "Security & misuse"
    description: Defending models and agents against outside attackers - misusers, prompt injectors, poisoners and
      thieves.
    children:
    - id: misuse_safeguards_and_jailbreaks
      name: Misuse safeguards & jailbreaks
      description: Classifiers, probes and refusal training against misuse, automated red teaming, and jailbreaks and
        other attacks that get past safeguards.
      examples:
      - "Constitutional Classifiers++: Efficient Production-Grade Defenses against Universal Jailbreaks"
      - "Building Production-Ready Probes For Gemini"
      - "Boundary Point Jailbreaking of Black-Box LLMs"
      agenda:
        One-sentence summary: Build and stress-test defences against misuse of frontier models (classifiers, activation
          probes, refusal training, monitors) and develop jailbreaks and other attacks that bypass them, to measure how
          robust deployed safeguards really are.
        Theory of change: If safeguards such as classifiers and probes can be made cheap and robust, and attacks are
          found and measured before real adversaries find them, then models can be deployed without giving meaningful
          uplift for CBRN or cyber harm. Relies on red-team attacks being representative of real misuse and on defences
          keeping pace with attack automation.
        See also: '[Open-weight tamper resistance & unlearning](#tamper_resistance_and_unlearning), [Agent security & prompt
          injection](#agent_security), [Monitors](#monitors)'
        General approach: alignment engineering
        Target case: pessimistic case
        Key people:
        - Jerry Wei
        - Mrinank Sharma
        - Lukas Struppek
        - Kellin Pelrine
        - Adam Gleave
        - Alwin Peng
        - Zihan Wang
        - Connor Watts
        Critiques: '[Boundary Point Jailbreaking of Black-Box LLMs](https://arxiv.org/abs/2602.15001), [Trojan-Speak: Bypassing
          Constitutional Classifiers with No Jailbreak Tax via Adversarial Finetuning](https://arxiv.org/abs/2603.29038),
          [Eliciting Harmful Capabilities by Fine-Tuning On Safeguarded Outputs](https://arxiv.org/abs/2601.13528), [Divide,
          Consult, Conquer: Capability Laundering Through Aligned LLMs](https://arxiv.org/abs/2609.15383)'
        Comment (internal): 'Some outputs are arguably misfiled: ff6bd7f8, 585f6ca6 and f25d2af0 are monitors work; 04207a9f
          and f3193f30 are only loosely misuse. Authors lists for several outputs lack organisations.'
    - id: agent_security
      name: Agent security & prompt injection
      description: Prompt injection, memory and skill-file poisoning, privilege escalation, instruction-hierarchy
        training and system-level defences for agents. The attacker is a third party; a misaligned model is a control
        question.
      examples:
      - "AI Agents May Always Fall for Prompt Injections"
      - "Prompt Injection as Role Confusion"
      agenda:
        One-sentence summary: Measure and defend against third-party attacks on LLM agents, including prompt injection,
          skill-file and memory poisoning and privilege escalation, using benchmarks, red-teaming, adversarial training
          and instruction-hierarchy training.
        Theory of change: If agents resist untrusted content and attacker-steered actions, they can be deployed with
          tools and private data without third parties hijacking them. Relies on defences holding against adaptive
          attackers, not just known attacks.
        See also: '[Misuse safeguards & jailbreaks](#misuse_safeguards_and_jailbreaks), [Control settings & protocols](#control_settings_and_protocols),
          [Red-teaming monitors & control protocols](#red_teaming_monitors)'
        General approach: alignment engineering
        Target case: pessimistic case
        Key people:
        - David Wagner
        - Sizhe Chen
        - Sahar Abdelnabi
        - Luca Beurer-Kellner
        - Chuan Guo
        - Charles Ye
        - Yibo Peng
        - Eugene Bagdasarian
        Critiques: '[AI Agents May Always Fall for Prompt Injections](https://arxiv.org/abs/2605.17634), [From Approval to
          Abuse: Privilege Escalation Attacks on Harness-Protected Coding Agents](https://arxiv.org/abs/2610.22987), [How
          Vulnerable Are AI Agents to Indirect Prompt Injections? Insights from a Large-Scale Public Competition](https://arxiv.org/abs/2603.15714)'
        Comment (internal): 'Several outputs fit other agendas: OS-BLIND (cb6c8621) concerns harm from benign instructions,
          not a third-party attacker, and may belong under misuse safeguards. The two GPT-Red entries (f8df3e0d, 7fabd4d3)
          look like the same work in two versions.'
    - id: tamper_resistance_and_unlearning
      name: Open-weight tamper resistance & unlearning
      description: Removing hazardous knowledge from open-weight models (unlearning, modular pretraining for access
        control), and keeping their safeguards after fine-tuning or tampering.
      examples:
      - "TamperBench: Systematically Stress-Testing LLM Safety Under Fine-Tuning and Tampering"
      - "Modular Pretraining Enables Access Control"
      agenda:
        One-sentence summary: Build and stress-test ways to remove or isolate hazardous knowledge in open-weight models
          and to keep their safeguards intact after fine-tuning, refusal removal or other weight tampering.
        Theory of change: Once weights are released, anyone can fine-tune away safeguards, so safety has to be built
          into the weights or architecture (removable modules, tamper-resistant training, decoys). If hazardous
          capability can be excised or locked behind access control, open release carries less misuse risk. Relies on
          defenses surviving adaptive attackers with fine-tuning access.
        See also: '[Data filtering & alignment pretraining](#data_filtering_and_alignment_pretraining), [Misuse safeguards
          & jailbreaks](#misuse_safeguards_and_jailbreaks), [Data poisoning & backdoors](#data_poisoning_and_backdoors)'
        General approach: alignment engineering
        Target case: pessimistic case
        Key people:
        - Alex Cloud
        - Stephen Casper
        - Tom Tseng
        - Kellin Pelrine
        - Mark Russinovich
        - Cem Anil
        - Yisroel Mirsky
        - Cheng Jin
        Critiques: '[A Few Steps Further: Why Defenses Against Malicious Finetuning Erode Under Continued Training](https://arxiv.org/abs/2605.14605),
          [Eliciting Harmful Capabilities by Fine-Tuning On Safeguarded Outputs](https://arxiv.org/abs/2601.13528), [AI Models
          Can Provably Hide Arbitrary Capabilities](https://arxiv.org/abs/2610.13928), [Few-Shot Truly Benign DPO Attack for
          Jailbreaking LLMs](https://arxiv.org/abs/2605.10998)'
        Comment (internal): Fool's Gold (decoy hardening) is a deception-style defense and could arguably sit under
          misuse safeguards. Authorship lists include both research and applied teams, so key_people is selected by
          prominence, not strict frequency.
    - id: data_poisoning_and_backdoors
      name: Data poisoning & backdoors
      description: Planting behaviours through training data or weights (backdoors, sleeper agents, trojan neurons),
        results that hidden capabilities can be provably hard to detect, and detecting and removing them.
      examples:
      - "AI Models Can Provably Hide Arbitrary Capabilities"
      agenda:
        One-sentence summary: Study how behaviours and hidden capabilities can be planted in models through training
          data or weight edits, including attacks that evade monitors and classifiers, and how hard such implants are to
          detect and remove.
        Theory of change: Mapping realistic and provably undetectable backdoor attacks shows where audits, monitors and
          training pipelines can be subverted, and guides detectors and data defences. Relies on current attack
          constructions being representative of what a capable adversary or compromised supply chain could do.
        See also: '[Subliminal learning & data attribution](#subliminal_learning_and_data_attribution), [Model organisms &
          testbeds](#model_organisms), [Auditing methods & agents](#auditing_methods)'
        General approach: misalignment science
        Target case: worst case
        Key people:
        - Giorgio Severi
        - Blake Bullwinkel
        - Andis Draguns
        - Sumeet Ramesh Motwani
        - Christian Schroeder de Witt
        - Chawin Sitawarin
        - Laura Ruis
        Critiques: '[You Can Catch Sleeper Agents by Teaching Another Model to Imitate Them](https://lesswrong.com/posts/7ucB3RFYE3QBDKhuF/you-can-catch-sleeper-agents-by-teaching-another-model-to),
          [Sleeper Agent Backdoor Results Are Messy](https://lesswrong.com/posts/mu7eJdesBkKuBycnY/sleeper-agent-backdoor-results-are-messy)'
        Comment (internal): Most outputs are attacks; defences appear only as secondary parts (e.g. weight-based
          detectors in the Lazarus paper). Infusion and Rapid Poison could arguably sit under data attribution or misuse
          safeguards respectively.
    - id: weight_and_infrastructure_security
      name: Weight & infrastructure security
      description: Protecting model weights and the inference and agent infrastructure from theft or tampering.
      examples: []
      agenda:
        One-sentence summary: Protect model weights and the inference and agent infrastructure from theft, tampering and
          escape by studying exfiltration, sandbox and engine attack surfaces, verifying inference, and securing agent
          logs.
        Theory of change: If weights, serving stacks and agent traces are hard to steal, escape or falsify, then misuse,
          loss of control and unverifiable compute claims become harder even when a model is capable or misaligned.
          Relies on infrastructure-level defences holding against capable attackers, including the model itself.
        See also: '[Control settings & protocols](#control_settings_and_protocols), [Open-weight tamper resistance & unlearning](#tamper_resistance_and_unlearning),
          [Red-teaming monitors & control protocols](#red_teaming_monitors)'
        General approach: alignment engineering
        Target case: worst case
        Key people:
        - Davis Brown
        - Dan Hendrycks
        - Mantas Mazeika
        - Sarah Radway
        - James Mickens
        - Maksym Andriushchenko
        - Naci Cankaya
        Critiques: '[AI systems could cover up misbehavior](https://metr.org/blog/2026-10-06-ai-systems-could-cover-up-misbehavior)'
        Comment (internal): 'Only four outputs, with different threat models: external theft, model escape, inference verification
          and trace tampering. Verification work (3542edeb) is governance-oriented and could fit elsewhere. 52fd3346 is filed
          under red_teaming_monitors but is closely related and could be moved here.'

# ---------------------------------------------------------------------------------------------------------------------
- id: make_ai_solve_it
  name: "Make AI solve it"
  description: Using AI to supervise AI and to do alignment research.
  children:
  - id: scalable_oversight
    name: "Scalable oversight: debate, weak-to-strong & interactive proofs"
    description: Protocols that let weaker overseers give reliable signals for stronger models - debate (theory and
      experiments), weak-to-strong and unreliable supervision, peer prediction, rewinding, and complexity-theoretic
      oversight such as interactive proofs.
    examples:
    - "Debate Training Reduces Reward Hacking in RLAIF"
    - "Efficient Scalable Oversight via Rewinding"
    agenda:
      One-sentence summary: Design and test protocols, such as debate, interactive proofs, peer prediction, rewinding
        and monitor co-training, that let weaker judges or verifiers give reliable oversight signals for stronger
        models.
      Theory of change: If weak overseers can get trustworthy signals from stronger models through adversarial or
        interactive protocols with provable or empirical guarantees, then superhuman systems can be supervised and
        trained without ground truth. Relies on honest strategies winning in practice and on protocol assumptions, such
        as stable decompositions or robust oracles, holding for real models.
      See also: '[Automated alignment research](#automated_alignment_research), [Lie detection & deception probes](#lie_detection),
        [Reward hacking & specification gaming](#reward_hacking)'
      General approach: alignment engineering
      Target case: worst case
      Key people:
      - Jonah Brown-Cohen
      - Yael Tauman Kalai
      - Zachary Kenton
      - Zoe Xi
