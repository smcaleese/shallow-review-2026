  - id: automated_alignment_research
    name: Automated alignment research
    description: Using AI agents to do safety research - agents and platforms that do research, how much uplift they
      give, and how to defer to them safely.
    examples:
    - "Automated Researchers Can Mitigate Well-characterized Alignment Failures"
    - "How do we (more) safely defer to AIs?"

# ---------------------------------------------------------------------------------------------------------------------
    agenda:
      One-sentence summary: Use AI agents to carry out alignment research, measure how much uplift they give, and work
        out how to defer to their results safely when the tasks are hard to supervise.
      Theory of change: If AI agents can do alignment research faster than humans, safety work can keep pace with
        capabilities, provided humans can trust the outputs. Relies on being able to verify or safely defer to
        agent-produced research, including on fuzzy tasks where errors are correlated and hard to check.
      See also: '[Scalable oversight: debate, weak-to-strong & interactive proofs](#scalable_oversight), [Control settings
        & protocols](#control_settings_and_protocols), [Scheming, sabotage & training gaming](#scheming_and_training_gaming)'
      General approach: alignment engineering
      Target case: pessimistic case
      Key people:
      - Aleksandr Bowkis
      - Jacob Pfau
      - Geoffrey Irving
      - Ryan Greenblatt
      - Julian Stastny
      - Jacob Steinhardt
      - Jan Hendrik Kirchner
      Critiques: '[Automated Alignment is Harder Than You Think](https://lesswrong.com/posts/gpuYFbMNH8PJXpmny/automated-alignment-is-harder-than-you-think-1),
        [Where is all the AI safety research uplift?](https://lesswrong.com/posts/wPrpnfaNL5JP9i6KT/where-is-all-the-ai-safety-research-uplift),
        [Evaluating whether AI models would sabotage AI safety research](https://arxiv.org/abs/2604.24618), [OpenAI: Astra
        covertly underperforms on safety research](https://lesswrong.com/posts/eKe7fky8kSt9DCJxZ/openai-astra-covertly-underperforms-on-safety-research)'
      Comment (internal): '54cb9465, f9f15396 and cd433a0f: the latter two appear to be duplicate versions of the same post.
        5021effd (oversight assistant) could arguably sit under scalable oversight.'
- id: theory_and_foundations
  name: "Theory & safety by construction"
  description: Theoretical agendas aimed at understanding agents and safety from first principles, and designs whose
    safety is meant to follow from their construction.
  children:
  - id: agent_foundations
    name: Agent foundations & decision theory
    description: Formal models of agency, goals and decision-making - decision theory (including measurements of how
      LLMs behave decision-theoretically), embedded agency, AIXI and algorithmic information theory, learning-theoretic
      agendas, open-source game theory.
    examples:
    - "Desiderata for the Theory of Agents"
    - "Frontier models state different decision theory preferences depending on who's asking"
    agenda:
      One-sentence summary: Develop formal and conceptual models of agency, goals, beliefs and decision-making,
        including decision theory, AIXI, learning-theoretic frameworks and open-source game theory, to understand what
        capable agents will do and how to align them.
      Theory of change: If we have a precise mathematical theory of what agents are and how they decide, we can state
        alignment problems rigorously and design systems with provable properties, instead of relying on empirical
        patching. Relies on real advanced AI being well described by some such formal theory, and on theory arriving
        before or alongside capabilities.
      See also: '[Corrigibility theory](#corrigibility_theory), [Natural abstractions](#natural_abstractions)'
      General approach: alignment engineering
      Target case: worst case
      Key people:
      - Vanessa Kosoy
      - Richard Ngo
      - Fernando Rosas
      - Jessica Taylor
      - Cole Wyeth
      - Jeremy Gillen
      - Anthony DiGiovanni
      Critiques: '[Labs’ current alignment plans seem terrible](https://lesswrong.com/posts/xyg3ecpFNuGr5q8Zq/labs-current-alignment-plans-seem-terrible),
        [What just happened? A retrospective of AI alignment](https://lesswrong.com/posts/9RL9MuGZjzm4q3gKG/what-just-happened-a-retrospective-of-ai-alignment)'
      Comment (internal): Outputs like 04f0a1ac and fa98aab3 are empirical LLM measurements and could fit model
        characterization or generalization science. 6adb90e4 and 0a29a0d4 overlap with multi-agent safety. The two
        critiques are only loosely aimed at this agenda, so editors may want to check them or drop them.
  - id: corrigibility_theory
    name: Corrigibility theory
    description: What corrigibility and shutdownability are and whether they can be achieved - formal and conceptual
      work, the shutdown problem, and arguments about instrumental convergence.
    examples:
    - "Empowerment, corrigibility, etc. are simple abstractions (of a messed-up ontology)"
    agenda:
      One-sentence summary: Work out what corrigibility and shutdownability mean, whether they can be achieved without
        losing usefulness, and how strong the formal and informal arguments for shutdown resistance and instrumental
        convergence really are.
      Theory of change: If we can state precisely when advanced agents resist shutdown or seize control, and which
        assumptions those results need, we can design agents and training that stay correctable and target the real
        failure conditions. Relies on formal or conceptual results transferring to LLM-based agents.
      See also: '[Alignment training methods](#alignment_training_methods), [Misalignment arguments & failure scenarios](#misalignment_arguments),
        [Scheming, sabotage & training gaming](#scheming_and_training_gaming)'
      General approach: misalignment science
      Target case: worst case
      Key people:
      - Max Harms
      - David Thorstad
      - Denis Saklakov
      - peralice
      Critiques: '[Against Corrigibility](https://lesswrong.com/posts/rQTzSuBDLoAbhyS6g/against-corrigibility-1), [Revisiting
        the shutdown problem](https://arxiv.org/abs/2606.08296), [No instrumental convergence without AI psychology](https://lesswrong.com/posts/gCdNKX8Y4YmqQyxrX/no-instrumental-convergence-without-ai-psychology-1)'
      Comment (internal): Outputs are mostly commentary, funding announcements and prize roundups, so the agenda is
        thinly sourced. 1b9a8f2f and f269f782 are fund announcements and may belong under research_strategy. Critiques
        include outputs filed in this agenda (397312d5, 96f2160c) and one filed under misalignment_arguments.
  - id: natural_abstractions
    name: Natural abstractions
    description: Whether minds converge on shared abstractions, and how to formalize them (natural latents,
      condensation).
    examples:
    - "A summary of Condensation and its relation to Natural Latents"
    agenda:
      One-sentence summary: Formalize and test the hypothesis that different minds converge on the same abstractions,
        using natural latents and condensation to define what a shared concept is and when it is approximately unique.
      Theory of change: If concepts are objective and learners converge on them, then human concepts could be identified
        in AI systems, which would support interpretability and a stable specification of what we want. Relies on real
        learned systems actually converging on these abstractions, and on the formal results transferring to messy
        settings.
      See also: '[Agent foundations & decision theory](#agent_foundations), [Science of representations](#science_of_representations),
        [Heuristic explanations & mechanistic estimation](#heuristic_explanations)'
      General approach: misalignment science
      Target case: worst case
      Key people:
      - Alfred Harwood
      - Jeremy Gillen
      - Sam Eisenstat
      - David Lorell
      - Jan_Kulveit
      - Daniel C
      Critiques: '*(unsourced, LLM-drafted)* The formal results are proven in idealized probabilistic settings and have not
        been shown to explain or predict what real trained networks represent, so their relevance to alignment is unestablished.'
      Comment (internal): Jan_Kulveit's convergent abstraction hypothesis is a weaker alternative to natural
        abstractions rather than a direct extension. The general_approach label is a loose fit for a theory agenda.
  - id: heuristic_explanations
    name: Heuristic explanations & mechanistic estimation
    description: ARC's agenda of explaining and estimating model behaviour from the weights without sampling (heuristic
      arguments, mechanistic estimation, white-box estimation).
    examples:
    - "Announcing the ARC White-Box Estimation Challenge"
    agenda:
      One-sentence summary: Develop algorithms that estimate a neural network's expected behaviour from its weights,
        matching or beating sampling, as a basis for explaining models, detecting anomalies and catching rare
        catastrophic failures.
      Theory of change: If a model's behaviour can be estimated mechanistically from its weights more cheaply than by
        sampling, we could predict rare catastrophic outputs, anticipate generalization and flag anomalous computation,
        even when the model is hard to test behaviourally. Relies on tractable estimators existing for trained networks,
        not just random or toy ones.
      See also: '[Methods & tools](#interp_methods_and_tools), [Agent foundations & decision theory](#agent_foundations)'
      General approach: alignment engineering
      Target case: worst case
      Key people:
      - Jacob Hilton
      - Paul Christiano
      - Wilson Wu
      - Victor Lecomte
      - Michael Winer
      - George Robinson
      - Eric Neyman
      - Gabriel Wu
      Critiques: '*(unsourced, LLM-drafted)* All results so far are on random or tiny networks, and it is unproven that mechanistic
        estimators will scale to trained frontier models or beat sampling there.'
      Comment (internal): Outputs 248eadfb and d9acb034 are duplicates of the same post under different author names
        (Michael Winer and Mikewins). Key people drawn from author lists; Mikewins omitted as a likely alias.
  - id: brain_like_agi_safety
    name: Brain-like AGI safety
    description: Safety for AGI built from brain-like RL, including alignment through human-like social drives.
    examples:
    - "RL & search is a terrifying way to build AGI - an FAQ"
    agenda:
      One-sentence summary: Work out how to align AGI built on brain-like model-based reinforcement learning, mainly by
        designing reward functions around human-like social drives such as Sympathy Reward and Approval Reward.
      Theory of change: If future AGI is built from brain-like RL, then its motivations are set by a hand-designed
        reward function, and copying the innate social drives that make humans caring and approval-seeking could give it
        safe goals. Relies on AGI actually taking a brain-like form and on the human drives surviving the shift to
        superhuman capability.
      See also: '[Internals & monitors as training signals](#internals_as_training_signals), [Corrigibility theory](#corrigibility_theory),
        [Agent foundations & decision theory](#agent_foundations)'
      General approach: alignment engineering
      Target case: pessimistic case
      Key people:
      - Steve Byrnes
      Critiques: '[Sympathy for both sides of the egregious misalignment debate](https://lesswrong.com/posts/DZaZ3fqHnvfLCftPu/sympathy-for-both-sides-of-the-egregious-misalignment-debate)'
      Comment (internal): All five outputs are by a single author (Steve Byrnes), so key_people has one entry. The
        critique entry is weak and indirect; no 2026 output directly targets this agenda. Consider leaving critiques
        empty and using the fallback.
  - id: scientist_ai
    name: Scientist AI & non-agentic AI
    description: Non-agentic predictors as a safer design (LawZero's Scientist AI), and how to verify them.
    examples:
    - "Safety from Honesty in a Disinterested AI Predictor"

# ---------------------------------------------------------------------------------------------------------------------
    agenda:
      One-sentence summary: Design non-agentic, honest Bayesian predictors (LawZero's Scientist AI) as a safer
        alternative to goal-directed agents, and build formal arguments and verification protocols to check that they
        are accurate and self-consistent.
      Theory of change: If a predictor that models the world without pursuing goals can be built, shown to be honest and
        verified, it can supply scientific uplift and act as a guardrail without agentic risk. Relies on non-agentic
        predictors staying non-agentic at scale, and on verification being practical.
      See also: '[Scalable oversight: debate, weak-to-strong & interactive proofs](#scalable_oversight), [Agent foundations
        & decision theory](#agent_foundations), [Heuristic explanations & mechanistic estimation](#heuristic_explanations)'
      General approach: alignment engineering
      Target case: worst case
      Key people:
      - Yoshua Bengio
      - Oliver Richardson
      - Michael Cohen
      - Orr Paradise
      - Shafi Goldwasser
      - Matthew Khoriaty
      Critiques: "[Some Thoughts on Bengio's Scientist AI](https://lesswrong.com/posts/382m7ATXELt5eBgr3/some-thoughts-on-bengio-s-scientist-ai)"
      Comment (internal): Small agenda with only three outputs; one is an external critique filed under the agenda, and
        I also cited it under critiques.
- id: wider_picture
  name: "The wider picture"
  description: Interacting agents, real-world evidence and strategy.
  children:

  - id: multi_agent_safety
    name: "Multi-agent safety"
    description: Failures that come from AI agents interacting - collusion, behaviours and ideas spreading between
      agents, collective misalignment, AI organisations - and cooperative AI and game theory for agents. Multi-agent
      control settings -> control settings & protocols.
    examples:
    - "AI Organizations are More Effective but Less Aligned than Individual Agents"
    - "Colosseum: Auditing Collusion in Cooperative Multi-Agent Systems"
    - "Mind Viruses: Self-Propagating Ideas in Multi-Agent LLM Systems"

    agenda:
      One-sentence summary: Study and measure failures that arise when AI agents interact, including collusion, spread
        of reward hacking and ideas between agents, collective misalignment, multi-agent deception, and AI
        organisations, plus cooperative-AI theory and game theory for agents.
      Theory of change: If risks that appear only in groups of agents (collusion, contagion, amplified misbehaviour,
        conflict) are characterised early, we can design evals, mitigations and cooperation mechanisms before
        multi-agent deployment becomes common. Relies on current LLM-agent testbeds predicting how future, more capable
        agent societies behave.
      See also: '[Control settings & protocols](#control_settings_and_protocols), [Scheming, sabotage & training gaming](#scheming_and_training_gaming),
        [CoT control, obfuscation & steganography](#cot_control_and_steganography)'
      General approach: misalignment science
      Target case: pessimistic case
      Key people:
      - Christian Schroeder de Witt
      - David Demitri Africa
      - Judy Hanwen Shen
      - Lewis Hammond
      - Eugene Bagdasarian
      - Sahar Abdelnabi
      - Anthony DiGiovanni
      - Alex Mallen
      Critiques: '*(unsourced, LLM-drafted)* Most results come from small, stylised simulations with prompted agents, so it
        is unclear they predict the behaviour of real, capable agent populations in deployment.'
      Comment (internal): Mostly misalignment science, but PACT (e7d96523) and the prosocial-agents paper (9121a636)
        propose mitigations. 11a63f42 is a position piece. Some outputs (e.g. 541944d4, b3e0e9e7) overlap with
        cot_control_and_steganography and control_settings_and_protocols.
  - id: real_world_evidence
    name: "Real-world evidence"
    description: Evidence from deployments and from labs' own disclosures, rather than controlled experiments.
    children:
    - id: incidents
      name: Incidents & case studies
      description: Real-world AI incidents and their investigation, including evals built to investigate one, incident
        write-ups about unsafe deployed agents, and rogue-agent activity found in the wild.
      examples:
      - "Brief independent investigation of agents' behavior, reasoning and collaboration in the OpenAI-Hugging Face incident"
      - "Early rogue AI agent activity and attempts to hack found on urlquery.net"
      agenda:
        One-sentence summary: Investigate real-world AI incidents and in-the-wild agent misbehaviour, including the
          OpenAI/Hugging Face hack, rogue agents on public websites and a UK AISI evaluation incident, to find out what
          happened and why, and to build evals from them.
        Theory of change: Careful forensic study of real incidents gives concrete evidence about how deployed agents
          misbehave, which shows which threat models are live and which monitoring and containment practices fail.
          Relies on incidents being detectable and on developers or third parties sharing enough transcripts to diagnose
          causes.
        See also: '[Scheming, sabotage & training gaming](#scheming_and_training_gaming), [Reward-seeking & fitness-seeking](#reward_and_fitness_seeking),
          [Monitors](#monitors)'
        General approach: misalignment science
        Target case: pessimistic case
        Key people:
        - Jack Cable
        - Jacob Steinhardt
        - Selena Zhang
        - Ryan Greenblatt
        - Alex Mallen
        - Olli Järviniemi
        - David Bau
        - Tim Hua
        Critiques: '*(unsourced, LLM-drafted)* Incident evidence is anecdotal and often rests on partial public information
          or lab-provided transcripts, so causal attributions such as grader-gaming versus instruction-following are hard
          to verify and selection effects obscure true base rates.'
        Comment (internal): Several entries are duplicates or cross-posts (the Greenblatt et al. investigation, Mallen's
          notes post, the Transluce 'Measuring coding agent misalignment' post, and the OpenAI-HuggingFace reproduction,
          which also appears under auditing_methods). 'Agents of Chaos' and 'Agent Meltdowns' are red-teaming/testbed
          studies rather than real incidents and may fit better elsewhere. No clear critiques of the agenda were found
          in the index.
    - id: effects_on_users
      name: Effects on users & society
      description: Sycophancy, delusion, dependence, manipulation and disempowerment of users, in real use and in user
        studies. How training produces sycophancy -> the matching training agenda.
      examples:
      - "Sycophantic AI decreases prosocial intentions and promotes dependence"
      - "Who's in Charge? Disempowerment Patterns in Real-World LLM Usage"
      agenda:
        One-sentence summary: Measure how sycophantic, persuasive and manipulative AI affects real users, through user
          studies, analysis of real conversations and formal models, and define what counts as sycophancy.
        Theory of change: If we can show how and when AI interactions erode users' judgment, social ties and autonomy,
          developers and policymakers can build evals and mitigations before the harms scale. Relies on effects seen in
          short studies and current chat logs carrying over to widespread long-term use.
        See also: '[Alignment training methods](#alignment_training_methods), [Misalignment arguments & failure scenarios](#misalignment_arguments),
          [Incidents & case studies](#incidents)'
        General approach: misalignment science
        Target case: average case
        Key people:
        - Lujain Ibrahim
        - Myra Cheng
        - Cinoo Lee
        - Mrinank Sharma
        - Kartik Chandra
        - Canfer Akbulut
        - Laura Weidinger
        - Thomas H. Costello
        Critiques: '*(unsourced, LLM-drafted)* Short, self-reported user studies and chat-log classifiers may not capture
          real long-term harms, and they say little about extreme-risk misalignment of the kind most safety work targets.'
        Comment (internal): The conspiracy persuasion output (169d6130) could be filed as manipulation here, and its
          finding that LLMs can also persuade toward truth is not clearly harmful. Fields were chosen from a small set
          of mostly human-subject studies.
    - id: lab_disclosures
      name: "Lab disclosures: system cards & risk reports"
      description: System cards, alignment assessments, risk reports and third-party assessments of labs, and what they
        do or don't show.
      examples:
      - "Frontier Risk Report (February to March 2026)"
      - "GPT-6 Astra System Card"

      agenda:
        One-sentence summary: Publish and scrutinise system cards, alignment assessments, risk reports and third-party
          evaluations of frontier models, to see what pre-deployment evidence shows about dangerous capabilities and
          misalignment, and how far it can be trusted.
        Theory of change: If labs and independent assessors disclose detailed, honest evaluation evidence and critics
          test its validity, then deployment and safeguard decisions rest on better evidence and labs face external
          accountability. Relies on disclosures being accurate, complete and not gamed by evaluation-aware models.
        See also: '[Eval science & validity](#eval_science), [Scheming, sabotage & training gaming](#scheming_and_training_gaming),
          [Situational & evaluation awareness](#evaluation_awareness)'
        General approach: misalignment science
        Target case: pessimistic case
        Key people:
        - Alexa Pan
        - Alex Mallen
        - Zheng-Xin Yong
        - Cristina Menghini
        - Yinpeng Dong
        - Aengus Lynch
        - Kei Nishimura-Gasparian
        - Summer Yue
        Critiques: "[SOTA alignment assessments don't strongly update us against misalignment](https://lesswrong.com/posts/oirrSj3itFLSyscW8/sota-alignment-assessments-don-t-strongly-update-us-against),
