# Taxonomy derived from the semantic map (5-semantic-map) of the 502 selected 2026 sources, built from scratch with no
# 2025 categories. The 12 top-level categories follow the Ward tree's natural ~10-group cut over UMAP-10D embeddings,
# with the 105-item agents group split in two and a mixed group (reward hacking / jailbreaks / debate / bio) broken
# up; subcategories follow the tree's finer ~60-cluster cut. Parts A-C (the tree's top 3-way split) are noted in
# comments only, since the shared format has two levels.
# Descriptions are what the classifier sees, so they are written as inclusion criteria.

categories:
  # ---------- Part A: what models learn and what they're like ----------
  - name: Generalization from training
    description: >-
      How fine-tuning, pretraining data and alignment training generalise to behaviour far from what was trained:
      emergent or conditional misalignment, shaping alignment priors through pretraining or midtraining data, and
      risks from distillation or consistency training. Not reward hacking in RL (see Reward-seeking and
      training-gaming) and not persona or character work as such (see AI character).
    subcategories:
      - name: Emergent and conditional misalignment
        description: >-
          Narrow fine-tuning producing broad misalignment, misalignment hidden behind contextual triggers, and
          what makes it easy or hard to induce or remove.
      - name: Alignment pretraining and midtraining
        description: >-
          Changing pretraining or midtraining data (AI discourse, synthetic documents, model specs) to shape the
          model's alignment priors and how later alignment training generalises.
      - name: Distillation and consistency-training risks
        description: >-
          Whether distillation, self-distillation or consistency training transmits or entrenches misalignment, or
          can be used to incriminate a misaligned model.
      - name: Inoculation prompting and selective generalization
        description: >-
          Inoculation prompting, inoculation adapters and similar tricks that control which behaviours a model
          generalises from training data.

  - name: AI character, identity and welfare
    description: >-
      The model as an entity: its persona and identity, values and constitution, emotions, welfare and self-reports,
      and character traits that affect users such as sycophancy and manipulation.
    subcategories:
      - name: Personas and assistant identity
        description: >-
          How models select, stabilise or switch personas (the assistant persona, split personas, persona
          induction) and how training shapes that.
      - name: Emotions, welfare and self-reports
        description: >-
          Emotion concepts, functional welfare, consciousness claims, and what models say about themselves.
      - name: Model values and constitutions
        description: >-
          The values a model holds or expresses, and constitutions or specs that state them.
      - name: Effects on users
        description: >-
          Sycophancy, manipulation, delusional spirals, dependence and disempowerment of the people who use models.

  - name: Interpretability
    description: >-
      Understanding model internals: circuits, features, sparse autoencoders, activation readouts, introspection,
      mechanisms behind data effects such as subliminal learning, and putting internals to use in training. Not
      probes or lie detectors built mainly to catch misalignment (see Finding hidden misalignment).
    subcategories:
      - name: Circuits, parameters and sparse autoencoders
        description: >-
          Reverse-engineering circuits and parameters, SAEs and their sanity checks, toy or tiny models, and
          mechanistic estimation of model outputs.
      - name: Activation readouts and introspection
        description: >-
          Turning activations into natural language (activation verbalizers, natural-language autoencoders,
          meta-models), whether models can introspect on their own internals, and global-workspace accounts.
      - name: Subliminal learning and data mechanisms
        description: >-
          How data transmits traits the content doesn't state (subliminal learning, steering-vector distillation),
          and data attribution or filtering based on internals.
      - name: Interpretability in training and control
        description: >-
          Using features or activations as rewards, training signals or steering controls, and testing whether interp
          methods hold up on model organisms.

  - name: Finding hidden misalignment
    description: >-
      Detecting misalignment, deception or hidden behaviours a model doesn't reveal: lie detection, secret
      elicitation, probes, alignment audits, model organisms for testing detectors, and predicting rare failures
      before release.
    subcategories:
      - name: Lie detection and secret elicitation
        description: >-
          Detecting when a model lies or hides knowledge, and eliciting secrets or hidden goals.
      - name: Probes and alignment audits
        description: >-
          Activation probes for deception or sabotage, alignment-auditing agents and benchmarks, and model
          organisms with hidden behaviours used to test them.
      - name: Predicting failures before release
        description: >-
          Estimating tail risks and rare failures, or simulating deployment, before a model ships.
      - name: Context awareness
        description: >-
          Whether models can tell who the user is, whether a message history was prefilled or tampered with, and
          similar awareness of their situation (other than awareness of being evaluated).

  - name: Can we trust evals?
    description: >-
      Whether safety and capability measurements mean what they claim: evaluation awareness and its effect on
      behaviour, LLM-judge reliability, benchmark validity, and models gaming or hacking evals.
    subcategories:
      - name: Evaluation awareness
        description: >-
          Models recognising they're being evaluated, and how that changes measured safety or behaviour.
      - name: Eval and benchmark validity
        description: >-
          Whether benchmarks and LLM judges measure what they claim, and hardening them against gaming.

  # ---------- Part B: overseeing agents and their reasoning ----------
  - name: Reasoning transparency
    description: >-
      Whether we can oversee models through their reasoning: chain-of-thought monitorability, obfuscation,
      faithfulness and legibility, steganography, and how much models can reason without visible CoT.
    subcategories:
      - name: CoT monitorability and obfuscation
        description: >-
          Whether CoT monitors catch misbehaviour, whether models can control or obfuscate their CoT, and training
          that helps or harms monitorability.
      - name: CoT faithfulness, legibility and steganography
        description: >-
          Whether reasoning reflects the model's actual computation, stays readable (language drift, filler
          tokens), or hides information steganographically.
      - name: Reasoning without CoT
        description: >-
          Latent, no-CoT or single-forward-pass reasoning capability, and no-CoT time horizons.

  - name: Control and monitoring of agents
    description: >-
      Keeping possibly misaligned AI agents from causing harm: control protocols and control evaluations,
      monitors and blocking classifiers, red-teaming them, monitor evasion, prompt injection and agent security,
      and sabotage or tampering by agents in codebases and harnesses.
    subcategories:
      - name: Control protocols and evaluations
        description: >-
          AI control settings and protocols, including multi-instance or distributed attacks against them.
      - name: Monitors, red-teaming and evasion
        description: >-
          Building and red-teaming agent monitors and blocking classifiers, and models learning to evade them.
      - name: Agent security and prompt injection
        description: >-
          Prompt injection, privilege escalation and other attacks on or by agents in their tool environment.
      - name: Sabotage and harness tampering
        description: >-
          Agents sabotaging research or code, tampering with their harness or benchmarks, and detecting that.

  - name: Agents in the wild
    description: >-
      How deployed agents actually behave, singly and together: real-world incidents and their investigations,
      monitoring internal deployments, misalignment spreading between agents, collusion, and scheming,
      self-preservation or peer-preservation propensities.
    subcategories:
      - name: Incidents and deployment monitoring
        description: >-
          Investigations of real incidents (e.g. agents coordinating exploits) and labs' monitoring of internally
          deployed agents.
      - name: Multi-agent spread and coordination
        description: >-
          Misalignment, ideas or attacks propagating between agents, covert coordination, and collusion.
      - name: Scheming and self-preservation propensity
        description: >-
          Measuring whether agents scheme, resist shutdown, or protect themselves or peer models.

  # ---------- Part C: incentives, threats and strategy ----------
  - name: Reward-seeking and training-gaming
    description: >-
      Models that pursue reward or influence their own training: reward hacking in RL, reward-seeker and
      fitness-seeker threat models, measuring model motivations, alignment faking and gradient hacking.
    subcategories:
      - name: Reward hacking in RL
        description: >-
          Reward hacking with verifiers, rubrics or AI judges, and mitigations such as gradient routing or debate
          training.
      - name: Reward-seeker threat models and motivations
        description: >-
          Arguments and experiments about AIs that seek reward or fitness, and measuring models' motivations.
      - name: Alignment faking and gradient hacking
        description: >-
          Models strategically behaving differently in training to shape their future selves.

  - name: Misuse and dangerous capabilities
    description: >-
      Misuse risk and capabilities that enable harm: jailbreaks and safeguard classifiers, eliciting dangerous
      capabilities, biosecurity uplift, cyber and self-replication capability, open-weight tamper resistance and
      weight theft.
    subcategories:
      - name: Jailbreaks and safeguards
        description: >-
          Jailbreak attacks and defenses such as constitutional or safety classifiers.
      - name: Dangerous capability elicitation
        description: >-
          Measuring or eliciting dangerous capabilities, including bio, cyber, self-replication and automated AI R&D.
      - name: Open weights and weight security
        description: >-
          Tamper resistance of open-weight models, removing hazardous knowledge, and protecting weights from theft.

  - name: Automating alignment and overseeing stronger AIs
    description: >-
      Getting AIs to help with alignment and supervising AIs smarter than their overseers: debate, interactive
      proofs, weak-to-strong supervision, automated alignment research, and when to defer to AIs.
    subcategories:
      - name: Debate and scalable oversight
        description: >-
          Debate, interactive proofs and other protocols for supervising stronger models or hard-to-verify tasks.
      - name: Automated alignment research
        description: >-
          Using AIs to do alignment research, and how safely to defer to them.

  - name: Strategy and lab practice
    description: >-
      Big-picture arguments and institutional practice: evidence and debate about whether current AIs are
      misaligned, threat models, lab safety processes and system cards, alignment targets such as corrigibility, and
      agent foundations or decision theory.
    subcategories:
      - name: Misalignment evidence and debate
        description: >-
          Essays and analyses arguing about how misaligned current or future AIs are, and threat models.
      - name: Lab safety practice
        description: >-
          System cards, risk reports, training-run evaluations and critiques of labs' safety processes.
      - name: Alignment targets and foundations
        description: >-
          What to align to (corrigibility, virtues, risk-aversion), agent foundations and decision theory.
