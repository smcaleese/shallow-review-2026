# Hand-written taxonomy, organised roughly by the model stage each technique acts on.
# The first six categories are Stephen's draft; the last two were added after testing coverage (misuse and
# dangerous-capability work, and evaluation/auditing work, had no natural home).
# Edit freely, then rerun: uv run python 4-human-taxonomy/run.py && uv run python compare.py && uv run python report.py
# Descriptions are what the classifier sees, so write them as inclusion criteria.

categories:
  - name: "Pre-training and post-training: personas, character and psychology"
    description: >-
      Shaping or studying the model's persona, character, values and psychology through pre-training and
      post-training (data, fine-tuning, alignment training), including how training generalises to the model's
      character.

  - name: RL safety
    description: >-
      Doing reinforcement learning (e.g. RLVR, now central to post-training) properly and safely: reward hacking,
      specification gaming, and how to do RL without damaging the model's character or alignment.

  - name: AI control and monitoring
    description: >-
      Not training or influencing the model's behaviour. Instead, assume the model is potentially misaligned and
      monitor or constrain its behaviour during inference in production.
    subcategories:
      - name: Chain-of-thought monitoring
        description: >-
          Monitoring models through their reasoning: whether chain of thought stays faithful, legible and
          monitorable, and how much models can reason without it.
      - name: AI control methods
        description: >-
          Control protocols, settings and monitors that keep a possibly misaligned model from causing harm,
          including attack policies and red-teaming of the protocols.

  - name: Interpretability
    description: >-
      Improving our understanding of model internals to yield insights about any aspect of models, or to develop
      new white-box alignment, monitoring or control techniques.

  - name: Frontier misalignment incidents
    description: >-
      Studying real misalignment incidents (such as the Hugging Face attack) for insights into model behaviour,
      which safety techniques are and aren't effective, and how to build an effective safety culture at labs.

  - name: Agent foundations and alignment strategy
    description: >-
      Theoretical foundations of agency and alignment, and strategy for the alignment field.

  - name: Misuse and dangerous capabilities
    description: >-
      Measuring capabilities that could enable misuse or catastrophe (CBRN, cyber, persuasion, autonomy, AI R&D)
      and defending against misuse by people: jailbreaks, safeguard classifiers, red-teaming and model safety
      reports.

  - name: Evaluations and auditing
    description: >-
      Measuring whether a model is aligned rather than changing it: propensity evaluations for scheming and
      sabotage, evaluation awareness, sandbagging, alignment auditing, and honesty and lie detection.
