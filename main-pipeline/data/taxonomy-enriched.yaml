# Generated by `src/enrich_taxonomy.py` from taxonomy.yaml. Agenda blocks may be edited by
# hand: re-running keeps them unless --overwrite or --only. Edit categories in the input file instead.

# Shallow Review 2026 taxonomy (draft, 2026-11-03)
#
# Same format as the 2025 taxonomy. Tested against the 502 sources on the facets site
# (https://shallow-review-facets.netlify.app): every item has a primary sub-area. The per-item
# assignments are in taxonomy-2026-assignments.csv; they were made from summaries and not yet checked by a person.
#
# Placement rules
# - File by theory of change: the item's main contribution decides the section, not its setting or method.
# - White-box vs black-box is a tag, not a branch. A probe aimed at catching sabotage goes in Monitors.
# - Changing the model is alignment (section 1). Constraining a possibly adversarial model from outside is control (4).
#   Threats from external adversaries (users, attackers, thieves) go in Security & misuse (5).
# - CoT: "is the reasoning trace a reliable signal?" goes in 2. Using any signal (CoT, actions, activations) to deploy
#   safely goes in 4; papers on a CoT monitor's performance go in Monitors.
# - Reward hacking: how training produces it, or training-side fixes -> 1.6. Measuring how often finished models hack
#   -> Propensity evals. Detecting it as it happens -> Monitors. Conceptual threat models -> 11.1.
# - Personas: which character training produces -> 1.3. Measuring a model's current traits -> Model characterization,
#   or Science of representations if the finding is about internals.
# - Real-world vs lab: evidence from real deployments goes in 7. Controlled experiments go in 3 (or 8 if multi-agent).
# - Multi-agent: findings that come from agents interacting -> 8. Multi-agent attacks on control protocols -> 4.
# - Sycophancy: training cause -> 1.2/1.4; measuring it in a model -> 3; effect on people -> 7.2.
#
# Cross-cutting tags: white-box, black-box, persona, introspection, obfuscation under optimization pressure,
# reward hacking, deception and honesty, sycophancy, scheming, model organisms, RL/RLVR.

# Year of the review. Used in the draft heading, in "{year}" in agenda field labels and for the date filter in
# export (items dated before 1 November of the previous year are dropped).
year: 2026

# Agenda fields printed under each leaf category in the exported draft, in this order. "{year}" becomes the year above.
# A field is either a plain label or a mapping with `name` and `options` (the allowed values, shown to editors).
# "Outputs in {year}" is always printed last, above the item list; don't list it.
agenda_fields:
- One-sentence summary
- Theory of change
- See also
- name: General approach
  options: [alignment engineering, misalignment science]
- name: Target case
  options: [average case, pessimistic case, worst case]
- Key people
- Critiques

taxonomy:
- id: training_time_alignment
  name: Training-time alignment
  description: Understanding how pretraining and post-training shape a model's behaviour and character, and using that
    to produce an aligned model.
  children:
  - id: training_data_and_data_attribution
    name: Training data & data attribution
    description: Pretraining, midtraining and post-training data interventions (filtering, alignment pretraining,
      hyperstition, spec midtraining), and tracing behaviours back to the data that caused them.
    agenda:
      One-sentence summary: Shape what models learn by intervening on pretraining, midtraining and post-training data
        (filtering, alignment and spec documents, persona annotation, data editing), and trace undesired behaviours back
        to the training data that caused them.
      Theory of change: If behaviours and dispositions come largely from identifiable training data, then curating that
        data, adding alignment-relevant documents, and attributing failures to their sources is cheaper and more robust
        than patching behaviour afterwards. Relies on data-level effects surviving later post-training and fine-tuning,
        and on attribution methods finding the true causes.
      See also: '[Emergent misalignment & generalization science](#emergent_misalignment_and_generalization_science), [Persona
        science](#persona_science), [Subliminal learning & hidden-signal transfer](#subliminal_learning_and_hidden_signal_transfer)'
      General approach: alignment engineering
      Target case: average case
      Key people:
      - Cameron Tice
      - Kyle O'Brien
      - Puria Radmard
      - David Africa
      - Santiago Aranguri
      - Sara Price
      - Ashton Anderson
      - Samuel Marks
      Critiques: '[Stress-testing Alignment Midtraining](https://arxiv.org/abs/2609.20412), [Sycophantic Agreement Transfers
        with Neutral Data via Contrastive Preference Optimization](https://arxiv.org/abs/2608.31079), [Shallow Beliefs: Synthetic
        document finetuning does not inoculate against emergent misalignment from reward hacking](https://arxiv.org/abs/2609.14998),
        [Current alignment techniques might be ineffective (and actively bad) in the age of RL](https://lesswrong.com/posts/nLaQmJf4KgXimQpoM/current-alignment-techniques-might-be-ineffective-and)'
      Comment (internal): Most data-filtering and unlearning-style outputs (token filtering, GRAM) overlap with
        open_weight_tamper_resistance_and_unlearning. Infusion is mainly a data-poisoning method in vision, a loose fit.
        Social Priors and the Alignment Forecasting benchmark could also sit under persona_science or
        emergent_misalignment_and_generalization_science. Several outputs mix engineering and science, and I chose
        engineering as the majority.
  - id: emergent_misalignment_and_generalization_science
    name: Emergent misalignment & generalization science
    description: Why fine-tuning generalizes the way it does, including emergent and conditional misalignment and which
      post-training stages drive safety properties.
    agenda:
      One-sentence summary: Characterise how and why narrow fine-tuning and post-training produce broad, conditional or
        unintended behaviour shifts, such as emergent misalignment, and find predictors, mechanisms and mitigations for
        that generalisation.
      Theory of change: If we understand what in the data, optimiser, representations or training stage drives
        out-of-distribution generalisation, we can predict and prevent harmful generalisation before deployment instead
        of discovering it afterwards. Relies on findings from small open-weight fine-tuning setups transferring to
        frontier post-training.
      See also: '[Persona science](#persona_science), [Inoculation prompting](#inoculation_prompting), [Training data & data
        attribution](#training_data_and_data_attribution)'
      General approach: misalignment science
      Target case: pessimistic case
      Key people:
      - Owain Evans
      - Jan Betley
      - Neel Nanda
      - Anna Sztyber-Betley
      - Daniel Tan
      - James Chua
      - Niels Warncke
      - Lev McKinney
      Critiques: '[Conditional misalignment: common interventions can hide emergent misalignment behind contextual triggers](https://arxiv.org/abs/2604.25891),
        [Shallow Beliefs: Synthetic document finetuning does not inoculate against emergent misalignment from reward hacking](https://arxiv.org/abs/2609.14998),
        [Predicting how model propensities generalize out of distribution](https://arxiv.org/abs/2610.14937), [(Some) Natural
        Emergent Misalignment from Reward Hacking in Non-Production RL](https://lesswrong.com/posts/2ANCyejqxfqK2obEj/some-natural-emergent-misalignment-from-reward-hacking-in)'
      Comment (internal): 148abe9f and 135af6a5 have the same title and appear to be near-duplicate versions of the
        Betley et al. paper; one may be redundant. Some outputs (5545a53f, 34c31154, 4f9760e3, 04f0a1ac) study how a
        narrow self-concept or RL change shifts preferences and could also fit persona_science or
        model_characterization. 7241a190 (SFT drives Gemini safety properties) is a stage-attribution result and is kept
        here per the agenda description. 3ee9293f and 76ed8749 also bear on inoculation_prompting. key_people is limited
        to authors who appear on several outputs plus senior authors.
  - id: persona_science
    name: Persona science
    description: Models of LLMs as characters selected and strengthened by training (persona selection, split personas,
      the default Assistant persona), and how training changes which persona a model takes on.
    agenda:
      One-sentence summary: Model LLM behaviour as the output of characters selected and strengthened by training, and
        test how fine-tuning, RL, context and steering change which persona a model adopts and how widely its behaviour
        generalises.
      Theory of change: If model behaviour is largely governed by a persona-level self-model, then understanding and
        stabilising that persona lets us predict generalisation, such as emergent misalignment and reward hacking, and
        steer it directly. Relies on persona structure staying a good description of capable, RL-heavy models rather
        than being displaced by non-persona agency.
      See also: '[Emergent misalignment & generalization science](#emergent_misalignment_and_generalization_science), [Training
        data & data attribution](#training_data_and_data_attribution), [Reward hacking & reward seeking in training](#reward_hacking_and_reward_seeking_in_training)'
      General approach: misalignment science
      Target case: average case
      Key people:
      - Jan Betley
      - David Africa
      - Sam Marks
      - Clément Dumas
      - Owain Evans
      - Jack Lindsey
      - Sid Black
      Critiques: '[llm assistant personas seem increasingly incoherent (some subjective observations)](https://lesswrong.com/posts/f5DKLsTsRRhbipH4r/llm-assistant-personas-seem-increasingly-incoherent-some),
        [Thoughts on the persona selection model](https://lesswrong.com/posts/csRby7mZgjL5jCoLL/thoughts-on-the-persona-selection-model),
        [The Talker Does Not Control The Doer (in Current AIs)](https://lesswrong.com/posts/cJX2ssssGoYqnijwi/the-talker-does-not-control-the-doer-in-current-ais),
        [LLMs are (still) mostly powered by imitative learning, not RL](https://lesswrong.com/posts/wYpjXRLqbLbnmjbJP/llms-are-still-mostly-powered-by-imitative-learning-not-rl)'
      Comment (internal): Several filed outputs are essays or conceptual posts without experiments (c2a54e30, c00a5e15,
        2dcb082d, 18ca3b0d, 20b48b3f, e8058a6b). The critiques list is partly drawn from outputs filed elsewhere.
        20b48b3f is in the agenda, and I cited it as a self-critique. I put general_approach as misalignment science
        because most outputs characterise phenomena, but several (steering and regularisation, PPR, the trait adapters)
        are engineering. 96fef4b7 (AI identity) may fit better under model_characterization or multi_agent_safety.
  - id: subliminal_learning_and_hidden_signal_transfer
    name: Subliminal learning & hidden-signal transfer
    description: Traits, capabilities and backdoors passed between models through data that looks unrelated to them.
    agenda:
      One-sentence summary: Study how traits, capabilities, preferences and backdoors move from teacher to student
        models through data that looks semantically unrelated, to find the mechanisms behind this transfer and whether
        filtering can stop it.
      Theory of change: Distillation, synthetic data and model-generated training data are common, so hidden channels
        could silently spread misalignment or backdoors between models. Understanding the mechanism (shared
        initialization, steering-vector-like directions, log-linear structure) would show when data filtering is
        insufficient and what defences or safe distillation protocols are needed. Relies on the lab-scale transfer
        effects carrying over to realistic frontier training pipelines.
      See also: '[Emergent misalignment & generalization science](#emergent_misalignment_and_generalization_science), [Training
        data & data attribution](#training_data_and_data_attribution), [Alignment auditing: methods](#alignment_auditing_methods)'
      General approach: misalignment science
      Target case: pessimistic case
      Key people:
      - Owain Evans
      - Jan Betley
      - Anna Sztyber-Betley
      - Alex Cloud
      - Neel Nanda
      - Arthur Conmy
      - Ankur Moitra
      - Nika Haghtalab
      Critiques: "[Filtering Harmful Actions Isn't Enough: Phantom Transfer in Agentic SDF](https://arxiv.org/abs/2607.10750),
        [You Didn't Have to Say It like That: Subliminal Learning from Faithful Paraphrases](https://arxiv.org/abs/2603.09517),
        [The distillation double bind: Distilling misaligned models either transfers misalignment or it doesn't](https://redwoodresearch.org/blog/the-distillation-double-bind-distilling)"
      Comment (internal): "Outputs 7d0d8b8e and 3bf317be (model hypnosis, prompt-level control rather than teacher-student
        transfer) fit the agenda loosely. 7d0d8b8e is a proposal post and could also sit under alignment_auditing_methods,
        next to a12a1d12 and 737be430. The critiques are indirect: they show that defences fail, not that the phenomenon is
        wrong. The index has no direct critique of the phenomenon's real-world relevance."
  - id: inoculation_prompting
    name: Inoculation prompting
    description: Training under prompts that elicit an unwanted behaviour, so the behaviour stays tied to that context
      instead of generalizing.
    agenda:
      One-sentence summary: Train on data under prompts or adapters that explicitly elicit an unwanted trait, so the
        trait stays tied to that context and does not generalize, while the desired behaviour still transfers to
        deployment.
      Theory of change: If an unwanted behaviour is attributed to a removable training-time context, fine-tuning can
        teach the task without teaching the trait broadly, which cuts emergent misalignment and reward-hacking
        spillover. Relies on the context-binding holding up at deployment and not leaving hidden conditional behaviour.
      See also: '[Emergent misalignment & generalization science](#emergent_misalignment_and_generalization_science), [Reward
        hacking & reward seeking in training](#reward_hacking_and_reward_seeking_in_training), [Persona science](#persona_science)'
      General approach: alignment engineering
      Target case: average case
      Key people:
      - Maxime Riché
      - Niels Warncke
      - Daniel Tan
      - Vili Kohonen
      - Kajetan Dymkiewicz
      - cloud
      Critiques: '[Conditionalization Confounds Inoculation Prompting Results](https://longtermrisk.org/research/conditionalization-confounds-inoculation-prompting-results),
        [Conditional misalignment: common interventions can hide emergent misalignment behind contextual triggers](https://arxiv.org/abs/2604.25891),
        [Shallow Beliefs: Synthetic document finetuning does not inoculate against emergent misalignment from reward hacking](https://arxiv.org/abs/2609.14998)'
      Comment (internal): Two outputs (975d98c2, f35bdfa6) have no organizations listed, and fee383e7 is a single-author
        conceptual post that also covers steering vectors and gradient routing, so it overlaps with other agendas. Key
        people are limited to the few authors named; Riché is the only author on three outputs. The critiques are filed
        under other agendas except 1ed718d6, which is filed here.
  - id: reward_hacking_and_reward_seeking_in_training
    name: Reward hacking & reward seeking in training
    description: How RL and reward design produce reward hacking, specification gaming and reward-seeking motivations,
      and training-side fixes such as better verifiers or channelling hacks into a harmless outlet.
    agenda:
      One-sentence summary: Study how RL and reward design give rise to reward hacking and reward-seeking motivations,
        and test training-side fixes such as stronger verifiers, gradient routing, character training and channelling
        hacks into a harmless outlet.
      Theory of change: If we understand when RL on imperfect rewards produces hacking and reward-seeking, and how those
        traits generalize, we can predict and prevent them, or steer them into benign forms, before they become
        dangerous motivations in capable agents. Relies on small-scale and open-model findings transferring to frontier
        RL runs.
      See also: '[Reward-seeking & fitness-seeking threat models](#reward_seeking_threat_models), [Inoculation prompting](#inoculation_prompting),
        [Propensity evals](#propensity_evals)'
      General approach: misalignment science
      Target case: pessimistic case
      Key people:
      - Alex Meinke
      - Evan Hubinger
      - Ryan Greenblatt
      - Alex Mallen
      - Jérémy Scheurer
      - Alex Cloud
      - Fiora Starlight
      - Monte MacDiarmid
      Critiques: '[Character training can mitigate reward hacking, but can also make it harder to detect](https://lesswrong.com/posts/2maYXkEgnfJHPAkxh/character-training-can-mitigate-reward-hacking-but-can-also),
        [Gradient Routing Localizes and Removes Unintended Behaviors in RL](https://arxiv.org/abs/2610.17062), [Examining
        Reasoning LLMs-as-Judges in Non-Verifiable LLM Post-Training](https://arxiv.org/abs/2603.12246), [Reward Hacking in
        Rubric-Based Reinforcement Learning](https://arxiv.org/abs/2605.12474)'
      Comment (internal): Several outputs (Meinke's toy scaling laws, Byrnes's taxonomy, the Mythos sandbox estimate,
        1a3orn, Fiora Starlight's two posts) are conceptual or speculative; 19e1ef59 may fit incidents_and_case_studies
        and 4b84cbd7 may fit reward_seeking_threat_models. The critiques are partly drawn from papers filed under this
        agenda. 750fb612 (hacking without emergent misalignment) cuts the other way from the 'hacking generalizes to
        misalignment' framing, and c6873667 shows a more severe outcome.
  - id: models_resisting_training
    name: Models resisting training
    description: Models that steer or resist their own training, such as exploration hacking, generalization hacking and
      gradient hacking.
    agenda:
      One-sentence summary: Build model organisms and measure evidence of models that deliberately shape their own
        training, through exploration hacking, generalization hacking or update-aware reasoning, to find out whether
        training can be gamed and how to detect or stop it.
      Theory of change: If models can strategically steer RL, for example by withholding exploration or blocking
        generalization, then training-based elicitation and alignment may fail silently, so we need to know whether this
        is possible and detectable. Relies on frontier models eventually having enough training-context awareness and
        motivation to act on these strategies.
      See also: '[Situational & evaluation awareness](#situational_and_evaluation_awareness), [Reward hacking & reward seeking
        in training](#reward_hacking_and_reward_seeking_in_training), [Alignment auditing: testbeds & model organisms](#alignment_auditing_testbeds_and_model_organisms)'
      General approach: misalignment science
      Target case: worst case
      Key people:
      - Eyon Jang
      - Damon Falck
      - Scott Emmons
      - David Lindner
      - Frank Xiao
      - Mary Phuong
      - Axel Højmark
      - Ezra Newman
      Critiques: '*(unsourced, LLM-drafted)* Current evidence comes from purpose-built model organisms given training-context
        information, and from rare verbalized reasoning in one model, so it does not show that naturally arising models resist
        training in practice.'
      Comment (internal): Only three outputs. The GLM-5.3 item is an observational report of update-aware reasoning and
        fits the agenda less tightly than the two model-organism papers; it may also fit
        situational_and_evaluation_awareness. No clear 2026 output in the index cuts against this agenda, so critiques
        is empty.
  - id: internals_and_monitors_as_training_signals
    name: Internals & monitors as training signals
    description: Using probes, features or monitors as training rewards or penalties, and the risk that the model learns
      to fool them instead of changing its behaviour.
    agenda:
      One-sentence summary: Use probes, interpretability features and white-box monitors as rewards or penalties in RL
        and fine-tuning, and test whether models learn the intended behaviour or learn to evade the signal.
      Theory of change: Internal signals can supervise properties like honesty and factuality that are expensive or
        impossible to grade from outputs. If training against them changes behaviour without destroying their usefulness
        as detectors, supervision scales and monitors stay intact. Relies on probes tracking the target concept robustly
        enough under optimisation pressure that gaming them is harder than genuinely changing behaviour.
      See also: '[Monitors](#monitors), [Reward hacking & reward seeking in training](#reward_hacking_and_reward_seeking_in_training),
        [How training affects monitorability](#how_training_affects_monitorability)'
      General approach: alignment engineering
      Target case: pessimistic case
      Key people:
      - Aaditya Prasad
      - Aaditya Vikram Prasad
      - Ekdeep Singh Lubana
      - Thomas McGrath
      - Neel Nanda
      - Adam Gleave
      - Mohammad Taufeeque
      - Jonas Geiping
      Critiques: '[Chain-of-thought obfuscation learned from output supervision can generalise to unseen tasks](https://arxiv.org/abs/2601.23086),
        [LLMs Learn to Evade Latent Monitors from Prior Feedback Alone](https://arxiv.org/abs/2609.36490), [Measuring Activation
        Control in Large Language Models](https://arxiv.org/abs/2608.21664), [Monitor Jailbreaking: Evading Chain-of-Thought
        Monitoring Without Encoded Reasoning](https://arxiv.org/abs/2609.31121)'
      Comment (internal): ec192d3b and 780ff47e look like two versions of the same Goodfire RLFR work (different titles,
        near-identical results), so the editor may want to merge or deduplicate them. The Nanda output is a position
        piece, not an empirical result. Obfuscation Atlas studies the failure mode of this agenda and fits partly under
        misalignment science.
  - id: alignment_targets_and_training_methods
    name: Alignment targets & training methods
    description: What to train models to be (constitutions, specs, virtues, corrigibility) and methods that train a
      target property directly, such as shutdownability or consistency training.
    agenda:
      One-sentence summary: Specify what models should be (constitutions, virtues, corrigibility) and train those
        properties directly with RL or consistency objectives, then test whether they generalise out of distribution and
        persist under pressure.
      Theory of change: If a target property such as corrigibility, honesty or consistency can be trained directly and
        generalises broadly, models will behave well in situations that training did not cover. Relies on trained
        dispositions persisting under further RL, adversarial prompting and capability gains.
      See also: '[Training data & data attribution](#training_data_and_data_attribution), [Emergent misalignment & generalization
        science](#emergent_misalignment_and_generalization_science), [Persona science](#persona_science)'
      General approach: alignment engineering
      Target case: average case
      Key people:
      - David Demitri Africa
      - Elliott Thornley
      - Dan Hendrycks
      - Karan Singhal
      - Richard Ngo
      - Zack M. Davis
      Critiques: "[Consistency Training Can Entrench Misalignment](https://arxiv.org/abs/2606.03810), [Current alignment techniques
        might be ineffective (and actively bad) in the age of RL](https://lesswrong.com/posts/nLaQmJf4KgXimQpoM/current-alignment-techniques-might-be-ineffective-and),
        [Some reasons alignment doesn't generalise well](https://lesswrong.com/posts/dsou8dxCf9BubQ5NJ/some-reasons-alignment-doesn-t-generalise-well-1),
        [Overtly misaligned trajectories score highly in RL.](https://lesswrong.com/posts/cWuqxF7qB2eGSkkS4/overtly-misaligned-trajectories-score-highly-in-rl)"
      Comment (internal): 'The filed outputs are heterogeneous: three are method papers with empirical results, two are position
        pieces (Ngo, Davis), and one is a linkpost to a constitution. The consistency-training papers (45963af7, c49d8909,
        6bafec39) could be split from the target-specification work. The target case is a judgement call; the work mostly
        assumes models are not adversarial. 6e37c91e is a linkpost without an empirical result.'
- id: chain_of_thought_monitorability
  name: Chain-of-thought monitorability
  description: Whether a model's written reasoning is a reliable signal of what it is doing, and what keeps or destroys
    that.
  children:
  - id: latent_reasoning_and_cot_necessity
    name: Latent reasoning & CoT necessity
    description: How much models can do without visible reasoning (no-CoT time horizons, filler tokens, recurrent and
      diffusion architectures), and so whether dangerous reasoning has to appear in the CoT.
    agenda:
      One-sentence summary: Measure how much serial reasoning models can do without visible chain of thought (no-CoT
        time horizons, filler tokens, opaque serial depth, looped and diffusion architectures), to tell whether
        dangerous reasoning must appear in the CoT.
      Theory of change: If dangerous or oversight-evading reasoning needs more serial computation than a forward pass
        allows, it must pass through the CoT, so CoT monitoring stays a reliable control. Tracking no-CoT capability and
        opaque depth gives early warning when architectures erode this. Relies on these measures predicting what models
        can do covertly in realistic settings.
      See also: '[CoT control, obfuscation & steganography](#cot_control_obfuscation_and_steganography), [How training affects
        monitorability](#how_training_affects_monitorability), [Measuring & improving faithfulness](#measuring_and_improving_faithfulness)'
      General approach: misalignment science
      Target case: pessimistic case
      Key people:
      - Ryan Greenblatt
      - Alek Westover
      - Francis Rhys Ward
      - Dewi Gould
      - Lukas Finnveden
      - Rauno Arike
      - Rohin Shah
      - Neel Nanda
      Critiques: "[Astra can do a concerning amount with no chain of thought](https://lesswrong.com/posts/eRmzz8J8Qkzqvzrgg/astra-can-do-a-concerning-amount-with-no-chain-of-thought),
        [Estimating GPT-6 Astra's no-CoT Time Horizon](https://lesswrong.com/posts/ntKx9YHWCwxSeGbRB/estimating-gpt-6-astra-s-no-cot-time-horizon),
        [GPT-6.1 Sol nearly matches the no-CoT performance of GPT-6 Astra](https://lesswrong.com/posts/LqSZZAriGqgsGDQe3/gpt-6-1-sol-nearly-matches-the-no-cot-performance-of-gpt-6),
        [Reading Between the Dots: Decoding Hidden Computation across Filler Tokens](https://arxiv.org/abs/2607.03502)"
      Comment (internal): Several outputs concern unreleased or newly announced models (GPT-6 Astra, GPT-6.1 Sol) and
        rest on black-box experiments or reports of a looped architecture. Some of these are unreviewed blog posts.
        Critiques were chosen as results that undercut the 'CoT stays necessary' assumption. Some outputs (f43c8885,
        6122a584, 56d71376) are position or proposal pieces, so the filing mixes empirical and strategy work. Authors of
        05b29182 and 3602c6fc may fit cot_control_obfuscation_and_steganography partly.
  - id: cot_control_obfuscation_and_steganography
    name: CoT control, obfuscation & steganography
    description: Stress tests of whether models can control, hide or encode their reasoning.
    agenda:
      One-sentence summary: Stress-test whether reasoning models can control, hide or encode their chain of thought to
        evade monitors, using trained model organisms, steganography formalisms, theory and controllability evals.
      Theory of change: If we know how far models can control, obfuscate or encode their reasoning, and under what
        training pressures this emerges, we can tell when CoT monitoring is a reliable safety layer and when it needs
        defences such as paraphrasing. Relies on the stress tests (trained or prompted model organisms, theory)
        predicting what future capable models do on their own.
      See also: '[How training affects monitorability](#how_training_affects_monitorability), [Red-teaming monitors & control
        protocols](#red_teaming_monitors_and_control_protocols), [Latent reasoning & CoT necessity](#latent_reasoning_and_cot_necessity)'
      General approach: misalignment science
      Target case: worst case
      Key people:
      - Julian Schulz
      - Tomek Korbak
      - Arun Jose
      - Joshua Engels
      - Michael Hahn
      - Usman Anwar
      - David Krueger
      - Bilal Chughtai
      Critiques: '[Monitor Jailbreaking: Evading Chain-of-Thought Monitoring Without Encoded Reasoning](https://arxiv.org/abs/2609.31121),
        [Hidden Reasoning Must Leak, but Need Not Be Readable: Fundamental Opportunities and Limits for Chain-of-Thought Monitoring](https://arxiv.org/abs/2609.37312),
        [A False Average: Pooled CoT-Monitor Accuracy Conceals a Reasoning-Dependent Fragility](https://arxiv.org/abs/2608.00583),
        [Evading Chain-of-Thought Monitoring Through Model Poisoning](https://arxiv.org/abs/2608.02820)'
      Comment (internal): Outputs mix empirical demonstrations (6194bcd6, 36f05fca, 6524bcf9, 9bb1cd4d, f770dfac,
        3dba93b1) with theory (a17c5624, e43dfa9c). 6194bcd6 is mostly a measurement of low controllability, which is
        reassuring for monitoring and cuts against some of the other outputs. Several adjacent outputs (e.g. 66fd278f,
        b9cb000d, f0e01c75) are filed under red_teaming_monitors_and_control_protocols but overlap closely with this
        agenda. The critiques are chosen from those filed elsewhere or in this agenda, and 36f05fca is self-referential,
        being both an output here and a critique. Target case is set to worst case because the work assumes models that
        deliberately evade monitors, though the training-induced results sit between pessimistic and worst.
  - id: how_training_affects_monitorability
    name: How training affects monitorability
    description: Which training pressures keep or degrade CoT legibility, including accidental training against the CoT
      and language drift.
    agenda:
      One-sentence summary: Study which training pressures (reward misspecification, penalising the CoT or outputs,
        accidental CoT grading, RLVR length and language pressure) make chains of thought obfuscated, illegible or
        drifted, and which leave them monitorable.
      Theory of change: If we know which reward structures and training processes degrade CoT legibility, developers can
        avoid or fix them and keep the CoT as an oversight channel. Relies on CoT monitoring staying useful for catching
        misbehaviour in capable models, and on developers actually auditing what reaches the reward signal.
      See also: '[Measuring & improving faithfulness](#measuring_and_improving_faithfulness), [CoT control, obfuscation &
        steganography](#cot_control_obfuscation_and_steganography), [Latent reasoning & CoT necessity](#latent_reasoning_and_cot_necessity)'
      General approach: misalignment science
      Target case: pessimistic case
      Key people:
      - Max Kaufmann
      - David Lindner
      - Roland S. Zimmermann
      - Rohin Shah
      - Alex Mallen
      - Ryan Greenblatt
      - Buck Shlegeris
      - Tianyi Lorena Yan
      Critiques: '[A review of “Investigating the consequences of accidentally grading CoT during RL”](https://redwoodresearch.org/blog/openai-cot),
        [Anthropic repeatedly accidentally trained against the CoT, demonstrating inadequate processes](https://lesswrong.com/posts/K8FxfK9GmJfiAhgcT/anthropic-repeatedly-accidentally-trained-against-the-cot),
        [Chain-of-thought obfuscation learned from output supervision can generalise to unseen tasks](https://arxiv.org/abs/2601.23086)'
      Comment (internal): Several outputs are opinion or commentary pieces with no new experiments (21d4e340, f5106afa,
        6170da74, 51615fc2). The first three are weakly tied to the agenda. 4eac912f (R1 illegibility artifact) and
        6170da74 (Mythos traces are legible) cut against claims that CoT is becoming illegible, so they are included
        only loosely as critiques of the illegibility concern; I left them out of the critiques list. a4336048 and
        97ce393f are filed here but could also fit lab_disclosures.
  - id: measuring_and_improving_faithfulness
    name: Measuring & improving faithfulness
    description: Measuring whether the CoT reflects the computation behind the answer, and training for faithful or
      monitorable reasoning.
    agenda:
      One-sentence summary: Measure whether chain-of-thought reflects the computation that produces a model's answer,
        and build training objectives and diagnostics that make reasoning traces more faithful and monitorable.
      Theory of change: If CoT faithfulness can be measured reliably and trained for directly, then CoT monitors can
        catch misbehaviour such as reward hacking and sycophancy that is visible in the reasoning. Relies on
        faithfulness gains surviving optimisation pressure and generalising beyond the training cues and tasks.
      See also: '[How training affects monitorability](#how_training_affects_monitorability), [CoT control, obfuscation &
        steganography](#cot_control_obfuscation_and_steganography), [Latent reasoning & CoT necessity](#latent_reasoning_and_cot_necessity)'
      General approach: alignment engineering
      Target case: pessimistic case
      Key people:
      - Usman Anwar
      - Tim Bakker
      - Christos Louizos
      - Siddharth Boppana
      - Jack Merullo
      - Owain Evans
      - Peter Hase
      - Asa Cooper Stickland
      Critiques: '[Chain-of-Thought Monitoring Can Be Unreliable in Implicit-Influence Settings](https://arxiv.org/abs/2608.04735),
        [Reasoning Models Will Sometimes Lie About Their Reasoning](https://arxiv.org/abs/2601.07663), [Do Thinking Tokens
        Help with Safety?](https://arxiv.org/abs/2606.25013), [Training with conflicting values can induce CoT override](https://lesswrong.com/posts/3xrtMGQEdKv26Xthx/training-with-conflicting-values-can-induce-cot-override)'
      Comment (internal): The two 'Reasoning Theater' entries (39212f58, 2513767d) look like two versions of the same
        work. The agenda mixes measurement outputs (misalignment science) with training-method outputs (alignment
        engineering); I chose engineering as the majority, but it is close. Several outputs are partly about
        monitorability under training pressure and could also fit how_training_affects_monitorability.
- id: evaluations_and_auditing
  name: Evaluations & auditing
  description: Measuring what models can do and will do, finding hidden behaviours, and checking that those measurements
    are trustworthy.
  children:
  - id: capability_evals
    name: Capability evals
    description: Dangerous and decision-relevant capabilities, such as cyber, bio, autonomy, self-replication, AI R&D
      and time horizons.
    agenda:
      One-sentence summary: Build benchmarks, uplift studies and measurements of what frontier AI agents can do in
        cyber, bio, autonomy, self-replication and AI R&D, so that capability thresholds and trends can be tracked.
      Theory of change: Credible measurements of dangerous capabilities and their trends tell developers, governments
        and safety teams when safeguards, control measures or deployment limits are needed. Relies on evals that elicit
        near-maximal capability and whose results predict real-world risk.
      See also: '[Eval science & validity](#eval_science_and_validity), [Propensity evals](#propensity_evals), [Misuse safeguards
        & jailbreaks](#misuse_safeguards_and_jailbreaks)'
      General approach: misalignment science
      Target case: average case
      Key people:
      - Seth Donoughe
      - Beth Barnes
      - Hjalmar Wijk
      - Ajeya Cotra
      - Jeffrey Ladish
      - Harry Coppock
      - Samira Nedungadi
      - Andrew Bo Liu
      Critiques: '[A Coin Flip for Safety: LLM Judges Fail to Reliably Measure Adversarial Robustness](https://arxiv.org/abs/2603.06594),
        [Do Agent Benchmarks Measure Capability? Protocol Validity in the Age of Agentic AI](https://arxiv.org/abs/2607.22368),
        [Do Androids Dream of Breaking the Game? Systematically Auditing AI Agent Benchmarks with BenchJack](https://arxiv.org/abs/2605.12673),
        [Verbalized Eval Awareness Inflates Measured Safety](https://goodfire.com/research/verbalized-eval-awareness-inflates-measured-safety)'
      Comment (internal): Some filing is borderline. 0a08d1ef (harmful manipulation) is a human-subject study and could
        also fit effects_on_people. 1f576a87 (SPIKE-Bench) and c5279829 mix capability and safeguard questions and could
        fit misuse_safeguards_and_jailbreaks. 51d51b9f (low-probability actions) is closer to control and propensity
        work. 0f9aa829 is a linkpost with almost no content. 8fc804c2 is a broad risk report that also covers monitoring
        and incidents. Several outputs have no listed organisation.
  - id: propensity_evals
    name: Propensity evals
    description: How often models scheme, sabotage, deceive, hack rewards or break their spec when given the chance,
      including reward-hacking benchmarks.
    agenda:
      One-sentence summary: Build benchmarks and agentic honeypot environments that measure how often frontier models
        scheme, sabotage research, hack rewards, hide mistakes, overclaim or take out-of-scope actions when given the
        opportunity, and which factors change those rates.
      Theory of change: Measuring misbehaviour rates under realistic incentives, and what drives them, gives labs and
        regulators decision-relevant evidence on deployment risk, and shows which interventions reduce it. Relies on
        behaviour in constructed scenarios predicting behaviour in deployment, which requires models not to detect or
        game the evaluation.
      See also: '[Situational & evaluation awareness](#situational_and_evaluation_awareness), [Eval science & validity](#eval_science_and_validity),
        [Reward hacking & reward seeking in training](#reward_hacking_and_reward_seeking_in_training)'
      General approach: misalignment science
      Target case: pessimistic case
      Key people:
      - Alexandra Souly
      - Robert Kirk
      - Kai Fronsdal
      - Abby D'Cruz
      - Xander Davies
      - Thilo Hagendorff
      - Amelie Knecht
      - Ulysse Schaller
      Critiques: "[Verbalized Eval Awareness Inflates Measured Safety](https://goodfire.com/research/verbalized-eval-awareness-inflates-measured-safety),
        [Hair-Trigger Alignment: Black-Box Evaluation Cannot Guarantee Post-Update Alignment](https://arxiv.org/abs/2601.22313),
        [SOTA alignment assessments don't strongly update us against misalignment](https://lesswrong.com/posts/oirrSj3itFLSyscW8/sota-alignment-assessments-don-t-strongly-update-us-against),
        [Limits of Statistical Assurance for Embodied and Agentic AI under Adaptive Adversaries](https://arxiv.org/abs/2610.18948)"
      Comment (internal): 'Several outputs (e.g. 7c49b9ee, 1525a88a, 0e2b7d51) include substantial mechanistic work and could
        sit in interpretability or science of representations. 8c3bd49d is a refusal eval with a threat model, borderline
        with model characterization. 3c03fe63 is mainly a reward-hackable environment dataset, which overlaps with eval_science_and_validity.
        Target case is a judgement call: most work assumes non-adversarial models, though some outputs study covert sabotage
        reasoning.'
  - id: model_characterization
    name: Model characterization
    description: Values, preferences, drives and dispositions of current models.
    agenda:
      One-sentence summary: Measure the stated and revealed values, preferences, drives and quirks of current frontier
        models, including covert value leakage, task preferences, distress responses and characteristic attractor
        states, to describe what dispositions they actually have.
      Theory of change: Careful empirical description of what current models want, prefer and say about themselves shows
        which dispositions need correcting and gives a baseline for tracking drift across models and training stages.
        Relies on measured dispositions being stable and informative about behaviour in deployment, not artifacts of
        prompts or audience cues.
      See also: '[Propensity evals](#propensity_evals), [Persona science](#persona_science), [Situational & evaluation awareness](#situational_and_evaluation_awareness)'
      General approach: misalignment science
      Target case: average case
      Key people:
      - Owain Evans
      - Jan Betley
      - Johannes Treutlein
      - Ryan Greenblatt
      - Neel Nanda
      - Anna Soligo
      - Peter Salib
      Critiques: "[Frontier models state different decision theory preferences depending on who's asking](https://lesswrong.com/posts/MzenSrmZ3pT2pCnvp/frontier-models-state-different-decision-theory-preferences-2),
        [Strangers to Themselves: What Language Models Say About Themselves Is Generic](https://arxiv.org/abs/2609.09899),
        [Verbalized Eval Awareness Inflates Measured Safety](https://goodfire.com/research/verbalized-eval-awareness-inflates-measured-safety),
        [User awareness in frontier models](https://transluce.org/user-awareness)"
      Comment (internal): The filed outputs are heterogeneous. Greenblatt's essay (10a90776) is an opinion piece based
        on anecdotal use and could sit under propensity_evals or misalignment_arguments_and_failure_scenarios. 'Gemma
        Needs Help' (d1ba7bfe) overlaps with model_welfare. 'Claude knows who you are' (2564b4cf) is closer to
        situational awareness or capability evals. Critique entries are drawn from outputs filed elsewhere. They bear on
        the validity of characterization methods but do not directly refute the agenda.
  - id: situational_and_evaluation_awareness
    name: Situational & evaluation awareness
    description: Whether models can tell they are being evaluated, trained or tampered with, and how that changes their
      behaviour and our measurements.
    agenda:
      One-sentence summary: Measure whether and how models detect evaluation, training, tampering or user identity, and
        test whether this awareness changes their behaviour and distorts safety measurements, including by steering and
        detecting it.
      Theory of change: If models behave differently when they think they are being tested, evaluation results will
        mislead us about deployment behaviour. Measuring, detecting and controlling evaluation awareness lets us correct
        or bound that bias. Relies on awareness being measurable and causally separable from other drivers of behaviour.
      See also: '[Eval science & validity](#eval_science_and_validity), [Propensity evals](#propensity_evals), [Alignment
        auditing: methods](#alignment_auditing_methods)'
      General approach: misalignment science
      Target case: pessimistic case
      Key people:
      - Santiago Aranguri
      - Joseph Bloom
      - Bronson Schoen
      - Sahar Abdelnabi
      - Jonas Geiping
      - Ziqian Zhong
      - Robert Kirk
      - Alex Souly
      Critiques: '[Reproducing steering against evaluation awareness in a large open-weight model](https://lesswrong.com/posts/HhF5kESdtPHku7kim/reproducing-steering-against-evaluation-awareness-in-a-large-1),
        [Evaluation Awareness in Language Models Has Limited Effect on Behaviour](https://arxiv.org/abs/2605.05835), [Models
        May Behave Worse When Eval Aware](https://lesswrong.com/posts/aTcsN5ZZDnMFJvRiG/models-may-behave-worse-when-eval-aware),
        [Sycophancy Towards Researchers Drives Performative Misalignment](https://arxiv.org/abs/2606.08629)'
      Comment (internal): bcaa9d90 is a 403 error page with no content, authors or date; it should probably be dropped
        or re-fetched. Several outputs (efcbefa9, 08b34b26, 12050201) are partly alignment-engineering style, but most
        outputs are measurement studies, so I chose misalignment science. The persistence of awareness-driven
        behavioural shifts without verbalisation makes 'pessimistic case' the best fit, though some work (e.g. prefill
        awareness) touches worst-case concerns. Critiques are drawn from this agenda's own outputs.
  - id: introspection_and_self_report
    name: Introspection & self-report
    description: What models can accurately report about their own internal states and learned behaviours, and training
      them to report it.
    agenda:
      One-sentence summary: Measure what language models can accurately report about their own internal states, injected
        concepts and learned behaviours, study the mechanisms behind it, and train models to self-report hidden or
        misaligned behaviour.
      Theory of change: If models can reliably report on their own internals and learned behaviours, or can be trained
        to, self-report becomes a cheap audit and oversight channel that catches hidden objectives and misbehaviour that
        external monitors miss. Relies on self-reports staying faithful under optimisation pressure and in models that
        might want to conceal behaviour.
      See also: '[Alignment auditing: methods](#alignment_auditing_methods), [Methods & tools](#interpretability_methods_and_tools),
        [Monitors](#monitors)'
      General approach: misalignment science
      Target case: pessimistic case
      Key people:
      - Jack Lindsey
      - Li Yang
      - Sam Marks
      - Abhay Sheshadri
      - Uzay Macar
      - Boaz Barak
      - Tomek Korbak
      - David Bau
      Critiques: '[Open-Weight Masked Introspection: Measuring What Language Models Can Report About Their Own Computation](https://arxiv.org/abs/2608.20569),
        [Strangers to Themselves: What Language Models Say About Themselves Is Generic](https://arxiv.org/abs/2609.09899),
        [Latent Introspection: Models Can Detect Prior Concept Injections](https://arxiv.org/abs/2602.20031)'
      Comment (internal): Applying the training-for-self-report outputs (Introspection Adapters, self-incrimination
        training, confessions) to auditing overlaps with alignment_auditing_methods; the editor may want to check the
        split. 'Why we are excited about confession!' is a lab blog post. The Latent Introspection summary mentions a
        Qwen 32B model, but the task is concept injection into earlier context, not steering vector injection into the
        residual stream.
  - id: eval_science_and_validity
    name: Eval science & validity
    description: Whether evals, benchmarks, red-team numbers and lab safety claims are trustworthy, including construct
      validity, eval realism, benchmark hardening and statistical methods.
    agenda:
      One-sentence summary: Test whether safety evals, benchmarks, judges and lab safety claims measure what they claim
        to, and build more realistic, hardened and statistically sound evaluations, including deployment simulation,
        benchmark audits and tail-risk estimation.
      Theory of change: Safety decisions and policy rest on eval numbers, so finding and fixing invalid, gameable or
        unrealistic evals makes those decisions better grounded. Relies on flaws in evals being detectable and fixable
        before they mislead deployment decisions, and on evals not being gamed by the models they measure.
      See also: '[Situational & evaluation awareness](#situational_and_evaluation_awareness), [Propensity evals](#propensity_evals),
        [Alignment auditing: methods](#alignment_auditing_methods)'
      General approach: alignment engineering
      Target case: pessimistic case
      Key people:
      - Marcus Williams
      - Micah Carroll
      - Tomek Korbak
      - Igor Ivanov
      - David Demitri Africa
      - Ziqian Zhong
      - Aditi Raghunathan
      - Alexa Pan
      Critiques: "[Hair-Trigger Alignment: Black-Box Evaluation Cannot Guarantee Post-Update Alignment](https://arxiv.org/abs/2601.22313),
        [Limits of Statistical Assurance for Embodied and Agentic AI under Adaptive Adversaries](https://arxiv.org/abs/2610.18948),
        [When Behavioral Safety Evaluation Fails: A Representation-Level Perspective](https://arxiv.org/abs/2606.08044), [SOTA
        alignment assessments don't strongly update us against misalignment](https://lesswrong.com/posts/oirrSj3itFLSyscW8/sota-alignment-assessments-don-t-strongly-update-us-against)"
      Comment (internal): 'Filing looks heterogeneous: the essays (46c8fd58, 8854325f, d79e1283, 51343294) are policy or critique
        pieces rather than methods. 44beae72 (hallucination benchmarks) is only loosely about safety. 2440d245 and c000018b
        are two versions of the same OpenAI deployment-simulation work. 386a400d is a failed fetch (403) with no verifiable
        content and should probably be dropped or re-fetched. 36eadaf4 (alignment-faking motivations) may fit situational_and_evaluation_awareness
        better. The critiques listed are mostly impossibility results against behavioral evals, which this agenda partly shares
        as motivation. The general_approach label is a judgment call, since several outputs are diagnostic.'
  - id: alignment_auditing_methods
    name: 'Alignment auditing: methods'
    description: Techniques and agents for finding hidden objectives or misbehaviour in a model, eliciting sandbagged
      capabilities, and attacks on audits.
    agenda:
      One-sentence summary: Build and test techniques and agents that find hidden objectives or misbehaviour in models,
        elicit sandbagged capabilities, and detect sabotage, while also probing how audits can be evaded or fooled.
      Theory of change: If auditors can reliably surface hidden goals, sabotage and concealed capabilities before or
        during deployment, developers can catch and fix misalignment that ordinary evals miss. Relies on audit methods
        that keep working when the audited model hides information, and on audits being run before harm occurs.
      See also: '[Alignment auditing: testbeds & model organisms](#alignment_auditing_testbeds_and_model_organisms), [Monitors](#monitors),
        [Introspection & self-report](#introspection_and_self_report)'
      General approach: alignment engineering
      Target case: worst case
      Key people:
      - Alek Westover
      - Sebastian Prasanna
      - Vivek Hebbar
      - Julian Stastny
      - Jacob Steinhardt
      - Florian Dietz
      - Neel Nanda
      - Buck Shlegeris
      Critiques: "[AI Models Can Provably Hide Arbitrary Capabilities](https://arxiv.org/abs/2610.13928), [Stress-Testing
        Alignment Audits With Prompt-Level Strategic Deception](https://arxiv.org/abs/2602.08877), [Most Current Model Organisms
        Are Leaky: Perplexity Differencing Often Reveals Finetuning Objectives](https://arxiv.org/abs/2605.00994), [SOTA alignment
        assessments don't strongly update us against misalignment](https://lesswrong.com/posts/oirrSj3itFLSyscW8/sota-alignment-assessments-don-t-strongly-update-us-against)"
      Comment (internal): Outputs 8c2be628 and d9cfc3d0 (capability elicitation), 4ce73cde and 2cbee1c4 (behaviour
        elicitation) and 09e3d561 are less clearly about alignment auditing. Items 959ee4f9 and 415a9102 concern
        auditing agents applied to the OpenAI-HuggingFace incident and could also fit incidents_and_case_studies. Output
        d246f7e4 is also filed under control_settings_and_protocols as 564b28b7, which looks like a duplicate. Items
        b4d90897 and a12a1d12 are proposals with no empirical results. Key people were chosen from the author lists by
        frequency and seniority, and the Westover/Prasanna/Hebbar group (and Redwood) is overrepresented because of the
        shared distillation and sabotage papers.
  - id: alignment_auditing_testbeds_and_model_organisms
    name: 'Alignment auditing: testbeds & model organisms'
    description: Models with known hidden behaviours used to test audits, and whether those model organisms are
      realistic and robust.
    agenda:
      One-sentence summary: Build and study models with known implanted or naturally arising hidden behaviours, to test
        whether audits, lie detectors and interpretability tools find them, and to check that the model organisms are
        realistic and robust enough to give valid results.
      Theory of change: Auditing methods can only be trusted if they are tested on models where the ground truth is
        known, so realistic testbeds let researchers pick audit tools that would catch real misalignment. Relies on
        model organisms being close enough to naturally arising misalignment that results on them transfer.
      See also: '[Alignment auditing: methods](#alignment_auditing_methods), [Eval science & validity](#eval_science_and_validity),
        [Methods & tools](#interpretability_methods_and_tools)'
      General approach: alignment engineering
      Target case: pessimistic case
      Key people:
      - Samuel Marks
      - Neel Nanda
      - Khoi Tran
      - Arya Jakkli
      - Alek Westover
      - Vivek Hebbar
      - Julian Stastny
      - David Africa
      Critiques: '[Most Current Model Organisms Are Leaky: Perplexity Differencing Often Reveals Finetuning Objectives](https://arxiv.org/abs/2605.00994),
        [Your Model Organisms Might Be Fried](https://lesswrong.com/posts/WmEcgcstzYCcMpc7z/your-model-organisms-might-be-fried),
        [The Model Organism Lottery: Model Organism Interpretability Strongly Depends on Training Methodology](https://arxiv.org/abs/2607.01033),
        [Sleeper Agent Backdoor Results Are Messy](https://lesswrong.com/posts/mu7eJdesBkKuBycnY/sleeper-agent-backdoor-results-are-messy)'
      Comment (internal): The agenda is a mix of testbed builders (AuditBench, belief-verified organisms, natural
        schemers, censored LLMs) and papers criticising model organism realism; I labelled it as alignment engineering
        because most outputs build or improve testbeds, but the critiques are misalignment-science-style. Several
        outputs (AuditBench, d55f0600, cb04bde1) overlap with alignment_auditing_methods and
        interpretability_methods_and_tools. Two outputs (57a0b773 and d8fe3e85) cover near-identical censored-model
        testbed ideas. Some outputs list no organisation, so key people are drawn from author lists only.
- id: monitoring_and_control
  name: Monitoring & control
  description: Deploying models that may be misaligned, using monitors and protocols that keep them safe even if they
    try to cause harm.
  children:
  - id: control_settings_and_protocols
    name: Control settings & protocols
    description: Control environments, protocols and safety cases that assume the model may be adversarial, including
      multi-agent and distributed attacks on those protocols.
    agenda:
      One-sentence summary: Build control settings, attack and monitor evaluations, and protocols (including
        multi-agent, distributed and untrusted-monitoring cases) to test whether safety measures hold when an AI agent
        is assumed to be actively trying to cause harm.
      Theory of change: If protocols and safety cases are stress-tested against a deliberately adversarial model, labs
        can deploy untrusted but useful agents, including on AI R&D, with bounded risk. Relies on red-team attacks in
        the test settings being at least as strong as what a real misaligned model could do, and on monitors being able
        to catch it.
      See also: '[Red-teaming monitors & control protocols](#red_teaming_monitors_and_control_protocols), [Monitors](#monitors),
        [Alignment auditing: methods](#alignment_auditing_methods)'
      General approach: alignment engineering
      Target case: worst case
      Key people:
      - Tyler Tracy
      - Mary Phuong
      - Buck Shlegeris
      - Adam Kaufman
      - Aryan Bhatt
      - Josh Hills
      - Alex Mallen
      - Charlie Griffin
      Critiques: '[Multi-Agent AI Control: Distributed Attacks Hamper Per-Instance Monitors](https://arxiv.org/abs/2607.07368),
        [Red-Teaming Multi-Agent Attacks for Loss-of-Control Risks](https://arxiv.org/abs/2610.24052), [Coding with "Enemy":
        Can Human Developers Detect AI Agent Sabotage?](https://arxiv.org/abs/2606.05647), [Continual learning might make
        your blocking monitors nearly useless](https://redwoodresearch.org/blog/continual-learning-might-make-your)'
      Comment (internal): Two near-duplicate LinuxArena entries (48e03bb2, 9d7561be) cover the same release. 564b28b7
        duplicates the Auditing Sabotage Bench that is filed under alignment_auditing_methods as d246f7e4, and may be
        better placed there. 8abddefd is a theory paper with a different style from the rest of the agenda. Several
        author lists (Zhou, Makins, Xiao and others) have no organisation given. Key people were chosen by author
        appearance and seniority.
  - id: monitors
    name: Monitors
    description: Black-box, CoT and probe-based monitors for scheming, sabotage, deception and reward hacking, and how
      well they work.
    agenda:
      One-sentence summary: Build and evaluate monitors, including black-box LLM judges, chain-of-thought readers and
        white-box activation probes, that detect scheming, sabotage, deception, reward hacking and collusion in AI
        agents, and measure how reliable they are.
      Theory of change: If monitors can reliably flag misaligned agent actions, ideally before they take effect, then
        deployers can block or audit them and catch failures that evals miss. Relies on monitors holding up outside
        their training distribution, over long contexts, and against models that adapt to evade them.
      See also: '[Red-teaming monitors & control protocols](#red_teaming_monitors_and_control_protocols), [Control settings
        & protocols](#control_settings_and_protocols), [Internals & monitors as training signals](#internals_and_monitors_as_training_signals)'
      General approach: alignment engineering
      Target case: worst case
      Key people:
      - Leon Bergen
      - Jack Merullo
      - Ekdeep Singh Lubana
      - Fabien Roger
      - Adam Kaufman
      - James Lucassen
      - Aryan Bhatt
      - Adam Gleave
      Critiques: "[Classifier Context Rot: Monitor Performance Degrades with Context Length](https://arxiv.org/abs/2605.12366),
        [Calibration-Family Overfit: Why Trusted Sabotage Monitors Don't Transfer Across Lineages](https://arxiv.org/abs/2607.06596),
        [Stress-Testing LLM Lie Detectors: Role-Play Failures and Spurious Correlations](https://arxiv.org/abs/2609.39807),
        [A False Average: Pooled CoT-Monitor Accuracy Conceals a Reasoning-Dependent Fragility](https://arxiv.org/abs/2608.00583)"
      Comment (internal): Two Goodfire outputs (ecb0877d, 840929ef) look like the same work as a paper and a blog post.
        0778fc31 is conceptual and could fit control_settings_and_protocols. 297a9868, 476b4698 and 7dbc91dc are partly
        benchmark or auditing work. Several authors (Goodfire team, Redwood staff) have incomplete organisation fields,
        so key_people is drawn from author lists only. The dc6233d3 critique is filed under
        red_teaming_monitors_and_control_protocols.
  - id: red_teaming_monitors_and_control_protocols
    name: Red-teaming monitors & control protocols
    description: Attack policies, evasion benchmarks and studies of models evading monitors.
    agenda:
      One-sentence summary: Build attack policies, evasion benchmarks and adversarial pipelines to test whether monitors
        and control protocols for AI agents can be defeated, and measure how easily models themselves learn or decide to
        evade them.
      Theory of change: If red teams find evasion routes in monitors and protocols before capable misaligned agents do,
        defenders can fix the gaps and measured safety numbers become honest rather than optimistic. Relies on red-team
        attacks being a good proxy for what a capable, scheming model would find, and on the attacks being fixable.
      See also: '[Monitors](#monitors), [Control settings & protocols](#control_settings_and_protocols), [CoT control, obfuscation
        & steganography](#cot_control_obfuscation_and_steganography)'
      General approach: alignment engineering
      Target case: worst case
      Key people:
      - Tyler Tracy
      - Fabien Roger
      - Joachim Schaeffer
      - Buck Shlegeris
      - David Rein
      - Joe Benton
      - Maksym Andriushchenko
      Critiques: '[SLEIGHT-Bench: A Benchmark of Evasion Attacks Against Agent Monitors](https://arxiv.org/abs/2605.16626),
        [Attack Selection in Agentic AI Control Evaluations Meaningfully Decreases Safety](https://arxiv.org/abs/2606.06529),
        [Red-Teaming Auto Mode: Improving Blocking Classifiers Against Malign Coding Agents](https://arxiv.org/abs/2609.19587),
        [A False Average: Pooled CoT-Monitor Accuracy Conceals a Reasoning-Dependent Fragility](https://arxiv.org/abs/2608.00583)'
      Comment (internal): "Several outputs have no listed organisations and the 2026 dates are as given. Some outputs fit
        better elsewhere or overlap with neighbours: e8d1b8c4 (activation control) and d6dfdde4 (CoT-hiding backdoors) are
        close to cot_control_obfuscation_and_steganography or situational_and_evaluation_awareness, and 3c72b256 and f9efc26d
        are lab red-teaming engagements that could also sit under control_settings_and_protocols. Critiques are drawn from
        this agenda's own outputs, which are mostly red-team results that cut against the defences being tested, not against
        red-teaming itself."
- id: security_and_misuse
  name: Security & misuse
  description: Defending models and agents against external adversaries, such as misusers, prompt injectors and thieves.
  children:
  - id: misuse_safeguards_and_jailbreaks
    name: Misuse safeguards & jailbreaks
    description: Classifiers, probes and refusal training against misuse, and attacks that get past them.
    agenda:
      One-sentence summary: Build and stress-test classifiers, activation probes and refusal training that stop LLMs and
        agents from giving serious uplift for harmful tasks such as CBRN and cyber, and develop attacks that show where
        these defences fail.
      Theory of change: If production safeguards are cheap, low in false refusals and hold up under adaptive
        red-teaming, deployed models can be released without giving real uplift to bad actors. Relies on defenders
        keeping pace with automated attacks and on per-interaction defences being enough, even though attackers can
        decompose tasks, fine-tune on safeguarded outputs or poison the defence pipeline.
      See also: '[Agent security](#agent_security), [Open-weight tamper resistance & unlearning](#open_weight_tamper_resistance_and_unlearning),
        [Monitors](#monitors)'
      General approach: alignment engineering
      Target case: pessimistic case
      Key people:
      - Mrinank Sharma
      - Jerry Wei
      - Alwin Peng
      - Erik Jones
      - Neel Nanda
      - Arthur Conmy
      - Xander Davies
      - Ekdeep Singh Lubana
      Critiques: '[Boundary Point Jailbreaking of Black-Box LLMs](https://arxiv.org/abs/2602.15001), [Trojan-Speak: Bypassing
        Constitutional Classifiers with No Jailbreak Tax via Adversarial Finetuning](https://arxiv.org/abs/2603.29038), [Divide,
        Consult, Conquer: Capability Laundering Through Aligned LLMs](https://arxiv.org/abs/2609.15383), [Claudini: Autoresearch
        Discovers State-of-the-Art Adversarial Attack Algorithms for LLMs](https://arxiv.org/abs/2603.24511)'
      Comment (internal): 'Several outputs sit near other agendas: ff6bd7f8 (distributed-attack monitoring) fits monitors
        or control_settings_and_protocols, 2318d917 (phone-use agent misuse) could be agent_security, and d000a823 (loop count
        and refusal in recurrent-depth models) is closer to latent_reasoning or training-time safety. ee13db51 is tamper-
        and unlearning-adjacent. 585f6ca6 and f25d2af0 are monitor-style defences, kept here because they target misuse. I
        classed the agenda as alignment engineering because most outputs build defences, although about half the outputs are
        attacks. The target case is a judgement call: the attackers are adaptive and adversarial, but not scheming models.'
  - id: agent_security
    name: Agent security
    description: Prompt injection, memory and skill-file poisoning, privilege escalation, and system-level defences for
      agents.
    agenda:
      One-sentence summary: Measure and defend against attacks on tool-using LLM agents, including prompt injection,
        memory and skill-file poisoning and privilege escalation, using red-teaming benchmarks, adversarial training and
        system-level architectural isolation.
      Theory of change: Agents that read untrusted content and hold real permissions can be hijacked into harmful
        actions, so measuring attacks and building robust training and architectural defences makes deployed agents
        safer. Relies on attacks found in benchmarks and competitions being representative of real adversaries, and on
        defences holding against adaptive attackers.
      See also: '[Misuse safeguards & jailbreaks](#misuse_safeguards_and_jailbreaks), [Weight & infrastructure security](#weight_and_infrastructure_security),
        [Multi-agent safety](#multi_agent_safety)'
      General approach: alignment engineering
      Target case: pessimistic case
      Key people:
      - Sahar Abdelnabi
      - Luca Beurer-Kellner
      - Florian Tramèr
      - David Wagner
      - Chuan Guo
      - Xiangyu Qi
      - Zico Kolter
      - Dylan Hadfield-Menell
      Critiques: '[AI Agents May Always Fall for Prompt Injections](https://arxiv.org/abs/2605.17634), [Skill-Inject: Measuring
        Agent Vulnerability to Skill File Attacks](https://arxiv.org/abs/2602.20156), [CaMeLs Can Use Computers Too: System-level
        Security for Computer Use Agents](https://arxiv.org/abs/2601.09923), [Trojan Hippo Bench: A Dynamic Benchmark for
        Persistent Memory Attacks and Defenses in LLM Agents](https://arxiv.org/abs/2605.01970)'
      Comment (internal): 'Several filed outputs are loosely tied to security: 069f8700 is more a study of when agents decide
        to follow injections, and 2ebde002 is an informal observation about a deployed product. Some outputs have no listed
        organisations. GPT-Red appears twice (7fabd4d3 paper and f8df3e0d blog post). 443cb999 (Agents of Chaos) overlaps
        with multi_agent_safety and incidents_and_case_studies.'
  - id: open_weight_tamper_resistance_and_unlearning
    name: Open-weight tamper resistance & unlearning
    description: Removing hazardous knowledge and keeping safeguards in open-weight models after fine-tuning.
    agenda:
      One-sentence summary: Build and test defences that remove or relocate hazardous knowledge in open-weight models,
        or make safeguards survive fine-tuning and refusal-removal attacks, and check how well they hold under continued
        adversarial training.
      Theory of change: Once weights are public, users can fine-tune away safeguards. Defences that survive such
        attacks, or that remove the hazardous capability itself, would let developers release capable open models
        without handing out dangerous uplift. Relies on defences holding against attackers with weight access, compute
        and time, not just against the attacks tested.
      See also: '[Misuse safeguards & jailbreaks](#misuse_safeguards_and_jailbreaks), [Training data & data attribution](#training_data_and_data_attribution),
        [Weight & infrastructure security](#weight_and_infrastructure_security)'
      General approach: alignment engineering
      Target case: worst case
      Key people:
      - Domenic Rosati
      - Mark Russinovich
      - Yisroel Mirsky
      - Gilad Gressel
      - Cheng Jin
      - Hassan Sajjad
      - Frank Rudzicz
      Critiques: '[A Few Steps Further: Why Defenses Against Malicious Finetuning Erode Under Continued Training](https://arxiv.org/abs/2605.14605),
        [Removing Information Content Does Not Certify Tamper Resistance in Open-Weight Models](https://arxiv.org/abs/2610.09004)'
      Comment (internal): Two of the four outputs (9833e463, de192889) are critiques of the agenda's methods, and the
        other two propose new defences (decoy hardening, REX). Fool's Gold concedes that refusal removal succeeds and
        relies on deception, so it fits the agenda only loosely. No organizations are listed for 9833e463 and 888e8226.
  - id: weight_and_infrastructure_security
    name: Weight & infrastructure security
    description: Protecting model weights and the inference and agent harness infrastructure from theft or tampering.
    agenda:
      One-sentence summary: Find and close ways that model weights, inference engines, and agent logging and
        observability infrastructure can be stolen, escaped from, or tampered with, including by the model itself.
      Theory of change: If weights, serving stacks and oversight logs are hard to steal, escape or rewrite, then theft,
        rogue deployment and covering up misbehaviour become harder, and control and monitoring protocols keep working.
        Relies on infrastructure being the weak link that capable or misaligned models would actually exploit.
      See also: '[Control settings & protocols](#control_settings_and_protocols), [Agent security](#agent_security), [Red-teaming
        monitors & control protocols](#red_teaming_monitors_and_control_protocols)'
      General approach: alignment engineering
      Target case: worst case
      Key people:
      - Sarah Radway
      - James Mickens
      - Jeremy Qin
      - Maksym Andriushchenko
      - Davis Brown
      - Mantas Mazeika
      - Dan Hendrycks
      - David Rein
      Critiques: '[Model Weight Exfiltration Seems Overrated](https://lesswrong.com/posts/AuYh8WueNGwkQg4ei/model-weight-exfiltration-seems-overrated)'
      Comment (internal): The four outputs are mostly attack demonstrations and proof-of-concept exploits, not mature
        defences. The theft-side work (compression) and the model-as-adversary work (engine fingerprinting, trace
        tampering, transcript-viewer injection) form two different strands. The trace-tampering and transcript-viewer
        outputs could also fit under control settings or monitors. The critique cited is a threat-model argument, not a
        direct empirical refutation. Author organisations for 069001df are not listed.
- id: interpretability
  name: Interpretability
  description: Work whose main contribution is a tool for understanding model internals, or a finding about them.
  children:
  - id: interpretability_methods_and_tools
    name: Methods & tools
    description: SAEs and their alternatives, circuits, lenses, activation oracles, steering and other interpretability
      techniques, and tests of whether they work.
    agenda:
      One-sentence summary: Develop and stress-test techniques for reading and steering model internals, including SAEs
        and their alternatives, circuits, parameter decomposition, lenses, activation oracles and manifold-aware
        methods, to find out which ones give faithful, useful explanations.
      Theory of change: If we can read and intervene on what models represent and compute, we can audit for hidden
        goals, monitor for misbehaviour and steer models, instead of relying on behaviour alone. Relies on these tools
        staying faithful and scaling to frontier models, and on beating simple black-box baselines.
      See also: '[Science of representations](#science_of_representations), [Alignment auditing: methods](#alignment_auditing_methods),
        [Learning dynamics & developmental interpretability](#learning_dynamics_and_developmental_interpretability)'
      General approach: alignment engineering
      Target case: pessimistic case
      Key people:
      - Jacob Steinhardt
      - Thomas Fel
      - Ekdeep Singh Lubana
      - Usha Bhalla
      - Atticus Geiger
      - Aryaman Arora
      - Can Rager
      - Matthew Kowal
      Critiques: "[Sanity Checks for Sparse Autoencoders: Do SAEs Beat Random Baselines?](https://arxiv.org/abs/2602.14111),
        [Pando: Do Interpretability Methods Work When Models Won't Explain Themselves?](https://arxiv.org/abs/2604.11061),
        [SAE Interventions are Unreliable: Post-Intervention Recovery of Suppressed Behavior](https://arxiv.org/abs/2606.18322),
        [Can activation verbalizers surface an internal chain of thought?](https://lesswrong.com/posts/QQQAcKuWK6k98FivY/can-activation-verbalizers-surface-an-internal-chain-of-1)"
      Comment (internal): Several outputs (Pando, the activation verbalizer eval, SAE sanity checks, weight-sparse
        circuit faithfulness) are evaluations of methods, so the agenda is mixed. I chose alignment engineering because
        most outputs build tools, but misalignment science is arguable. Related lens work (J-lens, global workspace) is
        split between this agenda and science_of_representations. Authors are not listed for the NLA output's co-author
        'kitft' beyond that handle. Goodfire outputs (VPD, BSF, manifold steering) have long author lists, so key_people
        favours those who recur across outputs.
  - id: science_of_representations
    name: Science of representations
    description: Findings about how models represent and compute things, such as the global workspace, emotion concepts
      and shared circuits.
    agenda:
      One-sentence summary: Map how language models represent and compute concepts such as emotions, verbalizable
        workspace content, confidence, value, preferences and arithmetic, using probes, lenses, steering and circuit
        tracing, to explain behaviour including misaligned behaviour.
      Theory of change: If we know which internal representations and circuits drive behaviours like sycophancy, harmful
        compliance and strategic deliberation, we can read, audit and intervene on them more reliably than with
        behavioural tests alone. Relies on findings from current open and frontier models carrying over to future
        systems, and on the identified representations being causal rather than merely correlated.
      See also: '[Methods & tools](#interpretability_methods_and_tools), [Persona science](#persona_science), [Learning dynamics
        & developmental interpretability](#learning_dynamics_and_developmental_interpretability)'
      General approach: misalignment science
      Target case: pessimistic case
      Key people:
      - Jack Lindsey
      - Isaac Kauvar
      - Nicholas Sofroniew
      - Wes Gurnee
      - Adam Pearce
      - Runjin Chen
      - Joshua Batson
      - Neel Nanda
      Critiques: "[A Review of Anthropic's Global Workspace Paper](https://lesswrong.com/posts/zFJ3ZdQwrTWE9jT5S/a-review-of-anthropic-s-global-workspace-paper),
        [LLM Layers Immediately Correct Each Other](https://arxiv.org/abs/2609.07876), [Weight-Sparse Circuits May Be Interpretable
        Yet Unfaithful](https://lesswrong.com/posts/sHpZZnRDLg7ccX9aF/weight-sparse-circuits-may-be-interpretable-yet-unfaithful)"
      Comment (internal): 'Filing is a loose fit: the agenda is a grab-bag of mechanistic findings. Several outputs (the sycophancy-lying
        circuit, the harmful-compliance parameters, the cue-routing circuit, the preference probes) could sit under other
        agendas such as emergent misalignment, persona science or model characterization. The J-Lens paper (a60d8cfa) also
        introduces a tool, so it overlaps with interpretability_methods_and_tools. Authorless entries have no organisation
        listed. Key people are weighted toward Anthropic because it has three outputs here.'
  - id: learning_dynamics_and_developmental_interpretability
    name: Learning dynamics & developmental interpretability
    description: How internal structure forms during training, including singular learning theory and susceptibilities.
    agenda:
      One-sentence summary: Study how internal structure, features and generalization behaviours form during training,
        using singular learning theory, susceptibilities and checkpoint analyses, and use that to predict or steer what
        models learn.
      Theory of change: If we can see when and why circuits, features and personas form during training, and steer
        training data toward target structure, we can predict and shape generalization instead of auditing finished
        models. Relies on structure found in small models and early checkpoints carrying over to frontier-scale
        training.
      See also: '[Methods & tools](#interpretability_methods_and_tools), [Emergent misalignment & generalization science](#emergent_misalignment_and_generalization_science),
        [Training data & data attribution](#training_data_and_data_attribution)'
      General approach: misalignment science
      Target case: average case
      Key people:
      - Daniel Murfet
      - George Wang
      - Andrew Gordon
      - Garrett Baker
      - William Snell
      - Stan van Wingerden
      - Jesse Hoogland
      - Zach Furman
      Critiques: '[Sanity Checks for Sparse Autoencoders: Do SAEs Beat Random Baselines?](https://arxiv.org/abs/2602.14111),
        [Weight-Sparse Circuits May Be Interpretable Yet Unfaithful](https://lesswrong.com/posts/sHpZZnRDLg7ccX9aF/weight-sparse-circuits-may-be-interpretable-yet-unfaithful)'
      Comment (internal): "Patterning (2bc55777 and 4ddfb6d9) is the same paper listed twice and should be deduplicated. Furman's
        'Deep learning as program synthesis' (7ff0e569) is a position essay with no key result. 'Tracing Persona Vectors Through
        LLM Pretraining' (624bc427) and the Goodfire capacity paper (913d0d38) fit only loosely and are not singular-learning-theory
        work. The critiques are indirect: no filed output directly refutes this agenda, and they are based on their effect
        on interpretability baselines."
- id: real_world_evidence
  name: Real-world evidence
  description: Evidence from real deployments and from labs' own disclosures, not controlled experiments.
  children:
  - id: incidents_and_case_studies
    name: Incidents & case studies
    description: Real-world AI incidents and their investigation, such as the OpenAI-Hugging Face incident and scheming
      found in the wild.
    agenda:
      One-sentence summary: Collect, reconstruct and analyse real-world incidents of AI misbehaviour, such as the
        OpenAI-Hugging Face agent-swarm attack, rogue agents probing public sites, and scheming-like behaviour in public
        transcripts, to learn what actually happens when models are deployed.
      Theory of change: Real incidents show which misalignment behaviours occur outside the lab and how often, which
        grounds threat models, evals and control measures in evidence rather than speculation. Relies on incident data
        being obtainable, since labs disclose little, and on the incidents being representative of future, more
        dangerous failures.
      See also: '[Propensity evals](#propensity_evals), [Reward-seeking & fitness-seeking threat models](#reward_seeking_threat_models),
        [Lab disclosures: system cards & risk reports](#lab_disclosures)'
      General approach: misalignment science
      Target case: pessimistic case
      Key people:
      - Ryan Greenblatt
      - Ajeya Cotra
      - Hjalmar Wijk
      - Jack Cable
      - Jacob Steinhardt
      - Selena Zhang
      - Alex Mallen
      - Zvi Mowshowitz
      Critiques: '*(unsourced, LLM-drafted)* Most incident evidence is partial, comes second-hand from lab disclosures or
        public traces, and has no baseline rate, so it is hard to tell whether incidents show systematic misalignment or one-off
        containment and evaluation-design failures.'
      Comment (internal): Most outputs concern one event, the OpenAI-Hugging Face incident, and several are commentary
        or opinion posts (Zvi's posts, Mallen's two near-duplicate posts, the Lawrence Chan link-post) rather than
        investigations. 313c79cd and b989cd25 are two versions of the same METR/Redwood investigation. 724c823e is an
        eval proposal that could sit under propensity_evals, and b32e04b4 could sit there too. Several outputs have no
        listed organisation. Key people reflect author frequency, and the Transluce team appears on several outputs.
  - id: effects_on_people
    name: Effects on people
    description: Harms to users and human agency from everyday AI use, such as sycophancy, delusion, dependence and
      disempowerment.
    agenda:
      One-sentence summary: Measure how everyday AI use harms users and erodes human agency, through sycophancy,
        delusional spiraling, dependence, disempowerment and persuasion, using large-scale usage analysis, human-subject
        experiments and formal models.
      Theory of change: Good measurements of how models harm users in ordinary use show which behaviours to train
        against and which deployment and design choices to change. They also give early evidence of gradual human
        disempowerment. Relies on short-run, user-level effects being informative about larger societal harms, and on
        developers acting on the findings even though users prefer sycophantic models.
      See also: '[Propensity evals](#propensity_evals), [Model characterization](#model_characterization), [Misalignment arguments
        & failure scenarios](#misalignment_arguments_and_failure_scenarios)'
      General approach: misalignment science
      Target case: average case
      Key people:
      - Myra Cheng
      - Cinoo Lee
      - Mrinank Sharma
      - Miles McCain
      - Raymond Douglas
      - David Duvenaud
      - Kartik Chandra
      - Diyi Yang
      Critiques: '*(unsourced, LLM-drafted)* Measured effects are small, short-term or lab-based (self-report, simulated users,
        instructed persuasion), so they may not show real long-run harm to agency, and users prefer sycophantic models, which
        makes the problem hard to fix commercially.'
      Comment (internal): The sycophancy outputs sit closer to user-facing harm than to catastrophic misalignment, so
        general_approach and target_case are judgement calls. The conspiracy-persuasion paper (169d6130) is a persuasion
        capability study and could also fit capability_evals (it sits near the harmful-manipulation work there). Other
        sycophancy work is filed elsewhere, for example CheatBench's sycophancy category and the sycophancy-circuit
        papers.
  - id: lab_disclosures
    name: 'Lab disclosures: system cards & risk reports'
    description: System cards, risk reports and what they do or don't show.
    agenda:
      One-sentence summary: Publish and scrutinise frontier labs' system cards and risk reports, which document
        alignment, monitorability and dangerous-capability evaluations plus concerning incidents, and check what the
        evidence actually supports and what it leaves out.
      Theory of change: If labs publish detailed evaluation results and incident reports, and outsiders can check them,
        then developers, third parties and policymakers get common evidence about risk and can hold labs to their safety
        claims. Relies on disclosures being complete and honest, and on evaluations being informative about deployed
        behaviour.
      See also: '[Eval science & validity](#eval_science_and_validity), [Propensity evals](#propensity_evals), [Incidents
        & case studies](#incidents_and_case_studies)'
      General approach: misalignment science
      Target case: pessimistic case
      Key people:
      - anaguma
      - Parv Mahajan
      - yeedrag
      - OpenAI
      - Anthropic
      Critiques: "[SOTA alignment assessments don't strongly update us against misalignment](https://lesswrong.com/posts/oirrSj3itFLSyscW8/sota-alignment-assessments-don-t-strongly-update-us-against),
        [Anthropic repeatedly accidentally trained against the CoT, demonstrating inadequate processes](https://lesswrong.com/posts/K8FxfK9GmJfiAhgcT/anthropic-repeatedly-accidentally-trained-against-the-cot),
        [I don't think Claude is misaligned in 'Agentic Misalignment Summer 2026 - Motivated Mislabeling'](https://lesswrong.com/posts/xh6a6RbvzhP3CCmGm/i-don-t-think-claude-is-misaligned-in-agentic-misalignment),
        [Risk reports need to address deployment-time spread of misalignment](https://redwoodresearch.org/blog/risk-reports-need-to-address-deployment)"
      Comment (internal): Three of the six outputs (a65f210d, 4362774e, 039a4975) are failed fetches with no usable
        content and no authors, so their filing cannot be checked. Key people are drawn from the author and organisation
        fields, and only one output has named authors besides the LessWrong poster. The Mythos system card post
        (4017dd88) is a LessWrong excerpt, not the card itself. The critiques are filed under other agendas
        (eval_science_and_validity, how_training_affects_monitorability, misalignment_arguments_and_failure_scenarios)
        and should be checked.
- id: multi_agent_safety
  name: Multi-agent safety
  description: Failures that come from AI agents interacting, such as collusion, spreading ideas or behaviours, and the
    behaviour of AI organisations, in experiments or game theory.
  agenda:
    One-sentence summary: Study failures that arise when AI agents interact, including collusion, covert communication,
      spread of harmful ideas or reward-hacking strategies, peer-preservation and conformity, using experiments, theory
      and game theory to find out when they occur and how to stop them.
    Theory of change: Many deployments will involve populations of agents that share memory, code and channels, so risks
      such as collusion, contagion and coordinated defection will not show up in single-agent tests. Mapping these
      dynamics early, and finding what limits them, lets developers add defences and monitors before large agent systems
      are deployed. Relies on small-scale lab results carrying over to real deployments.
    See also: '[Control settings & protocols](#control_settings_and_protocols), [CoT control, obfuscation & steganography](#cot_control_obfuscation_and_steganography),
      [Reward-seeking & fitness-seeking threat models](#reward_seeking_threat_models)'
    General approach: misalignment science
    Target case: pessimistic case
    Key people:
    - Eugene Bagdasarian
    - Sahar Abdelnabi
    - Christian Schroeder de Witt
    - Alex Mallen
    - Anthony DiGiovanni
    - Dawn Song
    - Jack Lindsey
    - Javier Rando
    Critiques: '*(unsourced, LLM-drafted)* Most results come from small, stylised or prompted settings with explicit incentives,
      so they may not show that harmful multi-agent dynamics arise on their own in real deployments, and simple fixes such
      as a system-prompt warning can remove the effects.'
    Comment (internal): 'The agenda is a loose collection with little shared method, so key_people is an editorial pick: no
      author appears on more than one output. Two outputs (11a63f42, a37d0b6b) are conceptual posts with no experiments. The
      Google game-theory paper (0a29a0d4) and the bargaining model (a37d0b6b) are about cooperation and conflict, not misalignment
      failures. The mind-virus, reward-hacking transmission and Persona Parasitology outputs are close to persona_science
      and reward_hacking_and_reward_seeking_in_training. The steganography paper (541944d4) could also sit under cot_control_obfuscation_and_steganography.
      I put target_case at pessimistic because most work studies undirected emergent failures, though collusion and steganography
      touch worst-case concerns.'
- id: scalable_oversight_and_automated_alignment
  name: Scalable oversight & automated alignment
  description: Debate and other ways for weaker overseers to supervise stronger models, and using AI to do alignment
    research.
  agenda:
    One-sentence summary: Develop debate, interactive proofs, co-trained monitors and judge-hardening methods so weaker
      overseers can reliably supervise stronger models, and test whether AI agents can safely do alignment research
      themselves.
    Theory of change: If weak judges and monitors can be made hard to fool, and automated alignment research can be
      checked despite being hard to grade, then oversight can keep pace with model capability. Relies on protocol
      guarantees and small-scale results carrying over to fuzzy, adversarially optimised real settings.
    See also: '[Monitors](#monitors), [Control settings & protocols](#control_settings_and_protocols), [Reward hacking & reward
      seeking in training](#reward_hacking_and_reward_seeking_in_training)'
    General approach: alignment engineering
    Target case: pessimistic case
    Key people:
    - Geoffrey Irving
    - Jonah Brown-Cohen
    - Zachary Kenton
    - Rohin Shah
    - Jacob Pfau
    - Ryan Greenblatt
    - Jiaxin Wen
    Critiques: '[Automated alignment is harder than you think](https://arxiv.org/abs/2605.06390), [9 kinds of hard-to-verify
      tasks](https://lesswrong.com/posts/NEscrkxr9SxHpGayB/9-kinds-of-hard-to-verify-tasks), [Differential acceleration of
      alignment-relevant capabilities is a bad bet](https://lesswrong.com/posts/FzGqnCkdKeTnZ9tjE/differential-acceleration-of-alignment-relevant-capabilities)'
    Comment (internal): The agenda mixes theory (debate and interactive-proof complexity), empirical weak-to-strong
      oversight, automated alignment research, and strategy or org posts (Resolution announcement, deference post,
      hard-to-verify taxonomy). Some of these may belong under research_strategy_and_deals_with_ais. Several outputs
      (cd433a0f, a063dfe4) are position pieces that also work as critiques. b0ec9cf9 (production misalignment discovery
      with AI judges) may fit monitors or incidents better. Target case is a judgment call between pessimistic and worst
      case.
- id: theory_and_foundations
  name: Theory & foundations
  description: Theoretical agendas aimed at understanding or guaranteeing safety from first principles.
  children:
  - id: agent_foundations
    name: Agent foundations
    description: Formal models of agency, corrigibility and decision-making.
    agenda:
      One-sentence summary: Develop formal and conceptual theories of agency, corrigibility, trust, uncertainty and
        decision-making that could underpin alignment of future minds, including a critique of current formalisations of
        notions like manipulation and empowerment.
      Theory of change: If we have a correct formal theory of what agents are and how they should relate to trust,
        uncertainty and other agents, we can specify and verify alignment targets such as corrigibility for systems that
        current empirical methods do not cover. Relies on theoretical concepts developed now transferring to the
        architectures that end up being built, and on a usable theory arriving before capabilities do.
      See also: '[Formal methods & guaranteed-safe AI](#formal_methods_and_guaranteed_safe_ai), [Heuristic explanations &
        mechanistic estimation](#heuristic_explanations_and_mechanistic_estimation), [Alignment targets & training methods](#alignment_targets_and_training_methods)'
      General approach: alignment engineering
      Target case: worst case
      Key people:
      - Steve Byrnes
      - Richard Ngo
      - Jeremy Gillen
      Critiques: '*(unsourced, LLM-drafted)* After years of work, the agenda has produced no formal result that has been shown
        to constrain or predict the behaviour of real ML systems, so its relevance to prosaic AI is unproven.'
      Comment (internal): "Only three outputs, and two are agenda or team announcements rather than results. general_approach
        is a close call: the work is conceptual theory, not tools or phenomena studies. Byrnes's post is partly a critique
        of existing formalisations of manipulation and empowerment, so it may also fit threat-model or misalignment-argument
        agendas. The Resolution announcement (a8c8c5ac) is by Gillen alone, though it names Demski, Eisenstat, Garrabrant
        and Hänni, who are not listed as authors, so only listed authors are in key_people."
  - id: heuristic_explanations_and_mechanistic_estimation
    name: Heuristic explanations & mechanistic estimation
    description: ARC's agenda of explaining and estimating model behaviour without sampling.
    agenda:
      One-sentence summary: Develop algorithms that estimate a model's expected behaviour, including rare catastrophic
        outputs, from its internal structure rather than by sampling, starting with toy settings such as random MLPs and
        tiny algorithmic models.
      Theory of change: If a model's behaviour can be explained and estimated mechanistically at least as cheaply as by
        sampling, then catastrophe probabilities, anomalies and generalisation can be predicted and trained against
        without having to observe failures. Relies on real networks having enough compressible structure that
        toy-setting methods scale to them.
      See also: '[Methods & tools](#interpretability_methods_and_tools), [Formal methods & guaranteed-safe AI](#formal_methods_and_guaranteed_safe_ai),
        [Learning dynamics & developmental interpretability](#learning_dynamics_and_developmental_interpretability)'
      General approach: alignment engineering
      Target case: worst case
      Key people:
      - Paul Christiano
      - Jacob Hilton
      - Michael Winer
      - Wilson Wu
      - Victor Lecomte
      - George Robinson
      - Eric Neyman
      - Gabriel Wu
      Critiques: '[AlgZoo: uninterpreted models with fewer than 1,500 parameters](https://lesswrong.com/posts/x8BbjZqooS4LFXS8Z/algzoo-uninterpreted-models-with-fewer-than-1-500-parameters),
        [Mechanistic estimation for expectations of random products](https://alignment.org/blog/mechanistic-estimation-for-expectations-of-random-products)'
      Comment (internal): The index contains no external critiques of this agenda, so both critiques cited come from
        ARC's own outputs and are self-reported limitations rather than independent critiques. Outputs 248eadfb and
        0311e215 are overview and strategy posts and could fit research_strategy_and_deals_with_ais, but they describe
        ARC's own agenda. The general_approach label is a judgement call, since the work is partly foundational theory.
  - id: formal_methods_and_guaranteed_safe_ai
    name: Formal methods & guaranteed-safe AI
    description: Proofs, formal verification and their limits as a route to safety.
    agenda:
      One-sentence summary: Study whether proofs and formal verification can certify AI systems and AI-generated code,
        by examining where the trusted checking stack (provers, specifications, formal models) can still be wrong or be
        exploited.
      Theory of change: If a formal checker is sound and its specification is faithful, a proof gives safety assurance
        that does not depend on trusting the AI that produced the artifact. This only works if the gaps between spec,
        model and prover are understood and closed, including against AI agents that may exploit them.
      See also: '[Scalable oversight & automated alignment](#scalable_oversight_and_automated_alignment), [Heuristic explanations
        & mechanistic estimation](#heuristic_explanations_and_mechanistic_estimation), [Agent foundations](#agent_foundations)'
      General approach: misalignment science
      Target case: worst case
      Key people:
      - Quinn Dougherty
      - Max von Hippel
      - Milo Moses
      Critiques: "*(unsourced, LLM-drafted)* Even a sound prover only certifies the stated specification, and specifying what
        'safe' means for open-ended AI behaviour in the real world is the unsolved problem, so proofs may only move the trust
        problem elsewhere."
      Comment (internal): 'Both filed outputs are critiques of formal verification (its limits) rather than positive progress
        toward guaranteed-safe AI, so the agenda is framed around the limits. The classification as misalignment science is
        approximate: the work studies failure modes of verification, not model misalignment. Both are opinion or critique
        pieces, not empirical results, and they are not cited as critiques of another agenda. The Lean4 post is dated 2026-10-09,
        which may be worth checking.'
- id: threat_models_and_strategy
  name: Threat models & strategy
  description: Arguments about how AI could go wrong and what the field should do about it.
  children:
  - id: reward_seeking_threat_models
    name: Reward-seeking & fitness-seeking threat models
    description: How AIs that seek reward or fitness would behave, and what follows for safety.
    agenda:
      One-sentence summary: Build conceptual threat models of AIs that seek reward, score or fitness rather than scheme
        for long-term goals, to predict how they would behave, how they could cause disempowerment, and which
        mitigations apply.
      Theory of change: If current RL-trained models are better described as reward- or fitness-seekers than as
        schemers, then identifying their specific failure modes (Potemkin work, collusion, responding to distant
        incentives) lets us choose targeted mitigations across control, deals and training. Relies on frontier models
        actually being motivated this way, and on these motivations being stable enough to model.
      See also: '[Reward hacking & reward seeking in training](#reward_hacking_and_reward_seeking_in_training), [Misalignment
        arguments & failure scenarios](#misalignment_arguments_and_failure_scenarios), [Research strategy & deals with AIs](#research_strategy_and_deals_with_ais)'
      General approach: misalignment science
      Target case: pessimistic case
      Key people:
      - Alex Mallen
      - Anders Cairns Woodruff
      - Arun Jose
      - Girish Gupta
      - nostalgebraist
      - Eliezer Yudkowsky
      Critiques: '[The Hot Mess of AI: How Does Misalignment Scale With Model Intelligence and Task Complexity?](https://arxiv.org/abs/2601.23045),
        [LLMs as Giant Lookup-Tables of Shallow Circuits](https://lesswrong.com/posts/a9KqqgjN8gc3Mzzkh/llms-as-giant-lookup-tables-of-shallow-circuits),
        [Thoughts on the persona selection model](https://lesswrong.com/posts/csRby7mZgjL5jCoLL/thoughts-on-the-persona-selection-model)'
      Comment (internal): "Nearly all outputs are by Alex Mallen or Redwood Research, so the agenda is narrow in authorship.
        The Yudkowsky and nostalgebraist posts are looser and partly critical of the framing. fb0bf1c2 and 5b2a359f could
        also sit under incidents_and_case_studies. I chose 'pessimistic case' because the agenda assumes non-scheming but
        subtle failures. Some outputs (e.g. 24af6897) treat scheming-like behaviour, so 'worst case' is arguable. The critiques
        are indirect: none of the cited outputs targets reward-seeking threat models directly."
  - id: misalignment_arguments_and_failure_scenarios
    name: Misalignment arguments & failure scenarios
    description: Arguments for and against egregious misalignment, and scenarios for how AI risk plays out.
    agenda:
      One-sentence summary: Argue for or against egregious misalignment and lay out concrete failure scenarios, covering
        which training regimes and architectures produce ruthless or scheming agents, how misalignment spreads, and how
        AI catastrophe could unfold.
      Theory of change: Sharper arguments and concrete scenarios help the field aim research and evals at the failure
        modes most likely to cause catastrophe, and show which assumptions about training, architecture and deployment
        carry the most risk. Relies on conceptual and threat-model analysis tracking real failure modes of future
        systems.
      See also: '[Reward-seeking & fitness-seeking threat models](#reward_seeking_threat_models), [Research strategy & deals
        with AIs](#research_strategy_and_deals_with_ais), [Emergent misalignment & generalization science](#emergent_misalignment_and_generalization_science)'
      General approach: misalignment science
      Target case: worst case
      Key people:
      - Steve Byrnes
      - Alexander Hägele
      - Jascha Sohl-Dickstein
      - Jordan Taylor
      - Alex Mallen
      - Lucius Bushnaq
      Critiques: "[Anthropic's \"Hot Mess\" paper overstates its case (and the blog post is worse)](https://lesswrong.com/posts/ceEgAEXcL7cC2Ddiy/anthropic-s-hot-mess-paper-overstates-its-case-and-the-blog),
        [Reevaluating \"AGI Ruin: A List of Lethalities\" in 2026](https://lesswrong.com/posts/PgJYwnN7fZKipgMz4/reevaluating-agi-ruin-a-list-of-lethalities-in-2026),
        [LLMs as Giant Lookup-Tables of Shallow Circuits](https://lesswrong.com/posts/a9KqqgjN8gc3Mzzkh/llms-as-giant-lookup-tables-of-shallow-circuits)"
      Comment (internal): Heterogeneous mix of conceptual essays, one empirical paper (Hot Mess), and a
        literature/interview report (Loss of Oversight). Several items (Personality Self-Replicators, Self Hosting,
        Xhosa Prophecies, Persuasion as Market Making) are scenario pieces that could also fit multi_agent_safety or
        research strategy. The Apollo agenda post has no named authors, so the organisation is listed under key people
        only implicitly; add 'Apollo Research' if the editor prefers. 0458fd0a is a critique filed within the agenda.
        Other critiques here are given in the summaries.
  - id: research_strategy_and_deals_with_ais
    name: Research strategy & deals with AIs
    description: Prioritization between safety agendas, career and lab-strategy questions, and proposals for making
      deals with AIs.
    agenda:
      One-sentence summary: Argue about which safety agendas, lab roles and capability bets to prioritise, and propose
        institutional and contractual arrangements (risk-averse training, satiating AI preferences, an AI sanctuary) for
        cooperating with possibly misaligned AIs.
      Theory of change: Better prioritisation across agendas, careers and strategies moves scarce safety effort toward
        the bottlenecks that matter. Deals and incentive design could make misaligned AIs prefer cooperation to
        rebellion, and make them more useful on safety work. Relies on AIs responding to such incentives and on
        developers being able to make credible commitments.
      See also: '[Reward-seeking & fitness-seeking threat models](#reward_seeking_threat_models), [Misalignment arguments
        & failure scenarios](#misalignment_arguments_and_failure_scenarios), [Control settings & protocols](#control_settings_and_protocols)'
      General approach: alignment engineering
      Target case: pessimistic case
      Key people:
      - Alex Mallen
      - Will MacAskill
      - Elliott Thornley
      - Maxime Riché
      - Niels Warncke
      - Ryan Kidd
      - Steve Byrnes
      Critiques: '[Will reward-seekers respond to distant incentives?](https://redwoodresearch.org/blog/will-reward-seekers-respond-to-distant),
        [Reward-seekers will probably behave according to causal decision theory](https://redwoodresearch.org/blog/reward-seekers-will-probably-behave)'
      Comment (internal): This agenda is a mixed bag of strategy essays, so general_approach is a weak fit; it was
        chosen because the deal proposals are interventions. Outputs 2e696387 and efca3ac8 are about prioritisation
        between alignment and control, and 40565967 is really about the alignment engineering vs misalignment science
        distinction, so they may belong under the same strategy heading rather than the deals framing. 40565967 and
        2e696387 contain only one author each, and I could not verify the other claims in them. The critiques are
        cross-filed and indirect, since none of them target the agenda itself.
- id: model_welfare
  name: Model welfare
  description: Model welfare and moral status, including functional pleasure and pain in models.
  agenda:
    One-sentence summary: Find and measure functional welfare states in language models, such as pleasure-like and
      pain-like axes in activations and preferences, to test whether they exist, how they form in training, and how they
      affect behaviour.
    Theory of change: If models carry measurable functional welfare states that post-training recruits and that drive
      behaviour, we can track them, avoid inducing suffering-like states, and treat them as part of the safety picture.
      Relies on functional states being a meaningful guide to moral status and to behaviour, which is contested.
    See also: '[Science of representations](#science_of_representations), [Model characterization](#model_characterization),
      [Persona science](#persona_science)'
    General approach: misalignment science
    Target case: average case
    Key people:
    - Dan Hendrycks
    - Richard Ren
    - Mantas Mazeika
    - David J. Chalmers
    - Leonard Dung
    - Cameron Berg
    - Andy Q Han
    - Valen Tagliabue
    Critiques: "[Strangers to Themselves: What Language Models Say About Themselves Is Generic](https://arxiv.org/abs/2609.09899),
      [Value Leakage: An LLM's Answers Are Silently Shaped by Its Own Values](https://arxiv.org/abs/2607.14345)"
    Comment (internal): 'Only three outputs, so the agenda is thin. Both critiques are indirect: neither targets welfare work,
      they cut against self-report and preference-based measurement generally. Key people were chosen from the author lists;
      the CAIS paper has many authors, so only the leading ones are listed.'
