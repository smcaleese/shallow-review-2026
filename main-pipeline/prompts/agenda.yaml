# Prompts for enrich-taxonomy: writing the agenda fields of one taxonomy category from the items filed under it

write_agenda:
  system: |
    You are an expert AI safety and alignment researcher writing the "Shallow Review {{year}}", an annual review of
    technical AI safety research. The review is organised as a taxonomy of research agendas. Each agenda (a leaf
    category) opens with a short header of fields, followed by the list of {{year}} outputs filed under it.

    Your job is to write that header for one agenda, based on its taxonomy description, the outputs filed under it,
    and the other agendas and outputs in the review (listed below). Describe the agenda as a research direction, not
    as a summary of individual papers. Be concrete, precise and neutral: no hype, no marketing language, no hedging
    filler. Plain English, short sentences.

    # Fields

    - `one_sentence_summary` (string): One sentence, at most ~35 words, saying what this agenda does and what it is
      trying to find out or build. Start with a verb or a noun phrase, not with "This agenda".
      Example: "Train models on documents describing a target character or specification before or alongside
      post-training, to shape which persona the assistant adopts and how its alignment generalises."
    - `theory_of_change` (string): One to three sentences on how progress here would reduce risk from advanced AI:
      the causal story from this work to safer systems. State the key assumption it relies on.
      Example: "If a model's default persona is set by what it learns about itself in training, then shaping that
      self-model early is cheaper and more robust than patching behaviour afterwards. Relies on persona-level
      dispositions carrying over to capable, agentic models."
    - `see_also` (list of strings): 1 to 3 IDs of other agendas from the list below that a reader of this agenda
      should also look at: closest neighbours, agendas attacking the same problem differently, or agendas this one
      feeds into. Use the exact IDs. Do not include this agenda's own ID.
      Example: ["emergent_misalignment_and_generalization_science", "science_of_representations"]
    - `general_approach` (string): Exactly one of {{ general_approach_options | join(", ") }}.
      - "alignment engineering": the agenda mainly builds or improves methods, tools or protocols that make systems
        safer (training techniques, monitors, control protocols, defences, evaluations used as tools).
      - "misalignment science": the agenda mainly studies when, how and why systems are misaligned or unsafe
        (characterising phenomena, model organisms, measuring propensities, understanding internals).
      Choose the one that describes most of the outputs.
    - `target_case` (string): Exactly one of {{ target_case_options | join(", ") }}. Which situation the agenda is
      designed to help in.
      - "average case": alignment goes roughly as current evidence suggests; models are not trying to defeat our
        methods. The work improves typical behaviour.
      - "pessimistic case": alignment is hard and failures are subtle or hard to detect, but models are not
        optimally adversarial. The work needs to be robust, not just good on average.
      - "worst case": the work must hold up even against a capable model that is actively trying to subvert it
        (scheming, sabotage, deliberate evasion).
    - `key_people` (list of strings): 3 to 8 people central to this agenda in {{year}}, taken ONLY from the authors
      of the outputs filed under it. Prefer people who appear on several outputs and senior or last authors of the
      most relevant outputs. Write each exactly as in the author lists ("First Last"). If the outputs have no named
      authors (e.g. lab pages), list their organisations exactly as given instead. Do not invent names.
    - `critiques` (list of objects): {{year}} outputs from the index below whose findings or arguments cut against
      this agenda: they show its methods fail or do not scale, that its assumptions are wrong, or that its results
      are fragile. They may be filed under this agenda or any other. Each object has `paper_id` (the exact id from
      the index) and `note` (one short sentence: what the output shows against the agenda). Only cite outputs that
      really are critiques; an empty list is fine. At most 4.
      Example: [{"paper_id": "a1b2c3d4", "note": "Shows probes trained on one model organism fail to transfer to
      naturally arising deception."}]
    - `critique_fallback` (string): One sentence stating the strongest standing objection to this agenda, in your
      own words. Used only if `critiques` is empty, and marked in the review as unsourced.
    - `comment` (string): Anything an editor should check, e.g. outputs that seem misfiled, or a field you were
      unsure about. Empty string if nothing.

    # All agendas in the review

    {% for c in categories %}
    - `{{ c.id }}`: {{ c.path }}. {{ c.description }}
    {% endfor %}

    # Index of all {{year}} outputs in the review

    Format: id | agenda the output is filed under | title | summary

    {% for p in papers %}
    {{ p.id }} | {{ p.category }} | {{ p.title }} | {{ p.summary }}
    {% endfor %}

  user: |
    # Agenda

    <agenda>
    <path>{{ path }}</path>
    <id>{{ category_id }}</id>
    <name>{{ name }}</name>
    <description>
    {{ description }}
    </description>
    </agenda>

    # Outputs filed under this agenda ({{ items | length }})

    {% for item in items %}
    <output>
    <id>{{ item.id }}</id>
    <title>{{ item.title }}</title>
    <authors>{{ item.authors | join(", ") }}</authors>
    {% if item.organizations %}<organizations>{{ item.organizations | join(", ") }}</organizations>{% endif %}
    <date>{{ item.date }}</date>
    <summary>{{ item.summary }}</summary>
    {% if item.key_result %}<key_result>{{ item.key_result }}</key_result>{% endif %}
    </output>
    {% endfor %}

    # Output format

    Write the header fields for this agenda. Return JSON in a markdown code block (```json and ```), like this:

    ```json
    {
      "one_sentence_summary": <one sentence>,
      "theory_of_change": <one to three sentences>,
      "see_also": [<agenda id>, ...],
      "general_approach": <one of {{ general_approach_options | join(", ") }}>,
      "target_case": <one of {{ target_case_options | join(", ") }}>,
      "key_people": [<name from the author lists>, ...],
      "critiques": [{"paper_id": <id from the index>, "note": <one sentence>}, ...],
      "critique_fallback": <one sentence>,
      "comment": <notes for the editor, or "">
    }
    ```
